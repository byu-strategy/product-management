<svg viewBox="0 0 1000 566" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>Ways to tell a computer what to do</title>
<desc>Two at the top: you, and Claude Code. You talk to Claude Code in plain English. Below them, three interfaces side by side: GUI apps, windows and buttons you point at; the terminal and shell, commands you type; and APIs, requests sent between programs. You use GUI apps and the terminal. Claude Code uses the shell and APIs. All three sit on the same layer below them, the operating system (macOS, Windows, or Linux), which manages files, programs, and the network, and runs on your computer's hardware. A two-way link labeled internet connects the operating system to other computers: Anthropic, which runs the model, highlighted; GitHub; Supabase; and Vercel. The GUI and the shell are side by side: neither goes through the other.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0057B8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5A6672"/></marker><marker id="ags" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#5A6672"/></marker><linearGradient id="nav" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B3D73"/><stop offset="1" stop-color="#002E5D"/></linearGradient><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.13"/></filter></defs>
<rect width="1000" height="566" rx="8" fill="#FAFBFC"/>
<circle cx="200" cy="78" r="38" fill="#E6EEF7"/>
<g transform="translate(183,61) scale(1.417)" fill="none" stroke="#002E5D" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
  <circle cx="12" cy="7" r="4" /></g>

<text x="200" y="142" font-size="19" font-weight="700" fill="#002E5D" text-anchor="middle">You</text>
<rect x="480" y="40" width="190" height="84" rx="12" fill="#FFFFFF" stroke="#0057B8" stroke-width="2" filter="url(#sh)"/>
<g transform="translate(559,52) scale(1.333)" fill="none" stroke="#0057B8" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M20 16V7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v9m16 0H4m16 0 1.28 2.55a1 1 0 0 1-.9 1.45H3.62a1 1 0 0 1-.9-1.45L4 16" /></g>

<text x="575" y="108" font-size="19" font-weight="700" fill="#0057B8" text-anchor="middle">Claude Code</text>
<line x1="242" y1="78" x2="474" y2="78" stroke="#5A6672" stroke-width="2" marker-end="url(#ag)"/>
<text x="358" y="66" font-size="15" font-weight="600" fill="#5A6672" text-anchor="middle" paint-order="stroke" stroke="#FAFBFC" stroke-width="6">plain English</text>
<rect x="40" y="216" width="210" height="150" rx="12" fill="#FFFFFF" stroke="#D9DEE4" stroke-width="1.5"/>
<circle cx="145.0" cy="252" r="21" fill="#E6EEF7"/>
<g transform="translate(133,240) scale(1)" fill="none" stroke="#002E5D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2" />
  <path d="M10 4v4" />
  <path d="M2 8h20" />
  <path d="M6 4v4" /></g>

<text x="145.0" y="302" font-size="18" font-weight="700" fill="#002E5D" text-anchor="middle">GUI apps</text>
<text x="145.0" y="329" font-size="16" font-weight="400" fill="#5A6672" text-anchor="middle">windows and buttons</text>
<text x="145.0" y="350" font-size="16" font-weight="400" fill="#5A6672" text-anchor="middle">you point at</text>
<rect x="280" y="216" width="210" height="150" rx="12" fill="#FFFFFF" stroke="#D9DEE4" stroke-width="1.5"/>
<circle cx="385.0" cy="252" r="21" fill="#E6EEF7"/>
<g transform="translate(373,240) scale(1)" fill="none" stroke="#002E5D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 11 2-2-2-2" />
  <path d="M11 13h4" />
  <rect width="18" height="18" x="3" y="3" rx="2" ry="2" /></g>

<text x="385.0" y="302" font-size="18" font-weight="700" fill="#002E5D" text-anchor="middle">Terminal and shell</text>
<text x="385.0" y="329" font-size="16" font-weight="400" fill="#5A6672" text-anchor="middle">commands</text>
<text x="385.0" y="350" font-size="16" font-weight="400" fill="#5A6672" text-anchor="middle">you type</text>
<rect x="520" y="216" width="210" height="150" rx="12" fill="#FFFFFF" stroke="#D9DEE4" stroke-width="1.5"/>
<circle cx="625.0" cy="252" r="21" fill="#E6EEF7"/>
