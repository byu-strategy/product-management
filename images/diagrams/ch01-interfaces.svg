  <path d="M15 8V2" />
  <path d="M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z" /></g>

<text x="625.0" y="302" font-size="18" font-weight="700" fill="#002E5D" text-anchor="middle">APIs</text>
<text x="625.0" y="329" font-size="16" font-weight="400" fill="#5A6672" text-anchor="middle">requests sent</text>
<text x="625.0" y="350" font-size="16" font-weight="400" fill="#5A6672" text-anchor="middle">between programs</text>
<line x1="180" y1="148" x2="150" y2="210" stroke="#5A6672" stroke-width="2" marker-end="url(#ag)"/>
<line x1="222" y1="148" x2="350" y2="210" stroke="#5A6672" stroke-width="2" marker-end="url(#ag)"/>
<line x1="540" y1="126" x2="430" y2="210" stroke="#0057B8" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="600" y1="126" x2="620" y2="210" stroke="#0057B8" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="145.0" y1="368" x2="145.0" y2="408" stroke="#5A6672" stroke-width="2" marker-end="url(#ag)"/>
<line x1="385.0" y1="368" x2="385.0" y2="408" stroke="#5A6672" stroke-width="2" marker-end="url(#ag)"/>
<line x1="625.0" y1="368" x2="625.0" y2="408" stroke="#5A6672" stroke-width="2" marker-end="url(#ag)"/>
<rect x="40" y="414" width="690" height="76" rx="12" fill="url(#nav)" filter="url(#sh)"/>
<text x="385" y="448" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">The operating system</text>
<text x="385" y="474" font-size="16" font-weight="400" fill="#C9D8EA" text-anchor="middle">macOS, Windows, Linux: files, programs, network</text>
<rect x="40" y="506" width="690" height="40" rx="10" fill="#E9ECEF"/>
<text x="385" y="532" font-size="17" font-weight="600" fill="#5A6672" text-anchor="middle">Your computer's hardware</text>
<rect x="800" y="216" width="170" height="330" rx="12" fill="#F1F5FA" stroke="#B9D0EA" stroke-width="1.5"/>
<g transform="translate(871,232) scale(1.167)" fill="none" stroke="#002E5D" stroke-width="1.89" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z" /></g>

<text x="885.0" y="286" font-size="17" font-weight="700" fill="#002E5D" text-anchor="middle">Other computers</text>
<rect x="814" y="304" width="142" height="56" rx="8" fill="#FFFFFF" stroke="#0057B8" stroke-width="2"/>
<text x="885.0" y="328" font-size="16" font-weight="700" fill="#0057B8" text-anchor="middle">Anthropic</text>
<text x="885.0" y="349" font-size="15" font-weight="400" fill="#0057B8" text-anchor="middle">runs the model</text>
<rect x="814" y="372" width="142" height="40" rx="8" fill="#FFFFFF" stroke="#D9DEE4" stroke-width="1.5"/>
<text x="885.0" y="398" font-size="15" font-weight="400" fill="#2C3E50" text-anchor="middle">GitHub</text>
<rect x="814" y="424" width="142" height="40" rx="8" fill="#FFFFFF" stroke="#D9DEE4" stroke-width="1.5"/>
<text x="885.0" y="450" font-size="15" font-weight="400" fill="#2C3E50" text-anchor="middle">Supabase</text>
<rect x="814" y="476" width="142" height="40" rx="8" fill="#FFFFFF" stroke="#D9DEE4" stroke-width="1.5"/>
<text x="885.0" y="502" font-size="15" font-weight="400" fill="#2C3E50" text-anchor="middle">Vercel</text>
<line x1="736" y1="452" x2="794" y2="452" stroke="#5A6672" stroke-width="2" marker-end="url(#ag)" marker-start="url(#ags)"/>
<text x="767" y="438" font-size="15" font-weight="600" fill="#5A6672" text-anchor="middle" paint-order="stroke" stroke="#FAFBFC" stroke-width="6">internet</text>
