<text x="772" y="267" font-size="19" font-weight="700" fill="#002E5D" text-anchor="start">APIs</text>
<text x="724" y="310" font-size="16" font-weight="400" fill="#5A6672" text-anchor="start">requests sent</text>
<text x="724" y="331" font-size="16" font-weight="400" fill="#5A6672" text-anchor="start">between programs</text>
<line x1="280" y1="148" x2="200" y2="214" stroke="#5A6672" stroke-width="2" marker-end="url(#ag)"/>
<line x1="322" y1="148" x2="440" y2="214" stroke="#5A6672" stroke-width="2" marker-end="url(#ag)"/>
<line x1="712" y1="126" x2="560" y2="214" stroke="#0057B8" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="790" y1="126" x2="820" y2="214" stroke="#0057B8" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="170.0" y1="350" x2="170.0" y2="398" stroke="#5A6672" stroke-width="2" marker-end="url(#ag)"/>
<line x1="500.0" y1="350" x2="500.0" y2="398" stroke="#5A6672" stroke-width="2" marker-end="url(#ag)"/>
<line x1="830.0" y1="350" x2="830.0" y2="398" stroke="#5A6672" stroke-width="2" marker-end="url(#ag)"/>
<rect x="40" y="404" width="920" height="76" rx="12" fill="url(#nav)" filter="url(#sh)"/>
<text x="500" y="438" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">The operating system</text>
<text x="500" y="464" font-size="16" font-weight="400" fill="#C9D8EA" text-anchor="middle">macOS, Windows, Linux: files, programs, network, screen</text>
<rect x="40" y="496" width="920" height="40" rx="10" fill="#E9ECEF"/>
