<svg viewBox="0 0 1000 590" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>One tool call, step by step</title>
<desc>One tool call in Claude Code, in four steps. Step 1: with every request, Claude Code sends the model a list of the tools it can call, each with a name and the inputs it takes, for example Read with a file path, Edit with a file path and the old and new text, and Bash with a command; MCP servers add more tools to this list. Step 2: the model writes a tool call, which is text in a fixed format: the tool name Edit, the file app.py, the old text todos.remove(item), and the new text that adds save(todos). Then it stops and waits. Step 3: Claude Code, running on your computer, handles the call: a hook can block it, a permission rule allows it, asks you, or denies it, and only then does Claude Code run the tool and change the file. Step 4: the result, a line of text saying the file was updated or an error, is added to the conversation, and the model reads it and decides its next step. The model never touches your computer; it only writes text.</desc>
<defs>
<linearGradient id="nav" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E3F6A"/><stop offset="1" stop-color="#002E5D"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0A2E4D" flood-opacity="0.13"/></filter>
<marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0057B8"/></marker>
<marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8A939C"/></marker>
</defs>
<rect width="1000" height="590" rx="8" fill="#FAFBFC"/>

<!-- zone labels -->
<rect x="560" y="30" width="410" height="530" rx="14" fill="#F4F7FB" stroke="#B9D0EA" stroke-width="1.5"/>
<text x="584" y="62" font-size="15" font-weight="700" letter-spacing="1.5" fill="#5A6672">CLAUDE CODE, ON YOUR COMPUTER</text>

<!-- 1 tool list -->
<rect x="40" y="74" width="470" height="150" rx="12" fill="#FFFFFF" stroke="#D9DEE4" stroke-width="1.5"/>
<circle cx="40" cy="74" r="15" fill="#0057B8"/><text x="40" y="79.5" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">1</text>
<text x="64" y="108" font-size="18" font-weight="700" fill="#002E5D">Tools it can call</text>
<text x="490" y="106" text-anchor="end" font-size="15" fill="#5A6672">Claude Code sends this list</text>
<g font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#2C3E50">
<text x="64" y="140">Read(file_path)</text>
<text x="64" y="166">Edit(file_path, old, new)</text>
<text x="64" y="192">Bash(command)</text>
</g>
<text x="490" y="192" text-anchor="end" font-size="15" fill="#5A6672">+ tools from MCP servers</text>
<path d="M135,226 L135,262" stroke="#8A939C" stroke-width="2" fill="none" marker-end="url(#aG)"/>

<!-- model -->
<rect x="40" y="268" width="190" height="150" rx="14" fill="url(#nav)" filter="url(#sh)"/>
<g transform="translate(117,290) scale(1.5)" fill="none" stroke="#FFFFFF" stroke-width="1.47" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8" />
  <rect width="16" height="12" x="4" y="8" rx="2" />
  <path d="M2 14h2" />
  <path d="M20 14h2" />
  <path d="M15 13v2" />
  <path d="M9 13v2" /></g>
<text x="135" y="356" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">Model</text>
<text x="135" y="382" text-anchor="middle" font-size="16" fill="#C9D8EA">decides the</text>
<text x="135" y="402" text-anchor="middle" font-size="16" fill="#C9D8EA">next step</text>
<path d="M230,330 L262,330" stroke="#0057B8" stroke-width="2.5" fill="none" marker-end="url(#aB)"/>

<!-- 2 tool call -->
<rect x="268" y="254" width="262" height="178" rx="12" fill="#FFFFFF" stroke="#0057B8" stroke-width="2" filter="url(#sh)"/>
<circle cx="268" cy="254" r="15" fill="#0057B8"/><text x="268" y="259.5" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">2</text>
<text x="290" y="284" font-size="18" font-weight="700" fill="#0057B8">Tool call</text>
<g font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#2C3E50">
<text x="290" y="314" font-weight="700">Edit</text>
<text x="290" y="338">file: app.py</text>
<text x="290" y="362">old: todos.remove(item)</text>
<text x="290" y="386">new: todos.remove(item)</text>
<text x="335" y="408">save(todos)</text>
</g>
<text x="399" y="456" text-anchor="middle" font-size="15" fill="#5A6672">then it stops and waits</text>
<path d="M530,330 L600,330 L600,128 L614,128" stroke="#0057B8" stroke-width="2.5" fill="none" marker-end="url(#aB)"/>

<!-- 3 gates -->
<circle cx="600" cy="92" r="15" fill="#0057B8"/><text x="600" y="97.5" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">3</text>
<g>
<rect x="620" y="94" width="326" height="72" rx="10" fill="#FFFFFF" stroke="#D9DEE4"/>
<circle cx="656" cy="130" r="20" fill="#E6EEF7"/><g transform="translate(644,118) scale(1)" fill="none" stroke="#002E5D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" />
  <path d="m9 12 2 2 4-4" /></g>
<text x="690" y="125" font-size="18" font-weight="600" fill="#2C3E50">Hook</text>
<text x="690" y="148" font-size="16" fill="#5A6672">can block the call</text>
<path d="M783,166 L783,190" stroke="#8A939C" stroke-width="2" fill="none" marker-end="url(#aG)"/>
<rect x="620" y="196" width="326" height="72" rx="10" fill="#FFFFFF" stroke="#D9DEE4"/>
<circle cx="656" cy="232" r="20" fill="#E6EEF7"/><g transform="translate(644,220) scale(1)" fill="none" stroke="#002E5D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
  <path d="M7 11V7a5 5 0 0 1 10 0v4" /></g>
<text x="690" y="227" font-size="18" font-weight="600" fill="#2C3E50">Permission</text>
<text x="690" y="250" font-size="16" fill="#5A6672">allow, ask you, or deny</text>
<path d="M783,268 L783,292" stroke="#8A939C" stroke-width="2" fill="none" marker-end="url(#aG)"/>
<rect x="620" y="298" width="326" height="72" rx="10" fill="#FFFFFF" stroke="#0057B8" stroke-width="1.5"/>
<circle cx="656" cy="334" r="20" fill="#E6EEF7"/><g transform="translate(644,322) scale(1)" fill="none" stroke="#0057B8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3" /></g>
<text x="690" y="329" font-size="18" font-weight="600" fill="#2C3E50">Run the tool</text>
<text x="690" y="352" font-size="16" fill="#5A6672">app.py changes on disk</text>
</g>
<path d="M783,370 L783,432" stroke="#0057B8" stroke-width="2.5" fill="none" marker-end="url(#aB)"/>

<!-- 4 result -->
<rect x="620" y="438" width="326" height="110" rx="12" fill="#FFFFFF" stroke="#0057B8" stroke-width="2" filter="url(#sh)"/>
<circle cx="620" cy="438" r="15" fill="#0057B8"/><text x="620" y="443.5" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">4</text>
<text x="642" y="470" font-size="18" font-weight="700" fill="#0057B8">Result</text>
<g font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#2C3E50">
<text x="642" y="500">Updated app.py</text>
<text x="642" y="526" fill="#5A6672">or an error message</text>
</g>
<path d="M620,500 L135,500 L135,424" stroke="#0057B8" stroke-width="2.5" fill="none" marker-end="url(#aB)"/>
<text x="378" y="528" text-anchor="middle" font-size="16" font-weight="600" fill="#0057B8" paint-order="stroke" stroke="#FAFBFC" stroke-width="6">added to the conversation</text>
<text x="378" y="550" text-anchor="middle" font-size="15" fill="#5A6672">the model reads it and decides again</text>
</svg>