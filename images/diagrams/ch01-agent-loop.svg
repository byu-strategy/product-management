<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="t1 d1" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title id="t1">The agent loop: gather context, act, check</title>
  <desc id="d1">A circular loop of three phases joined by clockwise arrows around a center labeled The model decides the next step. Gather context, at the top, means read and search. Act, at the lower right, means edit, write, and run commands. Check, at the lower left, means running the tests or the app. From Check, the loop either returns to Gather context or, when the check passes, exits to a box reading stop and report. To the side, a person icon notes that you can press Esc to interrupt, add context, or redirect.</desc>
  <defs>
    <linearGradient id="al-node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E3F6A"/>
      <stop offset="100%" stop-color="#001A36"/>
    </linearGradient>
    <linearGradient id="al-hub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E6EEF7"/>
    </linearGradient>
    <marker id="al-royal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0057B8"/>
    </marker>
    <marker id="al-navy" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#002E5D"/>
    </marker>
    <filter id="al-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0a2e4d" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1000" height="620" rx="8" fill="#FAFBFC"/>

  <!-- Faint orbit -->
  <circle cx="430" cy="350" r="200" fill="none" stroke="#E3E9F0" stroke-width="14"/>

  <!-- Loop arcs (accent) -->
  <path d="M498.4,162.1 A200,200 0 0 1 627.0,384.7" fill="none" stroke="#0057B8" stroke-width="4" stroke-linecap="round" marker-end="url(#al-royal)"/>
  <path d="M558.6,503.2 A200,200 0 0 1 301.4,503.2" fill="none" stroke="#0057B8" stroke-width="4" stroke-linecap="round" marker-end="url(#al-royal)"/>
  <path d="M233.0,384.7 A200,200 0 0 1 361.6,162.1" fill="none" stroke="#0057B8" stroke-width="4" stroke-linecap="round" marker-end="url(#al-royal)"/>

  <!-- Hub -->
  <circle cx="430" cy="350" r="82" fill="url(#al-hub)" stroke="#B9D0EA" stroke-width="1.5" filter="url(#al-shadow)"/>
  <text x="430" y="342" text-anchor="middle" font-size="20" font-weight="700" fill="#002E5D">The model</text>
  <text x="430" y="368" text-anchor="middle" font-size="16" fill="#5A6672">decides the</text>
  <text x="430" y="388" text-anchor="middle" font-size="16" fill="#5A6672">next step</text>

  <!-- Node: Gather context (top) -->
  <circle cx="430" cy="150" r="50" fill="url(#al-node)" filter="url(#al-shadow)"/>
  <g transform="translate(409.0,129.0) scale(1.7500)" fill="none" stroke="#FFFFFF" stroke-width="1.714" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8" /> <path d="m21 21-4.3-4.3" /></g>
  <text x="430" y="50" text-anchor="middle" font-size="21" font-weight="700" fill="#002E5D">Gather context</text>
  <text x="430" y="76" text-anchor="middle" font-size="17" fill="#5A6672">read, search</text>

  <!-- Node: Act (lower right) -->
  <circle cx="603.2" cy="450" r="50" fill="url(#al-node)" filter="url(#al-shadow)"/>
  <g transform="translate(583.2,430.0) scale(1.6667)" fill="none" stroke="#FFFFFF" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z" /> <path d="m15 5 4 4" /></g>
  <text x="674" y="444" font-size="21" font-weight="700" fill="#002E5D">Act</text>
  <text x="674" y="470" font-size="17" fill="#5A6672">edit, write, run</text>

  <!-- Node: Check (lower left) -->
  <circle cx="256.8" cy="450" r="50" fill="url(#al-node)" filter="url(#al-shadow)"/>
  <g transform="translate(234.8,428.0) scale(1.8333)" fill="none" stroke="#FFFFFF" stroke-width="1.909" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" /></g>
  <text x="186" y="444" text-anchor="end" font-size="21" font-weight="700" fill="#002E5D">Check</text>
  <text x="186" y="470" text-anchor="end" font-size="17" fill="#5A6672">tests, the app</text>

  <!-- Exit -->
  <line x1="256.8" y1="503" x2="256.8" y2="546" stroke="#002E5D" stroke-width="2.5" marker-end="url(#al-navy)"/>
  <rect x="146.8" y="552" width="220" height="40" rx="20" fill="#FFFFFF" stroke="#002E5D" stroke-width="1.5"/>
  <text x="256.8" y="578" text-anchor="middle" font-size="17" font-weight="600" fill="#002E5D">Passes: stop, report</text>

  <!-- You -->
  <line x1="800" y1="140" x2="800" y2="560" stroke="#E3E7EB" stroke-width="1.5"/>
  <circle cx="890" cy="316" r="38" fill="#E6EEF7"/>
  <g transform="translate(870.0,296.0) scale(1.6667)" fill="none" stroke="#002E5D" stroke-width="1.500" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" /> <circle cx="12" cy="7" r="4" /></g>
  <text x="890" y="378" text-anchor="middle" font-size="19" font-weight="700" fill="#2C3E50">You</text>
  <text x="890" y="404" text-anchor="middle" font-size="16" fill="#5A6672">Esc to interrupt,</text>
  <text x="890" y="425" text-anchor="middle" font-size="16" fill="#5A6672">add context,</text>
  <text x="890" y="446" text-anchor="middle" font-size="16" fill="#5A6672">or redirect</text>
</svg>
