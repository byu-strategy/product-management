<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>An agent loop in a product, with its three stopping rules</title>
  <desc>Left zone, the model: it reads every message and writes text. Right zone, your code, the harness. Along the top arc the model sends a tool request; before the tool runs, rule 3, a person approves anything costly or hard to undo. Your code runs the tool, and the result returns along the bottom arc as a new message. Rule 1, the budget, counts each pass, for example step 3 of 8. Rule 2, the stop condition: when the model makes no tool request, the loop ends with an answer.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#F3F6F9"/>
    </linearGradient>
    <linearGradient id="tint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EEF3F9"/><stop offset="100%" stop-color="#DCE7F3"/>
    </linearGradient>
    <linearGradient id="zone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F1F5FA"/><stop offset="100%" stop-color="#E6EEF7"/>
    </linearGradient>
    <linearGradient id="navyg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E3F6A"/><stop offset="100%" stop-color="#001F40"/>
    </linearGradient>
    <linearGradient id="royalg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A6CC8"/><stop offset="100%" stop-color="#004A9E"/>
    </linearGradient>
    <linearGradient id="royalh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1A6CC8"/><stop offset="100%" stop-color="#004A9E"/>
    </linearGradient>
    <linearGradient id="navyh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5D7A96"/><stop offset="100%" stop-color="#2F4D6B"/>
    </linearGradient>
    <linearGradient id="greeng" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A8F5D"/><stop offset="100%" stop-color="#256A41"/>
    </linearGradient>
    <linearGradient id="redg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C04848"/><stop offset="100%" stop-color="#9C3131"/>
    </linearGradient>
    <filter id="sh" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0a2e4d" flood-opacity="0.13"/>
    </filter>
    <filter id="shs" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#0a2e4d" flood-opacity="0.12"/>
    </filter>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="#8A939C"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="#0057B8"/>
    </marker>
    <marker id="ahn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="#002E5D"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="560" rx="8" fill="#FAFBFC"/>
  <rect x="500" y="20" width="480" height="520" rx="14" fill="url(#zone)"/>
  <text x="270" y="56" font-size="15" font-weight="700" fill="#5A6672" text-anchor="middle" letter-spacing="1.2">THE MODEL WRITES TEXT</text>
  <text x="740" y="56" font-size="15" font-weight="700" fill="#002E5D" text-anchor="middle" letter-spacing="1.2">YOUR CODE ACTS</text>
  <rect x="205" y="228" width="190" height="124" rx="16" fill="#0E3F6A" filter="url(#shs)"/>
  <rect x="205" y="228" width="190" height="124" rx="16" fill="url(#navyg)"/>
  <g transform="translate(280.2 254.2) scale(1.6500)" fill="none" stroke="#FFFFFF" stroke-width="1.455" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8" /> <rect width="16" height="12" x="4" y="8" rx="2" /> <path d="M2 14h2" /> <path d="M20 14h2" /> <path d="M15 13v2" /> <path d="M9 13v2" /></g>
  <text x="300" y="330" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">Model</text>
  <rect x="665" y="228" width="190" height="124" rx="16" fill="url(#card)" stroke="#D3DCE5" stroke-width="1" filter="url(#sh)"/>
  <g transform="translate(741.1 255.1) scale(1.5750)" fill="none" stroke="#002E5D" stroke-width="1.524" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" /></g>
  <text x="760" y="330" font-size="19" font-weight="700" fill="#002E5D" text-anchor="middle">Run the tool</text>
  <path d="M 340 224 C 380 120, 680 120, 720 222" fill="none" stroke="#0057B8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ahr)"/>
  <text x="470" y="132" font-size="16" font-weight="700" fill="#0057B8" text-anchor="middle">tool request</text>
  <circle cx="619" cy="156" r="26" fill="#FFFFFF" stroke="#0057B8" stroke-width="2" filter="url(#shs)"/>
  <g transform="translate(603.7 141.7) scale(1.2750)" fill="none" stroke="#002E5D" stroke-width="1.882" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" /> <circle cx="12" cy="7" r="4" /></g>
  <circle cx="643" cy="134" r="12" fill="url(#navyg)" filter="url(#shs)"/>
  <text x="643" y="139.5" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="663" y="106" font-size="15" font-weight="400" fill="#5A6672" text-anchor="start">costly or hard to undo:</text>
  <text x="663" y="125" font-size="15" font-weight="400" fill="#5A6672" text-anchor="start">a person approves first</text>
  <path d="M 720 356 C 680 470, 380 470, 340 356" fill="none" stroke="#8A939C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/>
  <text x="530" y="476" font-size="16" font-weight="600" fill="#5A6672" text-anchor="middle">result, as a new message</text>
  <rect x="456" y="412" width="148" height="36" rx="18" fill="#FFFFFF" stroke="#B9D0EA" stroke-width="1.5" filter="url(#shs)"/>
  <circle cx="476" cy="430" r="12" fill="url(#navyg)" filter="url(#shs)"/>
  <text x="476" y="435.5" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="542" y="436" font-size="16" font-weight="700" fill="#002E5D" text-anchor="middle">step 3 of 8</text>
  <path d="M 202 290 L 120 290" fill="none" stroke="#002E5D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ahn)"/>
  <rect x="36" y="244" width="84" height="92" rx="12" fill="url(#card)" stroke="#D3DCE5" stroke-width="1" filter="url(#sh)"/>
  <g transform="translate(60.9 262.9) scale(1.4250)" fill="none" stroke="#002E5D" stroke-width="1.684" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" /> <path d="M8 12a2 2 0 0 0 2-2V8H8" /> <path d="M14 12a2 2 0 0 0 2-2V8h-2" /></g>
  <text x="78" y="320" font-size="15" font-weight="600" fill="#002E5D" text-anchor="middle">answer</text>
  <circle cx="160" cy="264" r="12" fill="url(#navyg)" filter="url(#shs)"/>
  <text x="160" y="269.5" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="160" y="320" font-size="15" font-weight="400" fill="#5A6672" text-anchor="middle">no tool</text>
  <text x="160" y="338" font-size="15" font-weight="400" fill="#5A6672" text-anchor="middle">request</text>
  <circle cx="60" cy="519" r="11" fill="url(#navyg)" filter="url(#shs)"/>
  <text x="60" y="524.5" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="80" y="524" font-size="15" font-weight="600" fill="#2C3E50" text-anchor="start">budget</text>
  <circle cx="260" cy="519" r="11" fill="url(#navyg)" filter="url(#shs)"/>
  <text x="260" y="524.5" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="280" y="524" font-size="15" font-weight="600" fill="#2C3E50" text-anchor="start">stop condition</text>
  <circle cx="460" cy="519" r="11" fill="url(#navyg)" filter="url(#shs)"/>
  <text x="460" y="524.5" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="480" y="524" font-size="15" font-weight="600" fill="#2C3E50" text-anchor="start">a human decides</text>
</svg>
