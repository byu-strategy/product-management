<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="t d" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">The disruptive innovation model</title>
<desc id="d">A chart with time on the horizontal axis and product performance on the vertical axis. A shaded band, the performance customers can use, rises slowly from left to right. Its top edge is the most demanding customers, its bottom edge the least demanding customers, and a dashed line through the middle the mainstream customers. A steep dark line, the incumbent's sustaining improvements, starts inside the band, crosses its top edge, and keeps rising above it; a double-headed arrow between that line and the top of the band is labeled overshoot. Two blue lines show the entrant's product. One starts on the bottom edge of the band, labeled low-end foothold, overserved customers. The other, dashed, starts below the band, labeled new-market foothold, nonconsumers. Both rise more steeply than the band and cross the mainstream line, each crossing marked with a circle labeled good enough for mainstream customers.</desc>
<defs>
  <marker id="axm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A939C"/></marker>
  <marker id="gym" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6672"/></marker>
  <marker id="navm" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#002E5D"/></marker>
  <marker id="accm" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0057B8"/></marker>
  <linearGradient id="band" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E9F0F8"/><stop offset="1" stop-color="#D5E2F1"/></linearGradient>
</defs>
<rect x="0" y="0" width="1000" height="600" rx="8" fill="#FAFBFC"/>
<path d="M110.0,250.0 L830.0,160.0 L830.0,364.0 L110.0,430.0 Z" fill="url(#band)"/>
<line x1="110" y1="250.0" x2="830" y2="160.0" stroke="#6E8BAE" stroke-width="1.8"/>
<line x1="110" y1="340.0" x2="830" y2="262.0" stroke="#6E8BAE" stroke-width="1.5" stroke-dasharray="6 5"/>
<line x1="110" y1="430.0" x2="830" y2="364.0" stroke="#6E8BAE" stroke-width="1.8"/>
<line x1="110" y1="540" x2="110" y2="40" stroke="#8A939C" stroke-width="1.6" marker-end="url(#axm)"/>
<line x1="110" y1="540" x2="850" y2="540" stroke="#8A939C" stroke-width="1.6" marker-end="url(#axm)"/>
<text x="72" y="290" font-size="18" font-weight="600" fill="#2C3E50" text-anchor="middle" transform="rotate(-90 72 290)">Product performance</text>
<text x="850" y="572" font-size="18" font-weight="600" fill="#2C3E50" text-anchor="end">Time</text>
<text x="842" y="158.0" font-size="16" font-weight="600" fill="#2C3E50">Most demanding</text>
<text x="842" y="178.0" font-size="16" fill="#5A6672">customers</text>
<text x="842" y="260.0" font-size="16" font-weight="600" fill="#2C3E50">Mainstream</text>
<text x="842" y="280.0" font-size="16" fill="#5A6672">customers</text>
<text x="842" y="362.0" font-size="16" font-weight="600" fill="#2C3E50">Least demanding</text>
<text x="842" y="382.0" font-size="16" fill="#5A6672">customers</text>
<text x="816" y="328.0" font-size="17" font-weight="600" fill="#2C3E50" text-anchor="end">Performance</text>
<text x="816" y="350.0" font-size="17" font-weight="600" fill="#2C3E50" text-anchor="end">customers can use</text>
<line x1="110" y1="300.0" x2="700" y2="62.0" stroke="#002E5D" stroke-width="3.2" marker-end="url(#navm)"/>
<text x="330" y="199.3" font-size="18" font-weight="600" fill="#002E5D" transform="rotate(-21.97 330 199.3)">Incumbent's sustaining improvements</text>
<path d="M600,110.3 V182.8" stroke="#5A6672" stroke-width="1.5" marker-start="url(#gym)" marker-end="url(#gym)"/>
<text x="612" y="151.5" font-size="17" font-weight="600" fill="#5A6672">Overshoot</text>
<line x1="260" y1="416.2" x2="770" y2="202.1" stroke="#0057B8" stroke-width="3.2" marker-end="url(#accm)"/>
<circle cx="260" cy="416.2" r="6" fill="#0057B8"/>
<circle cx="556.7" cy="291.6" r="7" fill="#FFFFFF" stroke="#0057B8" stroke-width="2.5"/>
<line x1="260" y1="466.2" x2="770" y2="252.1" stroke="#0057B8" stroke-width="3.2" stroke-dasharray="9 6" marker-end="url(#accm)"/>
<circle cx="260" cy="466.2" r="6" fill="#0057B8"/>
<circle cx="717.2" cy="274.2" r="7" fill="#FFFFFF" stroke="#0057B8" stroke-width="2.5"/>
<text x="244" y="386.2" font-size="17" font-weight="700" fill="#0057B8" text-anchor="end">Low-end foothold</text>
<text x="244" y="406.2" font-size="16" fill="#2C3E50" text-anchor="end">overserved customers</text>
<text x="244" y="468.2" font-size="17" font-weight="700" fill="#0057B8" text-anchor="end">New-market foothold</text>
<text x="244" y="488.2" font-size="16" fill="#2C3E50" text-anchor="end">nonconsumers</text>
<text x="542.7" y="251.6" font-size="17" font-weight="600" fill="#2C3E50" text-anchor="end">Good enough for</text>
<text x="542.7" y="272.6" font-size="17" font-weight="600" fill="#2C3E50" text-anchor="end">mainstream customers</text>
<line x1="546.7" y1="265.6" x2="551.7" y2="285.6" stroke="#5A6672" stroke-width="1.3"/>
<text x="600" y="261.5" font-size="18" font-weight="700" fill="#0057B8" transform="rotate(-22.78 600 261.5)">Entrant's product</text>
</svg>
