<text x="36" y="62" font-size="16" font-weight="600" fill="#0057B8">My shifts</text>
<text x="298" y="100" font-size="15" fill="#0057B8" text-anchor="end">Add to calendar</text>
<text x="178" y="100" font-size="15" fill="#0057B8" text-anchor="end">Message manager</text>
<text x="22" y="144" font-size="26" font-weight="700" fill="#002E5D">Thursday shift</text>
