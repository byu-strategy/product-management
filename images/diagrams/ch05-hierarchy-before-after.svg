<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 710" role="img" aria-labelledby="t d" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">ShiftSwap shift detail, before and after</title>
<desc id="d">Two phone screens of the ShiftSwap shift detail page, each with a blurred copy beside it. Before: four buttons of the same size and the same blue sit in a row, Give away, Swap, Message manager, and Add to calendar. Blurred, the four buttons form one undifferentiated blue band. After: Give away this shift is the only filled button, full width at the bottom within thumb reach; Swap for another shift is an outlined button below it; Message manager and Add to calendar are small text links at the top. Blurred, only the Give away button stands out. Nothing was removed; only the ranking changed.</desc>
<defs>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#002E5D" flood-opacity="0.13"/>
  </filter>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#5A6672"/>
  </marker>
  <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#0057B8"/>
  </marker>
  <marker id="arrN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#002E5D"/>
  </marker>
  <linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBFCFD"/><stop offset="1" stop-color="#EFF3F8"/></linearGradient>
  <linearGradient id="stepG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F1F6FB"/><stop offset="1" stop-color="#E1EAF5"/></linearGradient>
  <linearGradient id="navyG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B4178"/><stop offset="1" stop-color="#002E5D"/></linearGradient>
  <linearGradient id="royalG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1A6BCB"/><stop offset="1" stop-color="#0057B8"/></linearGradient>
  <linearGradient id="phoneG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FBFCFE"/></linearGradient>
<g id="scrBefore"><rect x="0" y="0" width="320" height="560" rx="24" fill="url(#phoneG)" stroke="#D9DEE4" stroke-width="1.5"/>
<rect x="126.0" y="10" width="68" height="20" rx="10" fill="#1F2933"/>
<text x="26" y="28" font-size="15" font-weight="600" fill="#2C3E50">9:41</text>
<g transform="translate(250,14) scale(0.7083)" fill="none" stroke="#2C3E50" stroke-width="2.541" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h.01" />
  <path d="M7 20v-4" />
