<line x1="22" y1="220" x2="298" y2="220" stroke="#D9DEE4" stroke-width="1.5"/>
<text x="22" y="250" font-size="16" fill="#5A6672">Eligible coworkers</text>
<text x="298" y="250" font-size="16" font-weight="600" fill="#2C3E50" text-anchor="end">6</text>
<text x="22" y="280" font-size="16" fill="#5A6672">Manager</text>
<text x="298" y="280" font-size="16" font-weight="600" fill="#2C3E50" text-anchor="end">Dana R.</text>
<line x1="22" y1="300" x2="298" y2="300" stroke="#D9DEE4" stroke-width="1.5"/>
<rect x="20" y="420" width="280" height="54" rx="10" fill="url(#royalG)"/>
<text x="160.0" y="454" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Give away this shift</text>
<rect x="20" y="484" width="280" height="46" rx="10" fill="#fff" stroke="#0057B8" stroke-width="1.5"/>
<text x="160.0" y="513" font-size="17" font-weight="600" fill="#0057B8" text-anchor="middle">Swap for another shift</text></g>
