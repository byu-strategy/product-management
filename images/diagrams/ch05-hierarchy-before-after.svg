<rect x="0" y="0" width="1000" height="710" rx="8" fill="#FAFBFC"/>
<text x="30" y="46" font-size="15" font-weight="700" fill="#5A6672" letter-spacing="1.5">BEFORE</text>
<text x="30" y="78" font-size="22" font-weight="700" fill="#002E5D">Four equal buttons</text>
<g transform="translate(30,118)" filter="url(#sh)"><use href="#scrBefore"/></g>
<text x="366" y="124" font-size="15" font-weight="700" fill="#5A6672" letter-spacing="1">Squinted</text>
