<text x="197.0" y="345" font-size="15" font-weight="500" fill="#fff" text-anchor="middle">Message</text>
<text x="197.0" y="364" font-size="15" font-weight="500" fill="#fff" text-anchor="middle">manager</text>
<rect x="236.0" y="318" width="70" height="62" rx="8" fill="url(#royalG)"/>
<text x="271.0" y="345" font-size="15" font-weight="500" fill="#fff" text-anchor="middle">Add to</text>
<text x="271.0" y="364" font-size="15" font-weight="500" fill="#fff" text-anchor="middle">calendar</text></g>
