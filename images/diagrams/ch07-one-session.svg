ze="16" paint-order="stroke" stroke="#F6F8FB" stroke-width="7" stroke-linejoin="round" fill="#2C3E50">token</text><line x1="300" y1="405" x2="690" y2="405" stroke="#002E5D" stroke-width="2" marker-end="url(#aN)"/><text x="500.0" y="395" text-anchor="middle" font-size="16" paint-order="stroke" stroke="#F6F8FB" stroke-width="7" stroke-linejoin="round" fill="#2C3E50">publishable key + token</text><line x1="700" y1="437" x2="310" y2="437" stroke="#002E5D" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#aG)"/><text x="500.0" y="459" text-anchor="middle" font-size="16" paint-order="stroke" stroke="#F6F8FB" stroke-width="7" stroke-linejoin="round" fill="#2C3E50">only your rows</text><rect x="712" y="407" width="28" height="28" rx="6" fill="#FFFFFF" stroke="#002E5D" stroke-width="1.5"/><g transform="translate(717,412) scale(0.75)" fill="none" stroke="#002E5D" stroke-width="2.93" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
