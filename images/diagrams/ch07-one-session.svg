<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>One session in this course's stack</title>
<desc>Four columns: the browser, on the user's machine; your server, Next.js running on Vercel; Supabase, which handles sign-in and the database; and paid services such as Claude and Stripe. A dashed line between the browser and the rest marks where the user's control ends. Four numbered moments run top to bottom. 1, open the app: your server sends the page code to the browser. 2, sign in: the browser sends email and password to Supabase, which returns a token. 3, load your tasks: the browser sends the publishable key and the token straight to Supabase, where row-level security checks the token and returns only your rows. 4, use an AI feature: the browser sends a request and the token to your server, the server calls the paid service with a secret key that never leaves the server, and the result comes back to the server and then to the browser as an answer.</desc>
