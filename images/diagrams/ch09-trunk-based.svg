<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 852" role="img" aria-labelledby="tbd-t tbd-d" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="tbd-t">Trunk-based development, solo and on a team</title>
<desc id="tbd-d">Four panels on one shared time axis of three days. Each panel has a dark main line, and each row of branches belongs to one named maker. Panel 1, solo, straight to main: you commit directly on main, seven commits over three days, with no branches. Panel 2, solo with two Claude Code sessions: session 1 and session 2 each work in their own row; each makes two short branches, and each branch leaves main and merges back the same day. Panel 3, a team of two: Ana makes ratings-1 on day 1 and ratings-2 from day 2 into day 3; Ben makes fix-signup from day 1 into day 2 and signup-email on day 3. Every branch merges into the same main within a day or two. Ana starts ratings-2 just after Ben merges fix-signup, so her branch includes his fix; Ben starts signup-email just after Ana merges ratings-2. Panel 4, a team of two with long-lived branches, for contrast: Ana and Ben each keep one branch open for all three days, collecting many commits, while main gets nothing; both merge at the end of day 3 at one point marked in red, merge conflicts.</desc>
