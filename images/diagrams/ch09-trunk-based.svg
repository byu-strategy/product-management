<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 584" role="img" aria-labelledby="tbd-t tbd-d" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="tbd-t">Trunk-based development versus long-lived branches</title>
<desc id="tbd-d">Two panels on the same three-week time axis. Top, trunk-based: one main line, the trunk, with many small branches that leave main and merge back within hours to two days; several are open at the same time, above and below the line. Bottom, long-lived branches: two branches, feature-rating and feature-search, leave main in week 1 and drift further from it for almost three weeks while main keeps changing. Both come back at the end in one large merge, marked in red, where their changes conflict.</desc>
