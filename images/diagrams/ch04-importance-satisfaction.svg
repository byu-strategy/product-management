<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title id="t">Importance versus satisfaction</title>
  <desc id="d">A two by two grid. The vertical axis is importance of the user need, low at the bottom to high at the top. The horizontal axis is user satisfaction with current solutions, low on the left to high on the right. The top left quadrant, high importance and low satisfaction, is shaded and labeled opportunity: it matters and is poorly met today. The top right quadrant, high importance and high satisfaction, is labeled competitive: it matters and is already met well. The whole bottom half, low importance at any level of satisfaction, is labeled not worth going after. Adapted from Dan Olsen, The Lean Product Playbook.</desc>
  <defs>
    <linearGradient id="gHot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E3EDF8"/>
      <stop offset="100%" stop-color="#CCDDF0"/>
    </linearGradient>
    <linearGradient id="gCell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3F5F7"/>
    </linearGradient>
    <filter id="sh" filterUnits="userSpaceOnUse" x="0" y="0" width="1000" height="520">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0A2E4D" flood-opacity="0.14"/>
    </filter>
    <marker id="ax" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A939C"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="520" rx="8" fill="#FAFBFC"/>

  <!-- grid -->
  <rect x="170" y="30" width="800" height="400" rx="10" fill="#FAFBFC" filter="url(#sh)"/>
  <rect x="170" y="30" width="800" height="400" rx="10" fill="url(#gCell)"/>
  <path d="M180,30 H570 V230 H170 V40 a10,10 0 0 1 10,-10 Z" fill="url(#gHot)"/>
  <line x1="570" y1="30" x2="570" y2="230" stroke="#D9DEE4" stroke-width="1.5"/>
  <line x1="170" y1="230" x2="970" y2="230" stroke="#D9DEE4" stroke-width="1.5"/>
  <rect x="170" y="30" width="800" height="400" rx="10" fill="none" stroke="#D9DEE4" stroke-width="1.5"/>

  <!-- quadrant labels -->
  <text x="370" y="124" text-anchor="middle" font-size="26" font-weight="700" fill="#0057B8">Opportunity</text>
  <text x="370" y="154" text-anchor="middle" font-size="17" fill="#2C3E50">Matters, poorly met today</text>
  <text x="770" y="124" text-anchor="middle" font-size="24" font-weight="700" fill="#002E5D">Competitive</text>
  <text x="770" y="154" text-anchor="middle" font-size="17" fill="#5A6672">Matters, already met well</text>
  <text x="570" y="324" text-anchor="middle" font-size="24" font-weight="700" fill="#8A939C">Not worth going after</text>
  <text x="570" y="354" text-anchor="middle" font-size="17" fill="#8A939C">Matters little, however well it is met</text>

  <!-- y axis -->
  <line x1="144" y1="430" x2="144" y2="38" stroke="#8A939C" stroke-width="2" marker-end="url(#ax)"/>
  <text x="130" y="50" text-anchor="end" font-size="17" fill="#5A6672">High</text>
  <text x="130" y="430" text-anchor="end" font-size="17" fill="#5A6672">Low</text>
  <text x="78" y="230" text-anchor="middle" font-size="19" font-weight="600" fill="#2C3E50" transform="rotate(-90 78 230)">Importance of user need</text>

  <!-- x axis -->
  <line x1="170" y1="456" x2="962" y2="456" stroke="#8A939C" stroke-width="2" marker-end="url(#ax)"/>
  <text x="170" y="486" font-size="17" fill="#5A6672">Low</text>
  <text x="970" y="486" text-anchor="end" font-size="17" fill="#5A6672">High</text>
  <text x="570" y="486" text-anchor="middle" font-size="19" font-weight="600" fill="#2C3E50">User satisfaction with current solutions</text>
</svg>
