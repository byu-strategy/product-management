<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>The jagged frontier</title>
  <desc>Tasks that look about equally hard, divided by a jagged line. Inside the shaded region the model does well: write a React component, summarize a meeting. Just outside, nearby tasks it fails: a fact past the training cutoff, long arithmetic across a table, exact counting over tokens. A dashed line shows that the edge moves with each release. A side panel: in the BCG experiment with 758 consultants, on the one task just outside the frontier, about 84 percent were right without AI and roughly 60 to 70 percent using GPT-4.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#F3F6F9"/>
    </linearGradient>
    <linearGradient id="tint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EEF3F9"/><stop offset="100%" stop-color="#DCE7F3"/>
    </linearGradient>
    <linearGradient id="zone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F1F5FA"/><stop offset="100%" stop-color="#E6EEF7"/>
    </linearGradient>
    <linearGradient id="navyg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E3F6A"/><stop offset="100%" stop-color="#001F40"/>
    </linearGradient>
    <linearGradient id="royalg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A6CC8"/><stop offset="100%" stop-color="#004A9E"/>
    </linearGradient>
    <linearGradient id="royalh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1A6CC8"/><stop offset="100%" stop-color="#004A9E"/>
    </linearGradient>
    <linearGradient id="navyh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5D7A96"/><stop offset="100%" stop-color="#2F4D6B"/>
    </linearGradient>
    <linearGradient id="greeng" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A8F5D"/><stop offset="100%" stop-color="#256A41"/>
    </linearGradient>
    <linearGradient id="redg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C04848"/><stop offset="100%" stop-color="#9C3131"/>
    </linearGradient>
    <filter id="sh" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0a2e4d" flood-opacity="0.13"/>
    </filter>
    <filter id="shs" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#0a2e4d" flood-opacity="0.12"/>
    </filter>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="#8A939C"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="#0057B8"/>
    </marker>
    <marker id="ahn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="#002E5D"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="540" rx="8" fill="#FAFBFC"/>
  <text x="40" y="50" font-size="15" font-weight="700" fill="#002E5D" text-anchor="start" letter-spacing="1.2">INSIDE: THE MODEL DOES WELL</text>
  <text x="620" y="50" font-size="15" font-weight="700" fill="#5A6672" text-anchor="end" letter-spacing="1.2">OUTSIDE: IT FAILS</text>
  <clipPath id="mapclip"><rect x="40" y="70" width="580" height="440" rx="12"/></clipPath>
  <rect x="40" y="70" width="580" height="440" rx="12" fill="#FFFFFF" stroke="#D3DCE5" stroke-width="1" filter="url(#sh)"/>
  <g clip-path="url(#mapclip)">
  <polygon points="40,70 330,70 270,140 440,200 300,270 450,330 310,390 420,450 350,510 40,510" fill="url(#tint)"/>
  <polyline points="372,70 312,140 482,200 342,270 492,330 352,390 462,450 392,510" fill="none" stroke="#6495ED" stroke-width="2" stroke-dasharray="6 6"/>
  <polyline points="330,70 270,140 440,200 300,270 450,330 310,390 420,450 350,510" fill="none" stroke="#002E5D" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <circle cx="76" cy="200" r="8" fill="url(#navyg)" stroke="#002E5D" stroke-width="2"/>
  <text x="94" y="196" font-size="17" font-weight="600" fill="#002E5D" text-anchor="start">Write a React</text>
  <text x="94" y="217" font-size="17" font-weight="600" fill="#002E5D" text-anchor="start">component</text>
  <circle cx="76" cy="330" r="8" fill="url(#navyg)" stroke="#002E5D" stroke-width="2"/>
  <text x="94" y="326" font-size="17" font-weight="600" fill="#002E5D" text-anchor="start">Summarize</text>
  <text x="94" y="347" font-size="17" font-weight="600" fill="#002E5D" text-anchor="start">a meeting</text>
  <circle cx="492" cy="140" r="8" fill="#FFFFFF" stroke="#5A6672" stroke-width="2"/>
  <text x="510" y="136" font-size="17" font-weight="400" fill="#2C3E50" text-anchor="start">A fact past</text>
  <text x="510" y="157" font-size="17" font-weight="400" fill="#2C3E50" text-anchor="start">the cutoff</text>
  <circle cx="492" cy="270" r="8" fill="#FFFFFF" stroke="#5A6672" stroke-width="2"/>
  <text x="510" y="266" font-size="17" font-weight="400" fill="#2C3E50" text-anchor="start">Long</text>
  <text x="510" y="287" font-size="17" font-weight="400" fill="#2C3E50" text-anchor="start">arithmetic</text>
  <circle cx="492" cy="392" r="8" fill="#FFFFFF" stroke="#5A6672" stroke-width="2"/>
  <text x="510" y="388" font-size="17" font-weight="400" fill="#2C3E50" text-anchor="start">Exact</text>
  <text x="510" y="409" font-size="17" font-weight="400" fill="#2C3E50" text-anchor="start">counting</text>
  <line x1="66" y1="478" x2="96" y2="478" stroke="#6495ED" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="106" y="483" font-size="15" font-weight="400" fill="#5A6672" text-anchor="start">next release</text>
  <rect x="652" y="70" width="308" height="440" rx="12" fill="url(#card)" stroke="#D3DCE5" stroke-width="1" filter="url(#sh)"/>
  <text x="676" y="110" font-size="15" font-weight="700" fill="#5A6672" text-anchor="start" letter-spacing="1.2">BCG EXPERIMENT</text>
  <text x="676" y="142" font-size="19" font-weight="700" fill="#002E5D" text-anchor="start">One task just outside</text>
  <text x="676" y="167" font-size="19" font-weight="700" fill="#002E5D" text-anchor="start">the frontier</text>
  <text x="676" y="220" font-size="16" font-weight="600" fill="#2C3E50" text-anchor="start">Without AI</text>
  <rect x="676" y="230" width="260" height="34" rx="6" fill="#E9ECEF"/>
  <rect x="676" y="230" width="218" height="34" rx="6" fill="url(#navyg)"/>
  <text x="884.4" y="253" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="end">84%</text>
  <text x="676" y="304" font-size="16" font-weight="600" fill="#2C3E50" text-anchor="start">Using GPT-4</text>
  <rect x="676" y="314" width="260" height="34" rx="6" fill="#E9ECEF"/>
  <rect x="676" y="314" width="182" height="34" rx="6" fill="#B9D0EA"/>
  <rect x="676" y="314" width="156" height="34" rx="6" fill="url(#royalg)"/>
  <text x="822" y="337" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="end">60 to 70%</text>
  <text x="676" y="380" font-size="15" font-weight="400" fill="#5A6672" text-anchor="start">share who got it right</text>
  <line x1="676" y1="408" x2="936" y2="408" stroke="#D9DEE4" stroke-width="1"/>
  <text x="676" y="440" font-size="16" font-weight="400" fill="#2C3E50" text-anchor="start">Many trusted a plausible,</text>
  <text x="676" y="462" font-size="16" font-weight="400" fill="#2C3E50" text-anchor="start">wrong answer.</text>
</svg>
