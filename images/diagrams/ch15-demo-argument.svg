<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 422" role="img" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>The shape of a three-minute demo</title>
  <desc>A timeline of the three-minute final demo, with each part drawn to scale. The person and the problem takes 40 seconds; the moment it works, highlighted, takes 80 seconds, almost half the demo; the evidence takes 30 seconds; what you learned takes the last 30 seconds. Under each part is the QuizMe example: Maya has a quiz every Friday and rereads her notes and hopes; she uploads this week's notes, gets ten questions, misses three on equilibrium, and knows what to study; 20 invited, 8 finished a quiz, 5 came back; the team cut a signup step and killed the unused flashcard export.</desc>
  <defs>
    <linearGradient id="seg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#E3ECF6"/><stop offset="100%" stop-color="#CCDCEE"/></linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1A6FCC"/><stop offset="100%" stop-color="#0050A8"/></linearGradient>
    <filter id="sh" x="-10%" y="-30%" width="120%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0A2E4D" flood-opacity="0.14"/></filter>
  </defs>
  <rect x="0" y="0" width="1000" height="422" rx="8" fill="#FAFBFC"/>
  <g transform="translate(0,-74)">
  <circle cx="140.0" cy="150" r="26" fill="#E6EEF7"/>
  <g transform="translate(125.0,135) scale(1.25)" fill="none" stroke="#002E5D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></g>
  <text x="140.0" y="204" text-anchor="middle" font-size="19" font-weight="700" fill="#002E5D">The person</text>
  <text x="140.0" y="227" text-anchor="middle" font-size="19" font-weight="700" fill="#002E5D">and the problem</text>
  <rect x="40" y="252" width="200" height="60" rx="8" fill="url(#seg)" filter="url(#sh)"/>
  <text x="140.0" y="290" text-anchor="middle" font-size="20" font-weight="700" fill="#002E5D">40 s</text>
  <text x="140.0" y="410" text-anchor="middle" font-size="16" fill="#5A6672">Maya has a quiz</text>
  <text x="140.0" y="432" text-anchor="middle" font-size="16" fill="#5A6672">every Friday. She</text>
  <text x="140.0" y="454" text-anchor="middle" font-size="16" fill="#5A6672">rereads and hopes.</text>
  <circle cx="446.5" cy="150" r="26" fill="#0057B8"/>
  <g transform="translate(431.5,135) scale(1.25)" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 7.75a.75.75 0 0 1 1.142-.638l3.664 2.249a.75.75 0 0 1 0 1.278l-3.664 2.25a.75.75 0 0 1-1.142-.64z"/><path d="M12 17v4"/><path d="M8 21h8"/><rect x="2" y="3" width="20" height="14" rx="2"/></g>
  <text x="446.5" y="204" text-anchor="middle" font-size="19" font-weight="700" fill="#0057B8">The moment it works</text>
  <rect x="246" y="252" width="401" height="60" rx="8" fill="url(#acc)" filter="url(#sh)"/>
  <text x="446.5" y="290" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">80 s</text>
  <text x="446.5" y="410" text-anchor="middle" font-size="16" fill="#2C3E50">She uploads this week's notes,</text>
  <text x="446.5" y="432" text-anchor="middle" font-size="16" fill="#2C3E50">gets ten questions, misses three</text>
  <text x="446.5" y="454" text-anchor="middle" font-size="16" fill="#2C3E50">on equilibrium, knows what to study.</text>
  <circle cx="728.0" cy="150" r="26" fill="#E6EEF7"/>
  <g transform="translate(713.0,135) scale(1.25)" fill="none" stroke="#002E5D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="m19 9-5 5-4-4-3 3"/></g>
  <text x="728.0" y="204" text-anchor="middle" font-size="19" font-weight="700" fill="#002E5D">The evidence</text>
  <rect x="653" y="252" width="150" height="60" rx="8" fill="url(#seg)" filter="url(#sh)"/>
  <text x="728.0" y="290" text-anchor="middle" font-size="20" font-weight="700" fill="#002E5D">30 s</text>
  <text x="728.0" y="410" text-anchor="middle" font-size="16" fill="#5A6672">20 invited,</text>
  <text x="728.0" y="432" text-anchor="middle" font-size="16" fill="#5A6672">8 finished a quiz,</text>
  <text x="728.0" y="454" text-anchor="middle" font-size="16" fill="#5A6672">5 came back</text>
  <circle cx="884.5" cy="150" r="26" fill="#E6EEF7"/>
  <g transform="translate(869.5,135) scale(1.25)" fill="none" stroke="#002E5D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></g>
  <text x="884.5" y="204" text-anchor="middle" font-size="19" font-weight="700" fill="#002E5D">What you</text>
  <text x="884.5" y="227" text-anchor="middle" font-size="19" font-weight="700" fill="#002E5D">learned</text>
  <rect x="809" y="252" width="151" height="60" rx="8" fill="url(#seg)" filter="url(#sh)"/>
  <text x="884.5" y="290" text-anchor="middle" font-size="20" font-weight="700" fill="#002E5D">30 s</text>
  <text x="884.5" y="410" text-anchor="middle" font-size="16" fill="#5A6672">Cut a signup step,</text>
  <text x="884.5" y="432" text-anchor="middle" font-size="16" fill="#5A6672">killed the unused</text>
  <text x="884.5" y="454" text-anchor="middle" font-size="16" fill="#5A6672">flashcard export</text>
  <text x="40" y="338" text-anchor="start" font-size="15" fill="#8A939C">0:00</text>
  <text x="246" y="338" text-anchor="middle" font-size="15" fill="#8A939C">0:40</text>
  <text x="653" y="338" text-anchor="middle" font-size="15" fill="#8A939C">2:00</text>
  <text x="809" y="338" text-anchor="middle" font-size="15" fill="#8A939C">2:30</text>
  <text x="960" y="338" text-anchor="end" font-size="15" fill="#8A939C">3:00</text>
  <line x1="40" y1="364" x2="960" y2="364" stroke="#E1E5EA" stroke-width="1.5"/>
  <text x="40" y="384" font-size="15" font-weight="600" letter-spacing="1.2" fill="#8A939C">QUIZME, IN THREE MINUTES</text>
  </g>
</svg>
