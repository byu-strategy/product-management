<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" role="img" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>A query, block by block</title>
  <desc>The query SELECT title, intensity FROM problems WHERE owner = 'ana' AND intensity >= 5 ORDER BY intensity DESC, shown one block at a time on a six-row problems table. FROM starts with all six rows. WHERE keeps rows 1 and 2; rows 3, 4 and 5 fail because the owner is not Ana, and row 6 fails because its intensity of 3 is below 5. SELECT keeps only the title and intensity columns. ORDER BY intensity DESC puts Group chat scheduling chaos, 8, before Expense tracking is tedious, 7. The result is two rows.</desc>
  <defs>
    <linearGradient id="gCard" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#F3F6F9"/></linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F0F5FB"/><stop offset="100%" stop-color="#DCE7F4"/></linearGradient>
    <linearGradient id="gGray" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F4F6F8"/><stop offset="100%" stop-color="#E3E7EB"/></linearGradient>
    <linearGradient id="gNavy" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0E3F6A"/><stop offset="100%" stop-color="#001A36"/></linearGradient>
    <linearGradient id="gRoyal" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2A7AD6"/><stop offset="100%" stop-color="#0049A0"/></linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F1F8F3"/><stop offset="100%" stop-color="#E0EFE5"/></linearGradient>
    <linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FBF3F3"/><stop offset="100%" stop-color="#F3E1E1"/></linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="135%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#002E5D" flood-opacity="0.13"/></filter>
    <filter id="shS" x="-10%" y="-10%" width="120%" height="135%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#002E5D" flood-opacity="0.12"/></filter>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#8A939C"/></marker>
    <marker id="ahD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#5A6672"/></marker>
    <marker id="ahA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#0057B8"/></marker>
    <marker id="ahN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#002E5D"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="690" rx="8" fill="#FAFBFC"/>
  <rect x="30" y="40" width="312" height="92" rx="10" fill="url(#gCard)" stroke="#D9DEE4" stroke-width="1.5" filter="url(#sh)"/>
  <circle cx="56" cy="70" r="15" fill="#002E5D"/>
  <text x="56" y="76" font-size="16" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
  <text x="84" y="77" font-size="17" font-weight="700" font-family="Menlo, Consolas, monospace" fill="#002E5D">FROM problems</text>
  <text x="84" y="105" font-size="16" fill="#5A6672">start with the whole table</text>
  <rect x="30" y="150" width="312" height="140" rx="10" fill="url(#gCard)" stroke="#D9DEE4" stroke-width="1.5" filter="url(#sh)"/>
  <circle cx="56" cy="180" r="15" fill="#002E5D"/>
  <text x="56" y="186" font-size="16" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
  <text x="84" y="187" font-size="17" font-weight="700" font-family="Menlo, Consolas, monospace" fill="#002E5D">WHERE owner = 'ana'</text>
  <text x="84" y="212" font-size="17" font-weight="700" font-family="Menlo, Consolas, monospace" fill="#002E5D">AND intensity &gt;= 5</text>
  <text x="84" y="240" font-size="16" fill="#5A6672">keep the rows that</text>
  <text x="84" y="261" font-size="16" fill="#5A6672">pass both tests</text>
  <rect x="380" y="40" width="527" height="252" rx="10" fill="url(#gCard)" stroke="#D9DEE4" stroke-width="1.5" filter="url(#sh)"/>
  <path d="M381 76 V50 Q381 41 390 41 H897 Q906 41 906 50 V76 Z" fill="url(#gGray)"/>
