  <text x="442" y="64" font-size="15" font-weight="700" font-family="Menlo, Consolas, monospace" fill="#5A6672">owner</text>
  <text x="524" y="64" font-size="15" font-weight="700" font-family="Menlo, Consolas, monospace" fill="#5A6672">title</text>
  <text x="806" y="64" font-size="15" font-weight="700" font-family="Menlo, Consolas, monospace" fill="#5A6672">intensity</text>
  <rect x="381.5" y="76" width="524" height="36" fill="#E6EEF7"/>
  <text x="394" y="100" font-size="17" font-weight="600" fill="#002E5D">1</text>
  <text x="442" y="100" font-size="17" font-weight="600" fill="#002E5D">ana</text>
  <text x="524" y="100" font-size="17" font-weight="600" fill="#002E5D">Expense tracking is tedious</text>
  <text x="806" y="100" font-size="17" font-weight="600" fill="#002E5D">7</text>
  <rect x="381.5" y="112" width="524" height="36" fill="#E6EEF7"/>
  <line x1="390" y1="112" x2="897" y2="112" stroke="#E9ECEF" stroke-width="1.5"/>
  <text x="394" y="136" font-size="17" font-weight="600" fill="#002E5D">2</text>
  <text x="442" y="136" font-size="17" font-weight="600" fill="#002E5D">ana</text>
  <text x="524" y="136" font-size="17" font-weight="600" fill="#002E5D">Group chat scheduling chaos</text>
  <text x="806" y="136" font-size="17" font-weight="600" fill="#002E5D">8</text>
  <line x1="390" y1="148" x2="897" y2="148" stroke="#E9ECEF" stroke-width="1.5"/>
  <text x="394" y="172" font-size="17" fill="#A3ABB3">3</text>
  <text x="442" y="172" font-size="17" fill="#A3ABB3">ben</text>
  <text x="524" y="172" font-size="17" fill="#A3ABB3">Lost receipts</text>
  <text x="806" y="172" font-size="17" fill="#A3ABB3">4</text>
  <line x1="390" y1="166" x2="897" y2="166" stroke="#A3ABB3" stroke-width="1.5"/>
  <text x="919" y="172" font-size="15" fill="#8A939C">not ana</text>
  <line x1="390" y1="184" x2="897" y2="184" stroke="#E9ECEF" stroke-width="1.5"/>
  <text x="394" y="208" font-size="17" fill="#A3ABB3">4</text>
  <text x="442" y="208" font-size="17" fill="#A3ABB3">ben</text>
  <text x="524" y="208" font-size="17" fill="#A3ABB3">Finding a study room</text>
  <text x="806" y="208" font-size="17" fill="#A3ABB3">6</text>
  <line x1="390" y1="202" x2="897" y2="202" stroke="#A3ABB3" stroke-width="1.5"/>
  <text x="919" y="208" font-size="15" fill="#8A939C">not ana</text>
  <line x1="390" y1="220" x2="897" y2="220" stroke="#E9ECEF" stroke-width="1.5"/>
  <text x="394" y="244" font-size="17" fill="#A3ABB3">5</text>
  <text x="442" y="244" font-size="17" fill="#A3ABB3">cara</text>
  <text x="524" y="244" font-size="17" fill="#A3ABB3">Splitting rent</text>
  <text x="806" y="244" font-size="17" fill="#A3ABB3">9</text>
  <line x1="390" y1="238" x2="897" y2="238" stroke="#A3ABB3" stroke-width="1.5"/>
  <text x="919" y="244" font-size="15" fill="#8A939C">not ana</text>
  <line x1="390" y1="256" x2="897" y2="256" stroke="#E9ECEF" stroke-width="1.5"/>
  <text x="394" y="280" font-size="17" fill="#A3ABB3">6</text>
  <text x="442" y="280" font-size="17" fill="#A3ABB3">ana</text>
  <text x="524" y="280" font-size="17" fill="#A3ABB3">Forgetting to call home</text>
  <text x="806" y="280" font-size="17" fill="#A3ABB3">3</text>
  <line x1="390" y1="274" x2="897" y2="274" stroke="#A3ABB3" stroke-width="1.5"/>
  <text x="919" y="280" font-size="15" fill="#8A939C">3 &lt; 5</text>
  <path d="M580 300 V326" fill="none" stroke="#8A939C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/>
  <rect x="30" y="336" width="312" height="92" rx="10" fill="url(#gCard)" stroke="#D9DEE4" stroke-width="1.5" filter="url(#sh)"/>
  <circle cx="56" cy="366" r="15" fill="#002E5D"/>
  <text x="56" y="372" font-size="16" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
  <text x="84" y="373" font-size="17" font-weight="700" font-family="Menlo, Consolas, monospace" fill="#002E5D">SELECT title, intensity</text>
  <text x="84" y="401" font-size="16" fill="#5A6672">keep only these columns</text>
  <rect x="380" y="338" width="397" height="108" rx="10" fill="url(#gCard)" stroke="#D9DEE4" stroke-width="1.5" filter="url(#sh)"/>
  <path d="M381 374 V348 Q381 339 390 339 H767 Q776 339 776 348 V374 Z" fill="url(#gGray)"/>
  <text x="394" y="362" font-size="15" font-weight="700" font-family="Menlo, Consolas, monospace" fill="#5A6672">title</text>
  <text x="676" y="362" font-size="15" font-weight="700" font-family="Menlo, Consolas, monospace" fill="#5A6672">intensity</text>
  <text x="394" y="398" font-size="17" fill="#2C3E50">Expense tracking is tedious</text>
  <text x="676" y="398" font-size="17" fill="#2C3E50">7</text>
  <line x1="390" y1="410" x2="767" y2="410" stroke="#E9ECEF" stroke-width="1.5"/>
  <text x="394" y="434" font-size="17" fill="#2C3E50">Group chat scheduling chaos</text>
  <text x="676" y="434" font-size="17" fill="#2C3E50">8</text>
  <path d="M580 454 V480" fill="none" stroke="#8A939C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/>
  <rect x="30" y="490" width="312" height="92" rx="10" fill="url(#gCard)" stroke="#D9DEE4" stroke-width="1.5" filter="url(#sh)"/>
  <circle cx="56" cy="520" r="15" fill="#002E5D"/>
  <text x="56" y="526" font-size="16" font-weight="700" text-anchor="middle" fill="#FFFFFF">4</text>
  <text x="84" y="527" font-size="17" font-weight="700" font-family="Menlo, Consolas, monospace" fill="#002E5D">ORDER BY intensity DESC</text>
  <text x="84" y="555" font-size="16" fill="#5A6672">highest first</text>
  <rect x="380" y="492" width="397" height="108" rx="10" fill="url(#gCard)" stroke="#0057B8" stroke-width="2.5" filter="url(#sh)"/>
  <path d="M381 528 V502 Q381 493 390 493 H767 Q776 493 776 502 V528 Z" fill="url(#gRoyal)"/>
  <text x="394" y="516" font-size="15" font-weight="700" font-family="Menlo, Consolas, monospace" fill="#FFFFFF">title</text>
  <text x="676" y="516" font-size="15" font-weight="700" font-family="Menlo, Consolas, monospace" fill="#FFFFFF">intensity</text>
  <text x="394" y="552" font-size="17" font-weight="600" fill="#002E5D">Group chat scheduling chaos</text>
  <text x="676" y="552" font-size="17" font-weight="600" fill="#002E5D">8</text>
  <line x1="390" y1="564" x2="767" y2="564" stroke="#E9ECEF" stroke-width="1.5"/>
  <text x="394" y="588" font-size="17" font-weight="600" fill="#002E5D">Expense tracking is tedious</text>
  <text x="676" y="588" font-size="17" font-weight="600" fill="#002E5D">7</text>
  <text x="800" y="550" font-size="19" font-weight="700" fill="#0057B8">Result:</text>
  <text x="800" y="574" font-size="19" font-weight="700" fill="#0057B8">2 rows</text>
  <text x="30" y="642" font-size="16" fill="#5A6672">Written with SELECT first, but run in this order: table, filter, columns, sort, then limit.</text>
</svg>
