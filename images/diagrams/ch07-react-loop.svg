<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 712" role="img" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>The React loop: state, render, event, handler, state</title>
  <desc>Two columns, before the click and after the click, each with a State card above a Screen. Before: state holds tasks with one item, Call dentist, and text holding Buy groceries; React renders it into a screen whose input box shows Buy groceries, an Add button, and a list with Call dentist. Step 1, click: an arrow from the Add button to the click handler, addTask, whose code reads await fetch, setTasks with the old tasks plus the new task, and setText with an empty string. Below a dashed line separating the browser from your server, step 2 sends POST /api/tasks to your server, which saves the task in the database in app/api/tasks/route.ts, and step 3 returns the saved task while addTask waits for this reply. Step 4, setTasks changes state: the arrow goes to the State card after the click, which now holds Call dentist and Buy groceries, with text empty. Step 5, React renders that state into a screen with an empty input box and both tasks in the list. No arrow goes from the handler to the screen.</desc>
  <defs>
    <linearGradient id="gCard" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#F3F6F9"/></linearGradient>
    <linearGradient id="gGray" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F4F6F8"/><stop offset="100%" stop-color="#E3E7EB"/></linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="135%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#002E5D" flood-opacity="0.13"/></filter>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#8A939C"/></marker>
    <marker id="ahA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#0057B8"/></marker>
    <marker id="ahN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#002E5D"/></marker>
  </defs>
