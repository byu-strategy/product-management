  <path d="M760 254 V306" fill="none" stroke="#002E5D" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ahN)"/>
  <text x="776" y="286" font-size="16" font-weight="600" fill="#002E5D" text-anchor="start">React renders</text>
  <circle cx="734" cy="280" r="14" fill="#002E5D"/>
  <text x="734" y="285.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <rect x="360" y="316" width="280" height="172" rx="10" fill="url(#gCard)" stroke="#0057B8" stroke-width="2" filter="url(#sh)"/>
  <text x="380" y="348" font-size="19" font-weight="700" fill="#002E5D" text-anchor="start">Click handler</text>
  <text x="380" y="380" font-size="16" font-weight="700" fill="#0057B8" text-anchor="start" font-family="Menlo, Consolas, monospace">addTask()</text>
  <text x="380" y="412" font-size="15" font-weight="400" fill="#2C3E50" text-anchor="start" font-family="Menlo, Consolas, monospace">await fetch(...)</text>
  <text x="380" y="440" font-size="15" font-weight="400" fill="#2C3E50" text-anchor="start" font-family="Menlo, Consolas, monospace">setTasks([...tasks, task])</text>
  <text x="380" y="468" font-size="15" font-weight="400" fill="#2C3E50" text-anchor="start" font-family="Menlo, Consolas, monospace">setText("")</text>
  <path d="M292 377 H352" fill="none" stroke="#0057B8" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ahA)"/>
  <circle cx="335" cy="352" r="14" fill="#0057B8"/>
