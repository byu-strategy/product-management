  <text x="50" y="82" font-size="19" font-weight="700" fill="#002E5D" text-anchor="start">State</text>
  <text x="50" y="112" font-size="15" font-weight="700" fill="#5A6672" text-anchor="start" font-family="Menlo, Consolas, monospace">tasks</text>
  <rect x="50" y="122" width="240" height="30" rx="6" fill="#FFFFFF" stroke="#D9DEE4" stroke-width="1.25"/>
