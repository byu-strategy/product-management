  <circle cx="426" cy="516" r="14" fill="#002E5D"/>
  <text x="426" y="521.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="404" y="521" font-size="15" font-weight="400" fill="#5A6672" text-anchor="end" font-family="Menlo, Consolas, monospace">POST /api/tasks</text>
  <circle cx="574" cy="516" r="14" fill="#002E5D"/>
