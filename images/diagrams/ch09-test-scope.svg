<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>Kinds of tests: what each test file runs</title>
<desc>A grid. On the left, a column headed The test, a separate file. In the middle, a shaded area headed Your app, with three columns: Browser, the user's machine; Your server, Next.js on Vercel; Supabase, sign-in and database. On the right, a column headed Finds, when it fails. Three rows. Unit test, fastest, milliseconds: the test file validate.test.ts sends a problem with intensity 12 straight to validateProblem(), your code that checks a new problem, shown under the server column; the browser and database are not used. It finds a wrong rule in one function. Integration test, slower: the test file problems.test.ts sends a request to save a new problem to /api/problems, your server route, which writes to a test database, not the live one; the outline covers the server and Supabase columns. It finds a save that fails or stores the wrong row. End-to-end test, slowest, seconds each: the test file signup.spec.ts clicks and types in a real browser opened by the test, which uses the running app and a test database; the outline covers all three columns. It finds a step a user cannot finish.</desc>
