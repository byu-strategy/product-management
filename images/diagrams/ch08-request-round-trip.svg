<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 930" role="img" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>One request to save a task, and every answer that can come back</title>
<desc>A sequence diagram with three columns, the browser, your server, and the database, plus a column on the left showing the message the user sees. At the top, the browser sends a request to your server: POST /api/tasks, an Authorization header carrying the token, and a body with the task text Buy groceries. If no response comes back because the network is down or the request timed out, the user sees: No connection. Try again. Your server then checks three things in order. If the token is not valid, it answers 401 Unauthorized and the user sees: Please sign in again. If the user is not allowed, it answers 403 Forbidden and the user sees: You do not have access. If the input is not valid, it answers 400 Bad Request and the user sees: Task cannot be empty. If all three pass, the server inserts the row into the database and gets back the new row or an error. If the save failed, it answers 500 Internal Server Error and the user sees: Something went wrong. If it worked, the server answers 201 Created with a body holding the new task, id 123, and the user sees the new task in the list.</desc>
<defs>
<linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F0F5FB"/><stop offset="100%" stop-color="#DCE7F4"/></linearGradient>
<linearGradient id="gCard" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#F3F6F9"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="135%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#002E5D" flood-opacity="0.13"/></filter>
<filter id="shS" x="-10%" y="-10%" width="120%" height="135%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#002E5D" flood-opacity="0.12"/></filter>
<marker id="ahN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#002E5D"/></marker>
<marker id="ahD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#5A6672"/></marker>
<marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#B03A3A"/></marker>
<marker id="ahA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#0057B8"/></marker>
</defs>
<rect x="0" y="0" width="1000" height="930" rx="8" fill="#FAFBFC"/>
<line x1="330" y1="150" x2="330" y2="906" stroke="#D9DEE4" stroke-width="2"/>
<circle cx="330" cy="66" r="36" fill="url(#gBlue)" stroke="#B9D0EA" stroke-width="1.5" filter="url(#sh)"/>
<g transform="translate(313,49) scale(1.417)" fill="none" stroke="#002E5D" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2" />
  <path d="M10 4v4" />
  <path d="M2 8h20" />
  <path d="M6 4v4" /></g>
<text x="330" y="130" font-size="19" font-weight="700" text-anchor="middle" fill="#002E5D" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">Browser</text>
<line x1="690" y1="150" x2="690" y2="906" stroke="#D9DEE4" stroke-width="2"/>
<circle cx="690" cy="66" r="36" fill="url(#gBlue)" stroke="#B9D0EA" stroke-width="1.5" filter="url(#sh)"/>
<g transform="translate(673,49) scale(1.417)" fill="none" stroke="#002E5D" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="8" x="2" y="2" rx="2" ry="2" />
  <rect width="20" height="8" x="2" y="14" rx="2" ry="2" />
  <line x1="6" x2="6.01" y1="6" y2="6" />
  <line x1="6" x2="6.01" y1="18" y2="18" /></g>
<text x="690" y="130" font-size="19" font-weight="700" text-anchor="middle" fill="#002E5D" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">Your server</text>
<line x1="915" y1="150" x2="915" y2="906" stroke="#D9DEE4" stroke-width="2"/>
<circle cx="915" cy="66" r="36" fill="url(#gBlue)" stroke="#B9D0EA" stroke-width="1.5" filter="url(#sh)"/>
<g transform="translate(898,49) scale(1.417)" fill="none" stroke="#002E5D" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3" />
  <path d="M3 5V19A9 3 0 0 0 21 19V5" />
  <path d="M3 12A9 3 0 0 0 21 12" /></g>
<text x="915" y="130" font-size="19" font-weight="700" text-anchor="middle" fill="#002E5D" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">Database</text>
<text x="30" y="130" font-size="15" font-weight="700" text-anchor="start" fill="#8A939C" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" letter-spacing="1.2">THE USER SEES</text>
<rect x="346" y="162" width="328" height="104" rx="10" fill="#FFFFFF" stroke="#002E5D" stroke-width="1.5" filter="url(#shS)"/>
<text x="362" y="192" font-size="15" font-weight="700" text-anchor="start" fill="#002E5D" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">POST /api/tasks</text>
<text x="312" y="192" font-size="15" font-weight="400" text-anchor="end" fill="#8A939C" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">method, address</text>
<text x="362" y="221" font-size="15" font-weight="400" text-anchor="start" fill="#2C3E50" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Authorization: Bearer eyJhbGci...</text>
<text x="312" y="221" font-size="15" font-weight="400" text-anchor="end" fill="#8A939C" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">header</text>
<text x="362" y="250" font-size="15" font-weight="400" text-anchor="start" fill="#2C3E50" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">{ "task_text": "Buy groceries" }</text>
<text x="312" y="250" font-size="15" font-weight="400" text-anchor="end" fill="#8A939C" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">body</text>
<path d="M334 290 H684" stroke="#002E5D" stroke-width="2" fill="none" marker-end="url(#ahN)"/>
<rect x="682" y="300" width="16" height="420" rx="4" fill="url(#gBlue)" stroke="#B9D0EA" stroke-width="1.5"/>
<circle cx="330" cy="350" r="17" fill="#FFFFFF" stroke="#D9DEE4" stroke-width="1.5"/>
<g transform="translate(319,339) scale(0.9167)" fill="none" stroke="#5A6672" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" />
  <polyline points="12 6 12 12 16 14" /></g>
<text x="360" y="356" font-size="16" font-weight="400" text-anchor="start" fill="#5A6672" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">no response: network down, or timed out</text>
<rect x="24" y="329" width="262" height="36" rx="8" fill="#FFFFFF" stroke="#D9DEE4" stroke-width="1.5" filter="url(#shS)"/>
<text x="40" y="352" font-size="16" font-weight="500" text-anchor="start" fill="#2C3E50" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">No connection. Try again.</text>
<text x="708" y="426" font-size="17" font-weight="600" text-anchor="start" fill="#2C3E50" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">Token valid?</text>
<path d="M680 420 H336" stroke="#B03A3A" stroke-width="1.75" stroke-dasharray="6 5" fill="none" marker-end="url(#ahR)"/>
<rect x="429.2" y="393" width="161.6" height="26" rx="13" fill="#FFFFFF" stroke="#B03A3A" stroke-width="1.5"/>
