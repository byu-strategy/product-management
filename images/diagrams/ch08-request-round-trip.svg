<text x="668" y="411" font-size="15" font-weight="600" text-anchor="end" fill="#B03A3A" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">no</text>
<rect x="24" y="399" width="262" height="36" rx="8" fill="#FFFFFF" stroke="#D9DEE4" stroke-width="1.5" filter="url(#shS)"/>
<text x="40" y="422" font-size="16" font-weight="500" text-anchor="start" fill="#2C3E50" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">Please sign in again.</text>
<text x="708" y="496" font-size="17" font-weight="600" text-anchor="start" fill="#2C3E50" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">Allowed?</text>
<path d="M680 490 H336" stroke="#B03A3A" stroke-width="1.75" stroke-dasharray="6 5" fill="none" marker-end="url(#ahR)"/>
<rect x="442.1" y="463" width="135.8" height="26" rx="13" fill="#FFFFFF" stroke="#B03A3A" stroke-width="1.5"/>
<text x="510.0" y="481" font-size="15" font-weight="700" text-anchor="middle" fill="#B03A3A" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">403 Forbidden</text>
<text x="668" y="481" font-size="15" font-weight="600" text-anchor="end" fill="#B03A3A" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">no</text>
<rect x="24" y="469" width="262" height="36" rx="8" fill="#FFFFFF" stroke="#D9DEE4" stroke-width="1.5" filter="url(#shS)"/>
