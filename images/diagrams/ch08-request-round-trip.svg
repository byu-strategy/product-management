<text x="708" y="566" font-size="17" font-weight="600" text-anchor="start" fill="#2C3E50" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">Input valid?</text>
<path d="M680 560 H336" stroke="#B03A3A" stroke-width="1.75" stroke-dasharray="6 5" fill="none" marker-end="url(#ahR)"/>
<rect x="433.5" y="533" width="153.0" height="26" rx="13" fill="#FFFFFF" stroke="#B03A3A" stroke-width="1.5"/>
<text x="510.0" y="551" font-size="15" font-weight="700" text-anchor="middle" fill="#B03A3A" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">400 Bad Request</text>
<text x="668" y="551" font-size="15" font-weight="600" text-anchor="end" fill="#B03A3A" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">no</text>
<rect x="24" y="539" width="262" height="36" rx="8" fill="#FFFFFF" stroke="#D9DEE4" stroke-width="1.5" filter="url(#shS)"/>
<text x="40" y="562" font-size="16" font-weight="500" text-anchor="start" fill="#2C3E50" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">Task can't be empty.</text>
<path d="M700 610 H909" stroke="#002E5D" stroke-width="2" fill="none" marker-end="url(#ahN)"/>
<text x="802.5" y="600" font-size="16" font-weight="400" text-anchor="middle" fill="#2C3E50" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">insert the row</text>
<path d="M911 652 H704" stroke="#5A6672" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#ahD)"/>
<text x="802.5" y="642" font-size="16" font-weight="400" text-anchor="middle" fill="#2C3E50" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">new row, or an error</text>
<text x="708" y="706" font-size="17" font-weight="600" text-anchor="start" fill="#2C3E50" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">Saved?</text>
<path d="M680 700 H336" stroke="#B03A3A" stroke-width="1.75" stroke-dasharray="6 5" fill="none" marker-end="url(#ahR)"/>
<rect x="390.5" y="673" width="239.0" height="26" rx="13" fill="#FFFFFF" stroke="#B03A3A" stroke-width="1.5"/>
<text x="510.0" y="691" font-size="15" font-weight="700" text-anchor="middle" fill="#B03A3A" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">500 Internal Server Error</text>
<text x="668" y="691" font-size="15" font-weight="600" text-anchor="end" fill="#B03A3A" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">no</text>
<rect x="24" y="679" width="262" height="36" rx="8" fill="#FFFFFF" stroke="#D9DEE4" stroke-width="1.5" filter="url(#shS)"/>
<text x="40" y="702" font-size="16" font-weight="500" text-anchor="start" fill="#2C3E50" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">Something went wrong.</text>
<rect x="346" y="740" width="328" height="104" rx="10" fill="#FFFFFF" stroke="#0057B8" stroke-width="2" filter="url(#shS)"/>
<text x="362" y="770" font-size="15" font-weight="700" text-anchor="start" fill="#0057B8" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" xml:space="preserve">201 Created</text>
<text x="312" y="770" font-size="15" font-weight="400" text-anchor="end" fill="#8A939C" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">status code</text>
<text x="362" y="799" font-size="15" font-weight="400" text-anchor="start" fill="#2C3E50" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" xml:space="preserve">{ "id": 123,</text>
<text x="312" y="799" font-size="15" font-weight="400" text-anchor="end" fill="#8A939C" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">body</text>
<text x="362" y="828" font-size="15" font-weight="400" text-anchor="start" fill="#2C3E50" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" xml:space="preserve">  "task_text": "Buy groceries" }</text>
<path d="M680 876 H336" stroke="#0057B8" stroke-width="2.25" fill="none" marker-end="url(#ahA)"/>
<rect x="24" y="855" width="262" height="36" rx="8" fill="#E6EEF7" stroke="#B9D0EA" stroke-width="1.5" filter="url(#shS)"/>
<text x="40" y="878" font-size="16" font-weight="500" text-anchor="start" fill="#002E5D" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">The new task in the list</text>
</svg>
