<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title id="t">Product-led and sales-led growth: who does each step</title>
  <desc id="d">Two panels with the same layout, each with two rows: Customer and You. Top panel, product-led growth: in the Customer row, three steps in order, signs up, tries it, gets value. The You row is empty and reads you are not involved. At the right: works when time to value is short. Bottom panel, sales-led growth: the You row starts with reach out; then two steps span both rows because both people take part, run a demo and close the sale; then gets value in the Customer row. At the right: works when the product is complex or the deal is large.</desc>
  <defs>
    <linearGradient id="gCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EEF1F4"/>
    </linearGradient>
    <linearGradient id="gYou" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E63C4"/>
      <stop offset="100%" stop-color="#003F87"/>
    </linearGradient>
    <filter id="sh" filterUnits="userSpaceOnUse" x="0" y="0" width="1000" height="560">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0A2E4D" flood-opacity="0.13"/>
    </filter>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A6672"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="560" rx="8" fill="#FAFBFC"/>

  <!-- ===== PANEL 1: PRODUCT-LED ===== -->
  <text x="40" y="54" font-size="22" font-weight="700" fill="#002E5D">Product-led growth</text>
  <!-- lanes -->
  <rect x="40" y="74" width="720" height="70" rx="8" fill="#F1F3F5"/>
  <rect x="40" y="152" width="720" height="70" rx="8" fill="#F1F3F5"/>
  <text x="60" y="115" font-size="18" font-weight="600" fill="#2C3E50">Customer</text>
  <text x="60" y="193" font-size="18" font-weight="600" fill="#2C3E50">You</text>

  <!-- customer steps -->
  <rect x="200" y="85" width="160" height="48" rx="8" fill="#FAFBFC" filter="url(#sh)"/>
  <rect x="200" y="85" width="160" height="48" rx="8" fill="url(#gCard)" stroke="#D9DEE4" stroke-width="1.5"/>
  <text x="280" y="115" text-anchor="middle" font-size="18" font-weight="600" fill="#2C3E50">Signs up</text>
  <rect x="392" y="85" width="160" height="48" rx="8" fill="#FAFBFC" filter="url(#sh)"/>
  <rect x="392" y="85" width="160" height="48" rx="8" fill="url(#gCard)" stroke="#D9DEE4" stroke-width="1.5"/>
  <text x="472" y="115" text-anchor="middle" font-size="18" font-weight="600" fill="#2C3E50">Tries it</text>
  <rect x="584" y="85" width="160" height="48" rx="8" fill="#FAFBFC" filter="url(#sh)"/>
  <rect x="584" y="85" width="160" height="48" rx="8" fill="url(#gCard)" stroke="#002E5D" stroke-width="2"/>
  <text x="664" y="115" text-anchor="middle" font-size="18" font-weight="700" fill="#002E5D">Gets value</text>
  <line x1="362" y1="109" x2="386" y2="109" stroke="#5A6672" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="554" y1="109" x2="578" y2="109" stroke="#5A6672" stroke-width="2" marker-end="url(#ah)"/>

  <!-- you lane: empty -->
  <line x1="200" y1="187" x2="744" y2="187" stroke="#C3CAD2" stroke-width="1.5" stroke-dasharray="6 6"/>
  <rect x="382" y="174" width="180" height="26" fill="#F1F3F5"/>
  <text x="472" y="193" text-anchor="middle" font-size="17" fill="#8A939C">You are not involved</text>

  <!-- works when -->
  <text x="790" y="106" font-size="15" font-weight="700" fill="#5A6672" letter-spacing="1.2">WORKS WHEN</text>
  <text x="790" y="136" font-size="18" fill="#2C3E50">Time to value</text>
  <text x="790" y="160" font-size="18" fill="#2C3E50">is short</text>

  <line x1="40" y1="262" x2="960" y2="262" stroke="#D9DEE4" stroke-width="1.5"/>

  <!-- ===== PANEL 2: SALES-LED ===== -->
  <text x="40" y="312" font-size="22" font-weight="700" fill="#002E5D">Sales-led growth</text>
  <rect x="40" y="332" width="720" height="70" rx="8" fill="#F1F3F5"/>
  <rect x="40" y="410" width="720" height="70" rx="8" fill="#F1F3F5"/>
  <text x="60" y="373" font-size="18" font-weight="600" fill="#2C3E50">Customer</text>
  <text x="60" y="451" font-size="18" font-weight="600" fill="#2C3E50">You</text>

  <!-- reach out: you lane -->
  <rect x="200" y="421" width="120" height="48" rx="8" fill="#FAFBFC" filter="url(#sh)"/>
  <rect x="200" y="421" width="120" height="48" rx="8" fill="url(#gYou)"/>
  <text x="260" y="451" text-anchor="middle" font-size="18" font-weight="600" fill="#FFFFFF">Reach out</text>

  <!-- demo: spans both -->
  <rect x="342" y="343" width="120" height="126" rx="8" fill="#FAFBFC" filter="url(#sh)"/>
  <rect x="342" y="343" width="120" height="126" rx="8" fill="url(#gYou)"/>
  <text x="402" y="401" text-anchor="middle" font-size="18" font-weight="600" fill="#FFFFFF">Run a</text>
  <text x="402" y="424" text-anchor="middle" font-size="18" font-weight="600" fill="#FFFFFF">demo</text>

  <!-- close: spans both -->
  <rect x="484" y="343" width="120" height="126" rx="8" fill="#FAFBFC" filter="url(#sh)"/>
  <rect x="484" y="343" width="120" height="126" rx="8" fill="url(#gYou)"/>
  <text x="544" y="401" text-anchor="middle" font-size="18" font-weight="600" fill="#FFFFFF">Close</text>
  <text x="544" y="424" text-anchor="middle" font-size="18" font-weight="600" fill="#FFFFFF">the sale</text>

  <!-- gets value: customer lane -->
  <rect x="626" y="343" width="120" height="48" rx="8" fill="#FAFBFC" filter="url(#sh)"/>
  <rect x="626" y="343" width="120" height="48" rx="8" fill="url(#gCard)" stroke="#002E5D" stroke-width="2"/>
  <text x="686" y="373" text-anchor="middle" font-size="18" font-weight="700" fill="#002E5D">Gets value</text>

  <line x1="322" y1="445" x2="336" y2="445" stroke="#5A6672" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="464" y1="406" x2="478" y2="406" stroke="#5A6672" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="606" y1="367" x2="620" y2="367" stroke="#5A6672" stroke-width="2" marker-end="url(#ah)"/>

  <!-- works when -->
  <text x="790" y="364" font-size="15" font-weight="700" fill="#5A6672" letter-spacing="1.2">WORKS WHEN</text>
  <text x="790" y="394" font-size="18" fill="#2C3E50">The product is</text>
  <text x="790" y="418" font-size="18" fill="#2C3E50">complex or the</text>
  <text x="790" y="442" font-size="18" fill="#2C3E50">deal is large</text>

  <!-- legend: blue = your time -->
  <rect x="200" y="508" width="18" height="18" rx="4" fill="url(#gYou)"/>
  <text x="228" y="523" font-size="17" fill="#5A6672">A step that needs your time</text>
</svg>
