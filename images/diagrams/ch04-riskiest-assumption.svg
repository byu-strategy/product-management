<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="t d" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title id="t">Finding the riskiest assumption: the dues tracker</title>
  <desc id="d">A two by two grid. Left to right: how uncertain we are, low to high. Bottom to top: fixable if false, then fatal if false. Four assumptions from the dues tracker are plotted. In the shaded top right corner, labeled riskiest, test first: number 1, value, matching payments hurts enough to switch; and number 2, feasibility, they can connect their Venmo history. Bottom right: viability, a club pays five dollars a month. Bottom middle: usability, they learn it in five minutes. The top left corner, fatal but already known, is empty.</desc>
  <defs>
    <linearGradient id="gHot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E3EDF8"/>
      <stop offset="100%" stop-color="#CCDDF0"/>
    </linearGradient>
    <linearGradient id="gCell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3F5F7"/>
    </linearGradient>
    <radialGradient id="gDot" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0%" stop-color="#2A7ADB"/>
      <stop offset="100%" stop-color="#0049A0"/>
    </radialGradient>
    <filter id="sh" filterUnits="userSpaceOnUse" x="0" y="0" width="1000" height="600">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0A2E4D" flood-opacity="0.14"/>
    </filter>
    <marker id="ax" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A939C"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="600" rx="8" fill="#FAFBFC"/>

  <!-- grid -->
  <rect x="170" y="30" width="800" height="460" rx="10" fill="#FAFBFC" filter="url(#sh)"/>
  <rect x="170" y="30" width="800" height="460" rx="10" fill="url(#gCell)"/>
  <path d="M570,30 H960 a10,10 0 0 1 10,10 V260 H570 Z" fill="url(#gHot)"/>
  <line x1="570" y1="30" x2="570" y2="490" stroke="#D9DEE4" stroke-width="1.5"/>
  <line x1="170" y1="260" x2="970" y2="260" stroke="#D9DEE4" stroke-width="1.5"/>
  <rect x="170" y="30" width="800" height="460" rx="10" fill="none" stroke="#D9DEE4" stroke-width="1.5"/>

  <!-- row labels -->
  <text x="150" y="138" text-anchor="end" font-size="19" font-weight="700" fill="#2C3E50">Fatal</text>
  <text x="150" y="162" text-anchor="end" font-size="17" fill="#5A6672">if false</text>
  <text x="150" y="368" text-anchor="end" font-size="19" font-weight="700" fill="#2C3E50">Fixable</text>
  <text x="150" y="392" text-anchor="end" font-size="17" fill="#5A6672">if false</text>

  <!-- quadrant labels -->
  <text x="946" y="66" text-anchor="end" font-size="20" font-weight="700" fill="#0057B8">Riskiest: test first</text>
  <text x="194" y="66" font-size="16" fill="#8A939C">Fatal, but already known</text>
  <text x="194" y="470" font-size="16" fill="#8A939C">Safe to leave for later</text>
  <text x="946" y="470" text-anchor="end" font-size="16" fill="#8A939C">Unsure, but survivable</text>

  <!-- 1 VALUE -->
  <circle cx="900" cy="132" r="18" fill="url(#gDot)" filter="url(#sh)"/>
  <text x="900" y="138" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">1</text>
  <text x="866" y="122" text-anchor="end" font-size="14" font-weight="700" fill="#0057B8" letter-spacing="1.2">VALUE</text>
  <text x="866" y="145" text-anchor="end" font-size="18" font-weight="600" fill="#002E5D">Matching payments hurts</text>
  <text x="866" y="167" text-anchor="end" font-size="18" font-weight="600" fill="#002E5D">enough to switch</text>

  <!-- 2 FEASIBILITY -->
  <circle cx="900" cy="214" r="16" fill="#FFFFFF" stroke="#002E5D" stroke-width="2.5"/>
  <text x="900" y="220" text-anchor="middle" font-size="16" font-weight="700" fill="#002E5D">2</text>
  <text x="866" y="206" text-anchor="end" font-size="14" font-weight="700" fill="#002E5D" letter-spacing="1.2">FEASIBILITY</text>
  <text x="866" y="229" text-anchor="end" font-size="17" fill="#2C3E50">They can connect their Venmo history</text>

  <!-- VIABILITY -->
  <circle cx="900" cy="350" r="11" fill="#A3ACB5"/>
  <text x="878" y="342" text-anchor="end" font-size="14" font-weight="700" fill="#8A939C" letter-spacing="1.2">VIABILITY</text>
  <text x="878" y="365" text-anchor="end" font-size="17" fill="#5A6672">A club pays $5 a month</text>

  <!-- USABILITY -->
  <circle cx="540" cy="390" r="11" fill="#A3ACB5"/>
  <text x="518" y="382" text-anchor="end" font-size="14" font-weight="700" fill="#8A939C" letter-spacing="1.2">USABILITY</text>
  <text x="518" y="405" text-anchor="end" font-size="17" fill="#5A6672">They learn it in five minutes</text>

  <!-- x axis -->
  <line x1="170" y1="516" x2="962" y2="516" stroke="#8A939C" stroke-width="2" marker-end="url(#ax)"/>
  <text x="170" y="546" font-size="16" fill="#5A6672">Low</text>
  <text x="970" y="546" text-anchor="end" font-size="16" fill="#5A6672">High</text>
  <text x="570" y="546" text-anchor="middle" font-size="19" font-weight="600" fill="#2C3E50">How uncertain are we?</text>
</svg>
