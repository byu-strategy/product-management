<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="t d" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title id="t">The Value Proposition Canvas</title>
  <desc id="d">The Value Proposition Canvas. On the left, a square called the value map is divided into three parts: products and services on the left, gain creators at upper right, and pain relievers at lower right, with a gift icon at the center. On the right, a circle called the customer profile is divided into three parts: gains at upper left, pains at lower left, and customer jobs on the right, with a person icon at the center. Two arrows, one from each shape, point toward each other in the gap between them, labeled fit: fit is when the value map's pain relievers and gain creators match the customer's pains, gains, and jobs.</desc>
  <defs>
    <linearGradient id="gBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EEF4FB"/>
    </linearGradient>
    <filter id="sh" filterUnits="userSpaceOnUse" x="0" y="0" width="1000" height="540">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0A2E4D" flood-opacity="0.13"/>
    </filter>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0057B8"/>
    </marker>
  </defs>
  <rect width="1000" height="540" rx="8" fill="#FAFBFC"/>

  <!-- value map: square -->
  <rect x="60" y="50" width="400" height="400" rx="8" fill="url(#gBox)" stroke="#002E5D" stroke-width="2.5" filter="url(#sh)"/>
  <line x1="64" y1="54" x2="260.0" y2="250.0" stroke="#002E5D" stroke-width="1.5"/>
  <line x1="64" y1="446" x2="260.0" y2="250.0" stroke="#002E5D" stroke-width="1.5"/>
  <line x1="260.0" y1="250.0" x2="460" y2="250.0" stroke="#002E5D" stroke-width="1.5"/>
  <rect x="230.0" y="220.0" width="60" height="60" rx="10" fill="#FFFFFF" stroke="#002E5D" stroke-width="2"/>
  <g transform="translate(242,232) scale(1.5)" fill="none" stroke="#002E5D" stroke-width="1.47" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1" />
  <path d="M12 8v13" />
  <path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7" />
  <path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5" /></g>

  <g transform="translate(124,189) scale(1.333)" fill="none" stroke="#5A6672" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z" />
  <path d="M12 22V12" />
  <path d="m3.3 7 7.703 4.734a2 2 0 0 0 1.994 0L20.7 7" />
  <path d="m7.5 4.27 9 5.15" /></g>
  <text x="140" y="250" font-size="20" font-weight="600" fill="#2C3E50" text-anchor="middle">Products</text>
  <text x="140" y="275" font-size="20" font-weight="600" fill="#2C3E50" text-anchor="middle">and services</text>
  <g transform="translate(349,92) scale(1.333)" fill="none" stroke="#5A6672" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17" />
  <polyline points="16 7 22 7 22 13" /></g>
  <text x="365" y="153" font-size="20" font-weight="600" fill="#2C3E50" text-anchor="middle">Gain creators</text>
  <g transform="translate(349,324) scale(1.333)" fill="none" stroke="#5A6672" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z" />
  <path d="m8.5 8.5 7 7" /></g>
  <text x="365" y="385" font-size="20" font-weight="600" fill="#2C3E50" text-anchor="middle">Pain relievers</text>

  <!-- customer profile: circle -->
  <circle cx="740" cy="250" r="200" fill="url(#gBox)" stroke="#002E5D" stroke-width="2.5" filter="url(#sh)"/>
  <line x1="540" y1="250" x2="740" y2="250" stroke="#002E5D" stroke-width="1.5"/>
  <line x1="740" y1="250" x2="881.4" y2="108.6" stroke="#002E5D" stroke-width="1.5"/>
  <line x1="740" y1="250" x2="881.4" y2="391.4" stroke="#002E5D" stroke-width="1.5"/>
  <circle cx="740" cy="250" r="32" fill="#FFFFFF" stroke="#002E5D" stroke-width="2"/>
  <g transform="translate(722,232) scale(1.5)" fill="none" stroke="#002E5D" stroke-width="1.47" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5" />
  <path d="M20 21a8 8 0 0 0-16 0" /></g>

  <g transform="translate(664,96) scale(1.333)" fill="none" stroke="#5A6672" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" />
  <path d="M8 14s1.5 2 4 2 4-2 4-2" />
  <line x1="9" x2="9.01" y1="9" y2="9" />
  <line x1="15" x2="15.01" y1="9" y2="9" /></g>
  <text x="680" y="157" font-size="20" font-weight="600" fill="#2C3E50" text-anchor="middle">Gains</text>
  <g transform="translate(664,327) scale(1.333)" fill="none" stroke="#5A6672" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" />
  <path d="M16 16s-1.5-2-4-2-4 2-4 2" />
  <line x1="9" x2="9.01" y1="9" y2="9" />
  <line x1="15" x2="15.01" y1="9" y2="9" /></g>
  <text x="680" y="388" font-size="20" font-weight="600" fill="#2C3E50" text-anchor="middle">Pains</text>
  <g transform="translate(844,206) scale(1.333)" fill="none" stroke="#5A6672" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="m3 17 2 2 4-4" />
  <path d="m3 7 2 2 4-4" />
  <path d="M13 6h8" />
  <path d="M13 12h8" />
  <path d="M13 18h8" /></g>
  <text x="860" y="267" font-size="20" font-weight="600" fill="#2C3E50" text-anchor="middle">Customer</text>
  <text x="860" y="292" font-size="20" font-weight="600" fill="#2C3E50" text-anchor="middle">jobs</text>

  <!-- fit -->
  <line x1="460" y1="250.0" x2="488" y2="250.0" stroke="#0057B8" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="540" y1="250" x2="512" y2="250" stroke="#0057B8" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="500.0" y="232.0" font-size="20" font-weight="700" fill="#0057B8" text-anchor="middle">Fit</text>

  <!-- names -->
  <text x="260.0" y="500" font-size="22" font-weight="700" fill="#002E5D" text-anchor="middle">Value map</text>
  <text x="740" y="500" font-size="22" font-weight="700" fill="#002E5D" text-anchor="middle">Customer profile</text>
</svg>
