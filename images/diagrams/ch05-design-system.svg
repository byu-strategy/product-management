<text x="500.0" y="235" font-size="17" font-weight="600" fill="#0057B8" text-anchor="middle">Secondary</text>
<text x="500.0" y="282" font-size="17" font-weight="600" fill="#0057B8" text-anchor="middle">Ghost</text>
