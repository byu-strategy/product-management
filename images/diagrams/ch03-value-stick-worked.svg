<text x="660" y="202.0" font-size="16" font-weight="700" fill="#2C3E50">Captures $4</text>
<text x="500" y="477.0" font-size="19" font-weight="700" fill="#0057B8">You, the firm</text>
<text x="500" y="498.0" font-size="16" fill="#5A6672">the app maker</text>
<text x="660" y="465.0" font-size="15" fill="#2C3E50">Receives $6</text>
<text x="660" y="485.0" font-size="15" fill="#2C3E50">Pays out $3</text>
<text x="660" y="506.0" font-size="16" font-weight="700" fill="#0057B8">Captures $3</text>
<text x="500" y="629.0" font-size="19" font-weight="700" fill="#2C3E50">Your supplier</text>
<text x="500" y="650.0" font-size="16" fill="#5A6672">the hosting provider</text>
<text x="660" y="617.0" font-size="15" fill="#2C3E50">Would accept down to $2</text>
<text x="660" y="637.0" font-size="15" fill="#2C3E50">Receives $3</text>
<text x="660" y="658.0" font-size="16" font-weight="700" fill="#2C3E50">Captures $1</text>
<text x="447" y="50" font-size="15" fill="#5A6672">Above $10, the student walks away</text>
<text x="447" y="694" font-size="15" fill="#5A6672">Below $2, the hosting provider walks away</text>
