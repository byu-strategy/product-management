<text x="250" y="71" text-anchor="end" font-size="27" font-weight="700" fill="#002E5D">$10</text>
<text x="196" y="68" text-anchor="end" font-size="18" font-weight="600" fill="#2C3E50">Willingness to pay</text>
<text x="196" y="89" text-anchor="end" font-size="15" fill="#5A6672">the most your customer</text>
<text x="196" y="108" text-anchor="end" font-size="15" fill="#5A6672">would pay</text>
<text x="250" y="375" text-anchor="end" font-size="27" font-weight="700" fill="#002E5D">$6</text>
<text x="196" y="372" text-anchor="end" font-size="18" font-weight="600" fill="#2C3E50">Price</text>
<text x="196" y="393" text-anchor="end" font-size="15" fill="#5A6672">what your customer</text>
<text x="196" y="412" text-anchor="end" font-size="15" fill="#5A6672">pays you</text>
<text x="250" y="603" text-anchor="end" font-size="27" font-weight="700" fill="#002E5D">$3</text>
<text x="196" y="600" text-anchor="end" font-size="18" font-weight="600" fill="#2C3E50">Cost</text>
<text x="196" y="621" text-anchor="end" font-size="15" fill="#5A6672">what you pay</text>
<text x="196" y="640" text-anchor="end" font-size="15" fill="#5A6672">your supplier</text>
<text x="250" y="679" text-anchor="end" font-size="27" font-weight="700" fill="#002E5D">$2</text>
