<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 812" role="img" aria-labelledby="t d" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">The value stick, annotated with the due-date app example</title>
<desc id="d">A vertical bar drawn to scale, one block per dollar, from willingness to pay at $10 down to willingness to sell at $2. Dashed lines at $10 and $2 are limits where no money changes hands. Solid lines at $6 (price) and $3 (cost) are real payments. Top band, four blocks: customer's delight. The customer, a student, would pay up to $10, pays $6, and captures $4. Middle band, three blocks: your margin. You, the firm, the app maker, receive $6, pay out $3, and capture $3. Bottom band, one block: supplier's surplus. Your supplier, the hosting provider, would accept down to $2, receives $3, and captures $1. Arrows show money moving down the chain: the student pays you $6 and you pay the hosting provider $3. A bracket spans the whole bar: total value created by all three parties is $8, which equals $10 minus $2 and also $4 plus $3 plus $1.</desc>
<defs><linearGradient id="gYou" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0E63C4"/><stop offset="100%" stop-color="#003F87"/></linearGradient><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#002E5D"/></marker></defs>
