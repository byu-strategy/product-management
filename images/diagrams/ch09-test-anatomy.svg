<svg viewBox="0 0 1000 630" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>What a test is, and what the test runner does</title>
<desc>Top: one test, as a mechanism. A test file named format.test.ts has three numbered lines. 1, choose an input, zero dollars: const amount = 0. 2, run your code on it and keep the answer: formatCurrency(amount), which sends the input 0 to your code, the formatCurrency function. 3, state the answer it must give: expect(got).toBe('$0.00'), which supplies the expected answer. Your code returns its output, '$0.00', as got. A compare box holds got and expected side by side. If they are the same, the test passes, shown in green; if they are different, it fails, shown in red. Bottom: the test runner. The command npm test starts the runner, which finds every file whose name ends in .test.ts, twelve shown, and runs them. Eleven pass and one fails. The runner prints a summary: 47 passed, 1 failed. The numbers are illustrative.</desc>
