<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 578" role="img" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>The same eval before and after one prompt change</title>
<desc>The same eval list run before and after one line is added to the prompt: Any email about a charge, refund, or invoice is billing. A table with columns input email, expected answer, output before the change, output after the change. The Save button does nothing: expected bug; bug before, pass; bug after, pass. Please add a dark mode: expected feature request; feature request before and after, pass both times. I was charged twice this month, highlighted green: expected billing; bug before, fail; billing after, pass. Can I get an invoice for my company: expected billing; billing before and after, pass both times. The Refund button crashes the app, highlighted red: expected bug; bug before, pass; billing after, fail. Score: 4 of 5 pass before and 4 of 5 pass after.</desc>
<defs>
<marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#5A6672"/></marker>
<marker id="aN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#002E5D"/></marker>
<filter id="sh" x="-10%" y="-10%" width="120%" height="135%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#002E5D" flood-opacity="0.12"/></filter>
<filter id="shS" x="-10%" y="-10%" width="120%" height="135%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#002E5D" flood-opacity="0.10"/></filter>
<linearGradient id="gW" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F4F7FA"/></linearGradient>
