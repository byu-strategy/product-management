<line x1="528" y1="305.0" x2="578" y2="305.0" stroke="#5A6672" stroke-width="2" marker-end="url(#aG)"/>
<rect x="586" y="288.0" width="164" height="34" rx="6" fill="#FFFFFF" stroke="#B03A3A" stroke-width="1.5"/><text x="598" y="310.5" font-size="15" font-weight="700" fill="#B03A3A" text-anchor="start" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">bug</text>
