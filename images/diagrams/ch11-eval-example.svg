<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>An eval for a course-help bot</title>
<desc>An eval for the course-help bot that answers student questions from the syllabus. The change being tested: one line added to the prompt, If the answer is not in the sources, say you don't know. Five student questions, each with a pass rule, scored before and after the change. Can I turn in Sprint 3 late: must quote the late-work policy; passes before and after. When is the midterm: must say October 20 to 22 in the testing center; passes before and after. Is there parking near class: not in the syllabus, so it must say it does not know; fails before, passes after. How many points is Sprint 6: must say 100; passes before and after. Can I use AI on the exam: must say no, closed book; passes before, fails after, because the bot now says it does not know. The total is 4 of 5 both times: the score did not move, but the bot's behavior did.</desc>
<rect width="1000" height="600" rx="8" fill="#FAFBFC"/>
<rect x="40" y="36" width="920" height="84" rx="12" fill="#E6EEF7"/>
<text x="64" y="68" font-size="15" font-weight="700" letter-spacing="1.2" fill="#002E5D">THE CHANGE BEING TESTED</text>
<text x="64" y="100" font-size="18" fill="#2C3E50">Added to the prompt: "If the answer is not in the sources, say you don't know."</text>
<text x="76" y="166" font-size="15" font-weight="700" letter-spacing="1.2" fill="#8A939C">STUDENT QUESTION</text>
<text x="456" y="166" font-size="15" font-weight="700" letter-spacing="1.2" fill="#8A939C">PASSES IF IT</text>
<text x="778" y="166" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="1.2" fill="#8A939C">BEFORE</text>
<text x="888" y="166" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="1.2" fill="#8A939C">AFTER</text>
<line x1="56" y1="180" x2="944" y2="180" stroke="#D9DEE4" stroke-width="1.5"/>
<text x="76" y="218" font-size="17" fill="#2C3E50">Can I turn in Sprint 3 late?</text><text x="456" y="218" font-size="16" fill="#5A6672">quotes the late-work policy</text><circle cx="778" cy="212" r="15" fill="#FFFFFF" stroke="#2C7A4C" stroke-width="2"/><g transform="translate(769,203) scale(0.75)" fill="none" stroke="#2C7A4C" stroke-width="2.93" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" /></g><circle cx="888" cy="212" r="15" fill="#FFFFFF" stroke="#2C7A4C" stroke-width="2"/><g transform="translate(879,203) scale(0.75)" fill="none" stroke="#2C7A4C" stroke-width="2.93" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" /></g><text x="76" y="280" font-size="17" fill="#2C3E50">When is the midterm?</text><text x="456" y="280" font-size="16" fill="#5A6672">Oct 20 to 22, testing center</text><circle cx="778" cy="274" r="15" fill="#FFFFFF" stroke="#2C7A4C" stroke-width="2"/><g transform="translate(769,265) scale(0.75)" fill="none" stroke="#2C7A4C" stroke-width="2.93" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" /></g><circle cx="888" cy="274" r="15" fill="#FFFFFF" stroke="#2C7A4C" stroke-width="2"/><g transform="translate(879,265) scale(0.75)" fill="none" stroke="#2C7A4C" stroke-width="2.93" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" /></g><rect x="56" y="309" width="888" height="54" rx="8" fill="#E8F3EC"/><text x="76" y="342" font-size="17" fill="#2C3E50">Is there parking near class?</text><text x="456" y="342" font-size="16" fill="#5A6672">says it does not know</text><circle cx="778" cy="336" r="15" fill="#FFFFFF" stroke="#B03A3A" stroke-width="2"/><g transform="translate(769,327) scale(0.75)" fill="none" stroke="#B03A3A" stroke-width="2.93" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18" />
  <path d="m6 6 12 12" /></g><circle cx="888" cy="336" r="15" fill="#FFFFFF" stroke="#2C7A4C" stroke-width="2"/><g transform="translate(879,327) scale(0.75)" fill="none" stroke="#2C7A4C" stroke-width="2.93" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" /></g><text x="832" y="341" text-anchor="middle" font-size="18" fill="#2C7A4C">&#8594;</text><text x="76" y="404" font-size="17" fill="#2C3E50">How many points is Sprint 6?</text><text x="456" y="404" font-size="16" fill="#5A6672">says 100</text><circle cx="778" cy="398" r="15" fill="#FFFFFF" stroke="#2C7A4C" stroke-width="2"/><g transform="translate(769,389) scale(0.75)" fill="none" stroke="#2C7A4C" stroke-width="2.93" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" /></g><circle cx="888" cy="398" r="15" fill="#FFFFFF" stroke="#2C7A4C" stroke-width="2"/><g transform="translate(879,389) scale(0.75)" fill="none" stroke="#2C7A4C" stroke-width="2.93" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" /></g><rect x="56" y="433" width="888" height="54" rx="8" fill="#F8E6E6"/><text x="76" y="466" font-size="17" fill="#2C3E50">Can I use AI on the exam?</text><text x="456" y="466" font-size="16" fill="#5A6672">says no, closed book</text><circle cx="778" cy="460" r="15" fill="#FFFFFF" stroke="#2C7A4C" stroke-width="2"/><g transform="translate(769,451) scale(0.75)" fill="none" stroke="#2C7A4C" stroke-width="2.93" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" /></g><circle cx="888" cy="460" r="15" fill="#FFFFFF" stroke="#B03A3A" stroke-width="2"/><g transform="translate(879,451) scale(0.75)" fill="none" stroke="#B03A3A" stroke-width="2.93" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18" />
  <path d="m6 6 12 12" /></g><text x="832" y="465" text-anchor="middle" font-size="18" fill="#B03A3A">&#8594;</text>
<line x1="56" y1="504" x2="944" y2="504" stroke="#D9DEE4" stroke-width="1.5"/>
<text x="76" y="540" font-size="17" font-weight="700" fill="#002E5D">Passes</text>
<text x="456" y="540" font-size="16" fill="#5A6672">same score, different failures</text>
<text x="778" y="540" text-anchor="middle" font-size="19" font-weight="700" fill="#002E5D">4 of 5</text>
<text x="888" y="540" text-anchor="middle" font-size="19" font-weight="700" fill="#002E5D">4 of 5</text>
</svg>