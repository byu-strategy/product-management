<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 424" role="img" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>One eval run on a support-email sorter</title>
<desc>One eval run on an AI feature that sorts support emails into bug, billing, or feature request. Three test cases, each a row. On the left, the input emails: 1, The Save button does nothing. 2, Please add a dark mode. 3, I was charged twice this month. Each goes through the same box, your AI feature, made of a prompt and a model. Each output is shown next to the expected answer, which was written before the run, inside a dashed frame labeled code compares the labels. Row 1: output bug, expected bug, pass. Row 2: output feature request, expected feature request, pass. Row 3: output bug, expected billing, fail, shown in red. Below: score, 2 of 3 pass.</desc>
<defs>
<marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#5A6672"/></marker>
<marker id="aN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#002E5D"/></marker>
<filter id="sh" x="-10%" y="-10%" width="120%" height="135%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#002E5D" flood-opacity="0.12"/></filter>
<filter id="shS" x="-10%" y="-10%" width="120%" height="135%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#002E5D" flood-opacity="0.10"/></filter>
<linearGradient id="gW" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F4F7FA"/></linearGradient>
<linearGradient id="gB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3F7FC"/><stop offset="1" stop-color="#E6EEF7"/></linearGradient>
<linearGradient id="gNavy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E3F6A"/><stop offset="1" stop-color="#001A36"/></linearGradient>
<linearGradient id="gGreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3F9F5"/><stop offset="1" stop-color="#E3F0E7"/></linearGradient>
<linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FCF5F5"/><stop offset="1" stop-color="#F5E3E3"/></linearGradient>
</defs>
<rect width="1000" height="424" rx="8" fill="#FAFBFC"/>
<rect x="560" y="22" width="416" height="332" rx="12" fill="none" stroke="#0057B8" stroke-width="1.5" stroke-dasharray="6 5"/>
<rect x="578" y="10" width="252" height="26" fill="#FAFBFC"/>
<g transform="translate(584,11) scale(0.9167)" fill="none" stroke="#0057B8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6" />
  <polyline points="8 6 2 12 8 18" /></g>
<text x="614" y="30" font-size="17" font-weight="700" fill="#0057B8" text-anchor="start">Code compares the labels</text>
<text x="30" y="74" font-size="15" font-weight="700" fill="#5A6672" text-anchor="start">INPUT: A SUPPORT EMAIL</text>
<text x="586" y="74" font-size="15" font-weight="700" fill="#5A6672" text-anchor="start">OUTPUT</text>
