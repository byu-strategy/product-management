<rect x="574" y="272" width="390" height="66" rx="10" fill="url(#gRed)" stroke="#D9DEE4" stroke-width="1.5"/>
<circle cx="50" cy="305.0" r="14" fill="#002E5D"/>
<text x="50" y="310.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="76" y="311.0" font-size="17" font-weight="400" fill="#2C3E50" text-anchor="start">“I was charged twice this month.”</text>
