<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" role="img" aria-labelledby="t d" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">Designing the schedule scan for an AI that can be wrong</title>
<desc id="d">A phone screen titled 'Review scanned shifts' from ShiftSwap's schedule scan, with five numbered callouts. 1, set expectations: a note at the top says 'Check before saving. It can misread handwriting.' 2, show the evidence: each of five shift rows shows a cropped image of the handwritten paper schedule next to the value the model read. 3, draft, not action: the list is labeled 'Draft, 5 shifts found, none saved', every value has an edit pencil, and the Friday row, where the handwriting says 7 to 10 but the model read 1:00 to 10:00 PM, is outlined and marked 'Check this'. 4, easy to dismiss and undo: a Discard draft link, and after saving a '5 shifts saved' message with an Undo button for ten seconds. 5, human on what matters: nothing saves until the student taps 'Save 5 shifts', and the model never posts, trades, or approves a shift.</desc>
