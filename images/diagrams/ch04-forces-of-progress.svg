<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="t d" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title id="t">The four forces of a switch</title>
  <desc id="d">On the left, today's habit: Venmo plus a sign-up sheet. On the right, the new page that shows who has paid. Two blue arrows point right, toward switching: push, Sunday spent matching payments, and pull, who has paid, updated for you. Two gray arrows point left, against switching: anxiety, what if it gets a payment wrong, and habit, everyone already Venmos the treasurer. At the bottom: they switch only when push plus pull is greater than anxiety plus habit.</desc>
  <defs>
    <linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E63C4"/>
      <stop offset="100%" stop-color="#004A9E"/>
    </linearGradient>
    <linearGradient id="gGray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A3ACB5"/>
      <stop offset="100%" stop-color="#848E98"/>
    </linearGradient>
    <linearGradient id="gToday" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F1F3F5"/>
      <stop offset="100%" stop-color="#E1E5E9"/>
    </linearGradient>
    <linearGradient id="gNew" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2F7FC"/>
      <stop offset="100%" stop-color="#D6E4F3"/>
    </linearGradient>
    <filter id="sh" filterUnits="userSpaceOnUse" x="0" y="0" width="1000" height="600">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0A2E4D" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1000" height="600" rx="8" fill="#FAFBFC"/>

  <!-- side panels -->
  <rect x="40" y="40" width="180" height="440" rx="12" fill="#FAFBFC" filter="url(#sh)"/>
  <rect x="40" y="40" width="180" height="440" rx="12" fill="url(#gToday)"/>
  <rect x="780" y="40" width="180" height="440" rx="12" fill="#FAFBFC" filter="url(#sh)"/>
  <rect x="780" y="40" width="180" height="440" rx="12" fill="url(#gNew)"/>

  <!-- pictogram: spreadsheet -->
  <rect x="96" y="168" width="68" height="68" rx="14" fill="#FFFFFF"/>
  <g transform="translate(106,178) scale(2)" fill="none" stroke="#8A939C" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><line x1="3" x2="21" y1="9" y2="9"/><line x1="3" x2="21" y1="15" y2="15"/><line x1="9" x2="9" y1="9" y2="21"/><line x1="15" x2="15" y1="9" y2="21"/></g>
  <text x="130" y="268" text-anchor="middle" font-size="21" font-weight="700" fill="#2C3E50">Today</text>
  <text x="130" y="296" text-anchor="middle" font-size="17" fill="#5A6672">Venmo plus a</text>
  <text x="130" y="318" text-anchor="middle" font-size="17" fill="#5A6672">sign-up sheet</text>

  <!-- pictogram: page with checks -->
  <rect x="836" y="168" width="68" height="68" rx="14" fill="#FFFFFF"/>
  <g transform="translate(846,178) scale(2)" fill="none" stroke="#0057B8" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></g>
  <text x="870" y="268" text-anchor="middle" font-size="21" font-weight="700" fill="#002E5D">New page</text>
  <text x="870" y="296" text-anchor="middle" font-size="17" fill="#2C3E50">shows who</text>
  <text x="870" y="318" text-anchor="middle" font-size="17" fill="#2C3E50">has paid</text>

  <!-- arrows: shadow layer -->
  <g filter="url(#sh)" fill="#FAFBFC">
    <path d="M250,62 H714 V52 L758,90 L714,128 V118 H250 Z"/>
    <path d="M250,164 H714 V154 L758,192 L714,230 V220 H250 Z"/>
    <path d="M750,290 H286 V280 L242,318 L286,356 V346 H750 Z"/>
    <path d="M750,392 H286 V382 L242,420 L286,458 V448 H750 Z"/>
  </g>
  <path d="M250,62 H714 V52 L758,90 L714,128 V118 H250 Z" fill="url(#gBlue)"/>
  <path d="M250,164 H714 V154 L758,192 L714,230 V220 H250 Z" fill="url(#gBlue)"/>
  <path d="M750,290 H286 V280 L242,318 L286,356 V346 H750 Z" fill="url(#gGray)"/>
  <path d="M750,392 H286 V382 L242,420 L286,458 V448 H750 Z" fill="url(#gGray)"/>

  <!-- arrow labels -->
  <text x="272" y="87" font-size="21" font-weight="700" fill="#FFFFFF">Push</text>
  <text x="272" y="109" font-size="16" fill="#D6E4F3">Sunday spent matching payments</text>
  <text x="272" y="189" font-size="21" font-weight="700" fill="#FFFFFF">Pull</text>
  <text x="272" y="211" font-size="16" fill="#D6E4F3">Who has paid, updated for you</text>

  <text x="728" y="315" text-anchor="end" font-size="21" font-weight="700" fill="#FFFFFF">Anxiety</text>
  <text x="728" y="337" text-anchor="end" font-size="16" fill="#F1F3F5">"What if it gets a payment wrong?"</text>
  <text x="728" y="417" text-anchor="end" font-size="21" font-weight="700" fill="#FFFFFF">Habit</text>
  <text x="728" y="439" text-anchor="end" font-size="16" fill="#F1F3F5">Everyone already Venmos the treasurer</text>

  <!-- the rule -->
  <line x1="40" y1="516" x2="960" y2="516" stroke="#D9DEE4" stroke-width="1.5"/>
  <text x="440" y="560" text-anchor="end" font-size="20" font-weight="600" fill="#2C3E50">They switch only when</text>
  <text x="456" y="560" font-size="20" font-weight="700" fill="#0057B8">Push + Pull</text>
  <text x="583" y="560" font-size="20" font-weight="700" fill="#2C3E50">&gt;</text>
  <text x="606" y="560" font-size="20" font-weight="700" fill="#5A6672">Anxiety + Habit</text>
</svg>
