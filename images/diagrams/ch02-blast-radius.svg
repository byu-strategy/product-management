<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 532" role="img" aria-labelledby="t-br d-br" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title id="t-br">Blast radius: how far an action reaches decides whether you can undo it</title>
  <desc id="d-br">Two panels. The left panel, on your laptop, has two columns. First column: Claude edits a file Claude's edit tool; undo with /rewind; so let it run. Second column: a shell command deletes a folder, rm -rf drafts/; /rewind does not track shell commands, so undo with git, and only if the files were committed; so commit first. The right panel, leaves your laptop, where the effect reaches other people, lists pushing to GitHub, deploying to Vercel, writing the live database, and sending an email. No undo, only a new fix later (a revert, a rollback, a correction), highlighted; so you approve it.</desc>
  <defs>
    <linearGradient id="br-panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F6F8FA"/><stop offset="100%" stop-color="#EDF0F3"/></linearGradient>
    <linearGradient id="br-panel2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#EEF3F9"/><stop offset="100%" stop-color="#E2EAF4"/></linearGradient>
    <linearGradient id="br-card" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#F5F8FC"/></linearGradient>
    <linearGradient id="br-accent" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0A63C4"/><stop offset="100%" stop-color="#004A9E"/></linearGradient>
    <marker id="br-gray" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8A939C"/></marker>
    <filter id="br-shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0a2e4d" flood-opacity="0.13"/></filter>
  </defs>
  <rect x="0" y="0" width="1000" height="532" rx="8" fill="#FAFBFC"/>
  <rect x="24" y="16" width="608" height="500" rx="10" fill="url(#br-panel)"/>
  <g transform="translate(51,38) scale(1.083)" fill="none" stroke="#5A6672" stroke-width="2.03" stroke-linecap="round" stroke-linejoin="round"><path d="M20 16V7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v9m16 0H4m16 0 1.28 2.55a1 1 0 0 1-.9 1.45H3.62a1 1 0 0 1-.9-1.45L4 16" /></g>
  <text x="88" y="58" font-size="18" font-weight="700" fill="#5A6672" letter-spacing="0.8">ON YOUR LAPTOP</text>
  <rect x="656" y="16" width="320" height="500" rx="10" fill="url(#br-panel2)"/>
  <g transform="translate(683,38) scale(1.083)" fill="none" stroke="#5A6672" stroke-width="2.03" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z" /></g>
  <text x="720" y="58" font-size="18" font-weight="700" fill="#5A6672" letter-spacing="0.8">LEAVES YOUR LAPTOP</text>
  <rect x="48" y="88" width="272" height="208" rx="10" fill="url(#br-card)" stroke="#D9DEE4" stroke-width="1.2" filter="url(#br-shadow)"/>
  <circle cx="184.0" cy="148" r="34" fill="#E6EEF7"/>
  <g transform="translate(168,132) scale(1.333)" fill="none" stroke="#002E5D" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 22H18a2 2 0 0 0 2-2V7l-5-5H6a2 2 0 0 0-2 2v9.5" />
  <path d="M14 2v4a2 2 0 0 0 2 2h4" />
  <path d="M13.378 15.626a1 1 0 1 0-3.004-3.004l-5.01 5.012a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506z" /></g>
  <text x="184.0" y="222" text-anchor="middle" font-size="20" font-weight="700" fill="#002E5D">Edits a file</text>
  <text x="184.0" y="250" text-anchor="middle" font-size="16" fill="#5A6672">Claude’s edit tool</text>
  <rect x="336" y="88" width="272" height="208" rx="10" fill="url(#br-card)" stroke="#D9DEE4" stroke-width="1.2" filter="url(#br-shadow)"/>
  <circle cx="472.0" cy="148" r="34" fill="#E6EEF7"/>
  <g transform="translate(456,132) scale(1.333)" fill="none" stroke="#002E5D" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="m7 11 2-2-2-2" />
  <path d="M11 13h4" />
  <rect width="18" height="18" x="3" y="3" rx="2" ry="2" /></g>
  <text x="472.0" y="222" text-anchor="middle" font-size="20" font-weight="700" fill="#002E5D">Deletes a folder</text>
  <text x="472.0" y="250" text-anchor="middle" font-size="16" fill="#5A6672" font-family="Menlo, Consolas, monospace">rm -rf drafts/</text>
  <rect x="680" y="88" width="272" height="208" rx="10" fill="url(#br-card)" stroke="#D9DEE4" stroke-width="1.2" filter="url(#br-shadow)"/>
  <g transform="translate(702,116) scale(1)" fill="none" stroke="#002E5D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" x2="6" y1="3" y2="15" />
  <circle cx="18" cy="6" r="3" />
  <circle cx="6" cy="18" r="3" />
  <path d="M18 9a9 9 0 0 1-9 9" /></g>
  <text x="740" y="135" font-size="17" font-weight="600" fill="#002E5D">Pushes to GitHub</text>
  <line x1="702" y1="151" x2="932" y2="151" stroke="#E3E7EB" stroke-width="1.2"/>
  <g transform="translate(702,162) scale(1)" fill="none" stroke="#002E5D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z" />
  <path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z" />
  <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0" />
  <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5" /></g>
  <text x="740" y="181" font-size="17" font-weight="600" fill="#002E5D">Deploys to Vercel</text>
  <line x1="702" y1="197" x2="932" y2="197" stroke="#E3E7EB" stroke-width="1.2"/>
  <g transform="translate(702,208) scale(1)" fill="none" stroke="#002E5D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3" />
  <path d="M3 5V19A9 3 0 0 0 21 19V5" />
  <path d="M3 12A9 3 0 0 0 21 12" /></g>
  <text x="740" y="227" font-size="17" font-weight="600" fill="#002E5D">Writes the live database</text>
  <line x1="702" y1="243" x2="932" y2="243" stroke="#E3E7EB" stroke-width="1.2"/>
  <g transform="translate(702,254) scale(1)" fill="none" stroke="#002E5D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2" />
  <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" /></g>
  <text x="740" y="273" font-size="17" font-weight="600" fill="#002E5D">Sends an email</text>
  <line x1="184.0" y1="298" x2="184.0" y2="322" stroke="#8A939C" stroke-width="2" marker-end="url(#br-gray)"/>
  <rect x="48" y="328" width="272" height="70" rx="10" fill="#FFFFFF" stroke="#D9DEE4" stroke-width="1.5"/>
  <text x="184.0" y="355" text-anchor="middle" font-size="15" fill="#5A6672">Undo with</text>
  <text x="184.0" y="382" text-anchor="middle" font-size="20" font-weight="700" fill="#002E5D">/rewind</text>
  <line x1="472.0" y1="298" x2="472.0" y2="322" stroke="#8A939C" stroke-width="2" marker-end="url(#br-gray)"/>
  <rect x="336" y="328" width="272" height="70" rx="10" fill="#FFFFFF" stroke="#D9DEE4" stroke-width="1.5"/>
  <text x="472.0" y="355" text-anchor="middle" font-size="15" fill="#5A6672">Undo with</text>
  <text x="472.0" y="382" text-anchor="middle" font-size="20" font-weight="700" fill="#002E5D">git, if committed</text>
  <line x1="816.0" y1="298" x2="816.0" y2="322" stroke="#8A939C" stroke-width="2" marker-end="url(#br-gray)"/>
  <rect x="680" y="328" width="272" height="70" rx="10" fill="url(#br-accent)" filter="url(#br-shadow)"/>
  <text x="816.0" y="355" text-anchor="middle" font-size="15" fill="#C9D8EA">No undo; only</text>
  <text x="816.0" y="382" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">a new fix, later</text>
  <line x1="184.0" y1="400" x2="184.0" y2="422" stroke="#8A939C" stroke-width="2" marker-end="url(#br-gray)"/>
  <rect x="48" y="428" width="272" height="60" rx="10" fill="none" stroke="#002E5D" stroke-width="1.5"/>
  <g transform="translate(114,446) scale(1)" fill="none" stroke="#002E5D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3" /></g>
  <text x="148" y="465" font-size="19" font-weight="700" fill="#002E5D">Let it run</text>
  <line x1="472.0" y1="400" x2="472.0" y2="422" stroke="#8A939C" stroke-width="2" marker-end="url(#br-gray)"/>
  <rect x="336" y="428" width="272" height="60" rx="10" fill="none" stroke="#002E5D" stroke-width="1.5"/>
  <g transform="translate(391,446) scale(1)" fill="none" stroke="#002E5D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3" />
  <line x1="3" x2="9" y1="12" y2="12" />
  <line x1="15" x2="21" y1="12" y2="12" /></g>
  <text x="425" y="465" font-size="19" font-weight="700" fill="#002E5D">Commit first</text>
  <line x1="816.0" y1="400" x2="816.0" y2="422" stroke="#8A939C" stroke-width="2" marker-end="url(#br-gray)"/>
  <rect x="680" y="428" width="272" height="60" rx="10" fill="none" stroke="#002E5D" stroke-width="1.5"/>
  <g transform="translate(725,446) scale(1)" fill="none" stroke="#002E5D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2" />
  <path d="M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2" />
  <path d="M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8" />
  <path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15" /></g>
  <text x="759" y="465" font-size="19" font-weight="700" fill="#002E5D">You approve it</text>
</svg>
