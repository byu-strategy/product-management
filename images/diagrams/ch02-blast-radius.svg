<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="t4 d4" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title id="t4">Blast radius: what could it break, and can you undo it?</title>
  <desc id="d4">Three concentric rings. The center is Claude's file edits. The middle ring is local files changed outside Claude's edit tools. A dashed line around the middle ring marks the edge of your laptop. The outer ring is anything that leaves your laptop. On the right, a row for each ring: Claude's file edits are undone by /rewind, so let them run in accept-edits mode. Shell deletes and moves and subagent edits are undone by git only if you committed, so commit and branch first. A push, deploy, database change, or sent email cannot be undone, so gate it with a deny rule, plan mode, or by running it yourself.</desc>
  <defs>
    <linearGradient id="br-outer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EEF0F3"/>
      <stop offset="100%" stop-color="#DCE1E6"/>
    </linearGradient>
    <linearGradient id="br-mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D3E1F1"/>
      <stop offset="100%" stop-color="#AFC8E5"/>
    </linearGradient>
    <linearGradient id="br-inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5FA"/>
    </linearGradient>
    <filter id="br-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0a2e4d" flood-opacity="0.14"/>
    </filter>
    <filter id="br-shadow-sm" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0a2e4d" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1000" height="640" rx="8" fill="#FAFBFC"/>

  <!-- ===== Rings ===== -->
  <circle cx="290" cy="320" r="280" fill="url(#br-outer)" filter="url(#br-shadow)"/>
  <circle cx="290" cy="320" r="190" fill="url(#br-mid)"/>
  <circle cx="290" cy="320" r="100" fill="url(#br-inner)" filter="url(#br-shadow-sm)"/>

  <!-- Outer: cloud pictogram + label -->
  <g transform="translate(270.0,50.0) scale(1.6667)" fill="none" stroke="#002E5D" stroke-width="1.440" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z" /></g>
  <text x="290" y="113" text-anchor="middle" font-size="20" font-weight="700" fill="#002E5D">Leaves your laptop</text>

  <!-- Middle: laptop pictogram + label -->
  <g transform="translate(269.0,145.0) scale(1.7500)" fill="none" stroke="#002E5D" stroke-width="1.371" stroke-linecap="round" stroke-linejoin="round"><path d="M20 16V7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v9m16 0H4m16 0 1.28 2.55a1 1 0 0 1-.9 1.45H3.62a1 1 0 0 1-.9-1.45L4 16" /></g>
  <text x="290" y="203" text-anchor="middle" font-size="20" font-weight="700" fill="#002E5D">Local files</text>

  <!-- Inner: document pictogram + label -->
  <g transform="translate(270.0,268.0) scale(1.6667)" fill="none" stroke="#002E5D" stroke-width="1.440" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 22H18a2 2 0 0 0 2-2V7l-5-5H6a2 2 0 0 0-2 2v9.5" /> <path d="M14 2v4a2 2 0 0 0 2 2h4" /> <path d="M13.378 15.626a1 1 0 1 0-3.004-3.004l-5.01 5.012a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506z" /></g>
  <text x="290" y="340" text-anchor="middle" font-size="20" font-weight="700" fill="#002E5D">Claude's</text>
  <text x="290" y="364" text-anchor="middle" font-size="20" font-weight="700" fill="#002E5D">file edits</text>

  <!-- Laptop boundary: the accent -->
  <circle cx="290" cy="320" r="190" fill="none" stroke="#0057B8" stroke-width="3" stroke-dasharray="10 7"/>
  <rect x="196" y="495" width="188" height="34" rx="17" fill="#0057B8" filter="url(#br-shadow-sm)"/>
  <text x="290" y="518" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">edge of your laptop</text>

  <!-- ===== Right column ===== -->
  <g transform="translate(610.0,127.0) scale(0.8333)" fill="none" stroke="#5A6672" stroke-width="2.640" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5" /> <path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11" /></g>
  <text x="638" y="142" font-size="15" font-weight="700" fill="#5A6672" letter-spacing="1">UNDO WITH</text>
  <text x="800" y="142" font-size="15" font-weight="700" fill="#5A6672" letter-spacing="1">WHAT TO DO</text>
  <line x1="610" y1="158" x2="975" y2="158" stroke="#D9DEE4" stroke-width="1.5"/>
  <circle cx="636" cy="215" r="24" fill="#FFFFFF" stroke="#C3CAD2" stroke-width="1.5"/>
  <circle cx="636" cy="215" r="16" fill="#FFFFFF" stroke="#C3CAD2" stroke-width="1.5"/>
  <circle cx="636" cy="215" r="8.5" fill="#002E5D"/>
  <text x="678" y="211" font-size="19" font-weight="700" fill="#002E5D">/rewind</text>
  <text x="678" y="235" font-size="15" fill="#5A6672">Esc twice</text>
  <text x="800" y="211" font-size="17" fill="#2C3E50">Let it run in</text>
  <text x="800" y="234" font-size="17" fill="#2C3E50">accept-edits mode</text>
  <line x1="610" y1="272" x2="975" y2="272" stroke="#E3E7EB" stroke-width="1.5"/>
  <circle cx="636" cy="329" r="24" fill="#FFFFFF" stroke="#C3CAD2" stroke-width="1.5"/>
  <circle cx="636" cy="329" r="16" fill="#002E5D"/>
  <circle cx="636" cy="329" r="8.5" fill="#FFFFFF" stroke="#C3CAD2" stroke-width="1.5"/>
  <text x="678" y="325" font-size="19" font-weight="700" fill="#002E5D">git</text>
  <text x="678" y="349" font-size="15" fill="#5A6672">if committed</text>
  <text x="800" y="325" font-size="17" fill="#2C3E50">Commit and</text>
  <text x="800" y="348" font-size="17" fill="#2C3E50">branch first</text>
  <line x1="610" y1="386" x2="975" y2="386" stroke="#E3E7EB" stroke-width="1.5"/>
  <circle cx="636" cy="443" r="24" fill="#002E5D"/>
  <circle cx="636" cy="443" r="16" fill="#FFFFFF" stroke="#C3CAD2" stroke-width="1.5"/>
  <circle cx="636" cy="443" r="8.5" fill="#FFFFFF" stroke="#C3CAD2" stroke-width="1.5"/>
  <text x="678" y="439" font-size="19" font-weight="700" fill="#0057B8">nothing</text>
  <text x="678" y="463" font-size="15" fill="#5A6672">it already left</text>
  <text x="800" y="428" font-size="17" fill="#2C3E50">Gate it: deny rule,</text>
  <text x="800" y="451" font-size="17" fill="#2C3E50">plan mode, or run</text>
  <text x="800" y="474" font-size="17" fill="#2C3E50">it yourself</text>
  <line x1="610" y1="500" x2="975" y2="500" stroke="#E3E7EB" stroke-width="1.5"/>
</svg>
