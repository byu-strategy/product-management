<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" role="img" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>QuizMe's first two weeks as a funnel</title>
  <desc>A centered funnel of four bars sized by people: 200 arrived at the landing page, 80 signed up, 16 completed a first quiz, and 8 completed a quiz in week 2. Between the bars, the share of the previous step that continued: 40 percent of arrivals signed up, 20 percent of signups took a first quiz, and 50 percent of quiz-takers came back in week 2. The step from signing up to a first quiz is highlighted as the lowest rate: only 20 percent of the people who signed up took a first quiz.</desc>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1D4F82"/>
      <stop offset="100%" stop-color="#002E5D"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E3E7EC"/>
      <stop offset="100%" stop-color="#EEF1F4"/>
    </linearGradient>
    <linearGradient id="leak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0057B8" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#0057B8" stop-opacity="0.10"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-30%" width="120%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0A2E4D" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1000" height="490" rx="8" fill="#FAFBFC"/>
  <g transform="translate(0,-70)">

  <text x="960" y="118" text-anchor="end" font-size="15" font-weight="600" letter-spacing="1.2" fill="#8A939C">PEOPLE</text>

  <!-- connectors -->
  <polygon points="280,182 800,182 644,240 436,240" fill="url(#flow)"/>
  <polygon points="436,292 644,292 561,350 519,350" fill="url(#leak)"/>
  <polygon points="519,402 561,402 550.5,460 529.5,460" fill="url(#flow)"/>

  <!-- bars -->
  <rect x="280" y="130" width="520" height="52" rx="6" fill="url(#bar)" filter="url(#sh)"/>
  <rect x="436" y="240" width="208" height="52" rx="6" fill="url(#bar)" filter="url(#sh)"/>
  <rect x="519" y="350" width="42" height="52" rx="5" fill="url(#bar)" filter="url(#sh)"/>
  <rect x="529.5" y="460" width="21" height="52" rx="4" fill="url(#bar)" filter="url(#sh)"/>

  <!-- step labels -->
  <g font-size="20" font-weight="600" fill="#002E5D">
    <text x="40" y="163">Arrived</text>
    <text x="40" y="273">Signed up</text>
    <text x="40" y="383">First quiz</text>
    <text x="40" y="493">Came back</text>
  </g>
  <text x="40" y="514" font-size="15" fill="#8A939C">quiz in week 2</text>

  <!-- counts -->
  <g font-size="24" font-weight="700" fill="#002E5D" text-anchor="end">
    <text x="960" y="165">200</text>
    <text x="960" y="275">80</text>
    <text x="960" y="385">16</text>
    <text x="960" y="495">8</text>
  </g>

  <!-- step conversion: one style, one position, accent only on the biggest drop -->
  <g font-size="18" font-weight="600" text-anchor="end">
    <text x="960" y="217" fill="#5A6672">40% of arrivals sign up</text>
    <text x="960" y="327" fill="#0057B8">20% of signups take a quiz</text>
    <text x="960" y="437" fill="#5A6672">50% of quiz-takers return</text>
  </g>
  <text x="430" y="327" text-anchor="end" font-size="18" font-weight="600" fill="#0057B8">Lowest rate</text>
  </g>
</svg>
