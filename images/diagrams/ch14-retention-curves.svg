<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 616" role="img" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>Four shapes of a cohort retention curve</title>
  <desc>A line chart of the share of a cohort still active against weeks since signup, from week 0 to week 8. All four illustrative curves start at 100 percent. The highlighted curve flattens near 30 percent: you have found people who keep using the product. In gray, a rising curve dips to about 40 percent and climbs again, meaning returning users bring others or use it more; a steep first drop falls to under 20 percent in week 1, a first experience problem; and a curve that keeps falling reaches nearly zero by week 8, a core value problem.</desc>
  <defs>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0057B8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0057B8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-5%" y="-20%" width="110%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0057B8" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1000" height="616" rx="8" fill="#FAFBFC"/>
  <text x="40" y="58" font-size="28" font-weight="700" fill="#002E5D">Retention is the truth</text>
  <text x="40" y="88" font-size="18" fill="#5A6672">Share of one signup cohort still active, by week (illustrative)</text>
  <line x1="110" y1="128.0" x2="640" y2="128.0" stroke="#D9DEE4" stroke-width="1"/>
  <text x="98" y="134.0" text-anchor="end" font-size="16" fill="#8A939C">100%</text>
  <line x1="110" y1="230.5" x2="640" y2="230.5" stroke="#D9DEE4" stroke-width="1"/>
  <text x="98" y="236.5" text-anchor="end" font-size="16" fill="#8A939C">75</text>
  <line x1="110" y1="333.0" x2="640" y2="333.0" stroke="#D9DEE4" stroke-width="1"/>
  <text x="98" y="339.0" text-anchor="end" font-size="16" fill="#8A939C">50</text>
  <line x1="110" y1="435.5" x2="640" y2="435.5" stroke="#D9DEE4" stroke-width="1"/>
  <text x="98" y="441.5" text-anchor="end" font-size="16" fill="#8A939C">25</text>
  <line x1="110" y1="538" x2="640" y2="538" stroke="#5A6672" stroke-width="1.5"/>
  <text x="98" y="544" text-anchor="end" font-size="16" fill="#8A939C">0</text>
  <line x1="110.0" y1="538" x2="110.0" y2="544" stroke="#5A6672" stroke-width="1.5"/>
  <text x="110.0" y="566" text-anchor="middle" font-size="16" fill="#8A939C">0</text>
  <line x1="176.2" y1="538" x2="176.2" y2="544" stroke="#5A6672" stroke-width="1.5"/>
  <text x="176.2" y="566" text-anchor="middle" font-size="16" fill="#8A939C">1</text>
  <line x1="242.5" y1="538" x2="242.5" y2="544" stroke="#5A6672" stroke-width="1.5"/>
  <text x="242.5" y="566" text-anchor="middle" font-size="16" fill="#8A939C">2</text>
  <line x1="308.8" y1="538" x2="308.8" y2="544" stroke="#5A6672" stroke-width="1.5"/>
  <text x="308.8" y="566" text-anchor="middle" font-size="16" fill="#8A939C">3</text>
  <line x1="375.0" y1="538" x2="375.0" y2="544" stroke="#5A6672" stroke-width="1.5"/>
  <text x="375.0" y="566" text-anchor="middle" font-size="16" fill="#8A939C">4</text>
  <line x1="441.2" y1="538" x2="441.2" y2="544" stroke="#5A6672" stroke-width="1.5"/>
  <text x="441.2" y="566" text-anchor="middle" font-size="16" fill="#8A939C">5</text>
  <line x1="507.5" y1="538" x2="507.5" y2="544" stroke="#5A6672" stroke-width="1.5"/>
  <text x="507.5" y="566" text-anchor="middle" font-size="16" fill="#8A939C">6</text>
  <line x1="573.8" y1="538" x2="573.8" y2="544" stroke="#5A6672" stroke-width="1.5"/>
  <text x="573.8" y="566" text-anchor="middle" font-size="16" fill="#8A939C">7</text>
  <line x1="640.0" y1="538" x2="640.0" y2="544" stroke="#5A6672" stroke-width="1.5"/>
  <text x="640.0" y="566" text-anchor="middle" font-size="16" fill="#8A939C">8</text>
  <text x="640" y="594" text-anchor="end" font-size="16" fill="#5A6672">weeks since signup</text>
  <path d="M110.0,128.0 C132.1,193.6 154.2,283.1 176.2,324.8 C198.3,366.5 220.4,365.8 242.5,378.1 C264.6,390.4 286.7,393.1 308.8,398.6 C330.8,404.1 352.9,408.2 375.0,410.9 C397.1,413.6 419.2,414.0 441.2,415.0 C463.3,416.0 485.4,416.4 507.5,417.0 C529.6,417.7 551.7,419.1 573.8,419.1 C595.8,419.1 617.9,419.1 640.0,419.1 L640,538 L110,538 Z" fill="url(#area)"/>
  <path d="M110.0,128.0 C132.1,174.5 154.2,232.5 176.2,267.4 C198.3,302.2 220.4,317.3 242.5,337.1 C264.6,356.9 286.7,371.9 308.8,386.3 C330.8,400.6 352.9,411.6 375.0,423.2 C397.1,434.8 419.2,445.8 441.2,456.0 C463.3,466.2 485.4,475.8 507.5,484.7 C529.6,493.6 551.7,502.5 573.8,509.3 C595.8,516.1 617.9,520.2 640.0,525.7" fill="none" stroke="#B4BBC2" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M110.0,128.0 C132.1,238.7 154.2,443.7 176.2,460.1 C198.3,476.5 220.4,475.5 242.5,476.5 C264.6,477.5 286.7,480.6 308.8,480.6 C330.8,480.6 352.9,480.6 375.0,480.6 C397.1,480.6 419.2,480.6 441.2,480.6 C463.3,480.6 485.4,480.6 507.5,480.6 C529.6,480.6 551.7,480.6 573.8,480.6 C595.8,480.6 617.9,480.6 640.0,480.6" fill="none" stroke="#8A939C" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M110.0,128.0 C132.1,189.5 154.2,273.6 176.2,312.5 C198.3,351.4 220.4,351.4 242.5,361.7 C264.6,371.9 286.7,374.0 308.8,374.0 C330.8,374.0 352.9,371.9 375.0,369.9 C397.1,367.8 419.2,364.4 441.2,361.7 C463.3,359.0 485.4,356.2 507.5,353.5 C529.6,350.8 551.7,348.0 573.8,345.3 C595.8,342.6 617.9,339.8 640.0,337.1" fill="none" stroke="#5A6672" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M110.0,128.0 C132.1,193.6 154.2,283.1 176.2,324.8 C198.3,366.5 220.4,365.8 242.5,378.1 C264.6,390.4 286.7,393.1 308.8,398.6 C330.8,404.1 352.9,408.2 375.0,410.9 C397.1,413.6 419.2,414.0 441.2,415.0 C463.3,416.0 485.4,416.4 507.5,417.0 C529.6,417.7 551.7,419.1 573.8,419.1 C595.8,419.1 617.9,419.1 640.0,419.1" fill="none" stroke="#0057B8" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="640.0" cy="525.7" r="4.5" fill="#B4BBC2" stroke="#FAFBFC" stroke-width="2"/>
  <circle cx="640.0" cy="480.6" r="4.5" fill="#8A939C" stroke="#FAFBFC" stroke-width="2"/>
  <circle cx="640.0" cy="337.1" r="4.5" fill="#5A6672" stroke="#FAFBFC" stroke-width="2"/>
  <circle cx="640.0" cy="419.1" r="7" fill="#0057B8" stroke="#FAFBFC" stroke-width="2"/>
  <text x="664" y="339.1" font-size="19" font-weight="700" fill="#5A6672">Rising</text>
  <text x="664" y="361.1" font-size="16" fill="#8A939C">they bring others or use it more</text>
  <text x="664" y="421.1" font-size="22" font-weight="700" fill="#0057B8">Flattening</text>
  <text x="664" y="443.1" font-size="16" fill="#2C3E50">you found people who stay</text>
  <text x="664" y="482.6" font-size="19" font-weight="700" fill="#8A939C">Steep first drop</text>
  <text x="664" y="504.6" font-size="16" fill="#8A939C">first experience problem</text>
  <text x="664" y="533.7" font-size="19" font-weight="700" fill="#9AA2AA">Keeps falling</text>
  <text x="664" y="555.7" font-size="16" fill="#8A939C">core value problem</text>
</svg>
