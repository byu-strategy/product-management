<svg viewBox="0 0 1000 440" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>Developer tools: five panels, five questions</title>
<desc>A sketch of the browser developer tools. Along the top, five panels, each with the question it answers. Device toolbar: how does it look on a phone? Elements: what is on the page, and why does it look that way? Console: did the code throw an error? Network: what requests went out, and what came back? Application: what does the browser remember? The Network panel is open. Its list shows the page, a script, a stylesheet, and an image, each GET with status 200, and a highlighted row: tasks, POST, 201, fetch. Beside the list, the selected request's payload, task_text Buy groceries, and its response, id 123, task_text Buy groceries, completed false.</desc>
<defs><filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.12"/></filter></defs>
