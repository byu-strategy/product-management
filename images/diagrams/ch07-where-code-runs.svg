<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" role="img" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>Where code runs</title>
  <desc>Three places, each a column. The browser, which the user controls: they can see and change all of it, so it holds no secrets and no checks that matter. Your server: secret keys live there, and so do the checks that matter. The database: it remembers what survives a refresh, and its row-level security applies to every request. A dashed line between the browser and the server marks where the user's control ends. Requests go from browser to server to database; in a Supabase app the browser can also query the database directly, through row-level security.</desc>
  <defs>
    <linearGradient id="gCard" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#F3F6F9"/></linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F0F5FB"/><stop offset="100%" stop-color="#DCE7F4"/></linearGradient>
    <linearGradient id="gGray" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F4F6F8"/><stop offset="100%" stop-color="#E3E7EB"/></linearGradient>
    <linearGradient id="gNavy" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0E3F6A"/><stop offset="100%" stop-color="#001A36"/></linearGradient>
    <linearGradient id="gRoyal" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2A7AD6"/><stop offset="100%" stop-color="#0049A0"/></linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F1F8F3"/><stop offset="100%" stop-color="#E0EFE5"/></linearGradient>
    <linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FBF3F3"/><stop offset="100%" stop-color="#F3E1E1"/></linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="135%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#002E5D" flood-opacity="0.13"/></filter>
    <filter id="shS" x="-10%" y="-10%" width="120%" height="135%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#002E5D" flood-opacity="0.12"/></filter>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#8A939C"/></marker>
    <marker id="ahD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#5A6672"/></marker>
    <marker id="ahA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#0057B8"/></marker>
    <marker id="ahN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#002E5D"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="490" rx="8" fill="#FAFBFC"/>
  <line x1="340" y1="120" x2="340" y2="440" stroke="#0057B8" stroke-width="2.5" stroke-dasharray="3 8" stroke-linecap="round"/>
  <text x="322" y="466" font-size="15" font-weight="700" text-anchor="end" letter-spacing="1.2" fill="#0057B8">THE USER CONTROLS</text>
  <text x="358" y="466" font-size="15" font-weight="700" letter-spacing="1.2" fill="#0057B8">YOU CONTROL</text>
  <path d="M180 122 C180 40 820 40 820 120" fill="none" stroke="#8A939C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6" marker-end="url(#ah)"/>
  <rect x="345" y="58" width="310" height="28" fill="#FAFBFC"/>
  <text x="500" y="78" font-size="16" text-anchor="middle" fill="#5A6672">Supabase: direct, through row-level security</text>
  <circle cx="180" cy="178" r="46" fill="url(#gBlue)" stroke="#B9D0EA" stroke-width="1.5" filter="url(#sh)"/>
  <g transform="translate(159.0,157.0) scale(1.750)" fill="none" stroke="#002E5D" stroke-width="1.49" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2" /> <path d="M10 4v4" /> <path d="M2 8h20" /> <path d="M6 4v4" /></g>
  <text x="180" y="260" font-size="21" font-weight="700" text-anchor="middle" fill="#002E5D">Browser</text>
  <text x="180" y="284" font-size="16" text-anchor="middle" fill="#8A939C">the user's machine</text>
  <g transform="translate(83.0,311.0) scale(0.917)" fill="none" stroke="#5A6672" stroke-width="2.40" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" /> <circle cx="12" cy="12" r="3" /></g>
  <text x="114" y="322" font-size="16" fill="#2C3E50">sees and changes</text>
  <text x="114" y="343" font-size="16" fill="#2C3E50">all of it</text>
  <g transform="translate(83.0,367.0) scale(0.917)" fill="none" stroke="#5A6672" stroke-width="2.40" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /> <path d="m15 9-6 6" /> <path d="m9 9 6 6" /></g>
  <text x="114" y="378" font-size="16" fill="#2C3E50">no secrets, no checks</text>
  <text x="114" y="399" font-size="16" fill="#2C3E50">that matter</text>
  <circle cx="500" cy="178" r="46" fill="url(#gBlue)" stroke="#B9D0EA" stroke-width="1.5" filter="url(#sh)"/>
  <g transform="translate(479.0,157.0) scale(1.750)" fill="none" stroke="#002E5D" stroke-width="1.49" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="8" x="2" y="2" rx="2" ry="2" /> <rect width="20" height="8" x="2" y="14" rx="2" ry="2" /> <line x1="6" x2="6.01" y1="6" y2="6" /> <line x1="6" x2="6.01" y1="18" y2="18" /></g>
  <text x="500" y="260" font-size="21" font-weight="700" text-anchor="middle" fill="#002E5D">Server</text>
  <text x="500" y="284" font-size="16" text-anchor="middle" fill="#8A939C">yours</text>
  <g transform="translate(403.0,311.0) scale(0.917)" fill="none" stroke="#5A6672" stroke-width="2.40" stroke-linecap="round" stroke-linejoin="round"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z" /> <circle cx="16.5" cy="7.5" r=".5" fill="currentColor" /></g>
  <text x="434" y="322" font-size="16" fill="#2C3E50">secret keys</text>
  <text x="434" y="343" font-size="16" fill="#2C3E50">live here</text>
  <g transform="translate(403.0,367.0) scale(0.917)" fill="none" stroke="#5A6672" stroke-width="2.40" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" /> <path d="m9 12 2 2 4-4" /></g>
  <text x="434" y="378" font-size="16" fill="#2C3E50">the checks</text>
  <text x="434" y="399" font-size="16" fill="#2C3E50">that matter</text>
  <circle cx="820" cy="178" r="46" fill="url(#gBlue)" stroke="#B9D0EA" stroke-width="1.5" filter="url(#sh)"/>
  <g transform="translate(799.0,157.0) scale(1.750)" fill="none" stroke="#002E5D" stroke-width="1.49" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3" /> <path d="M3 5V19A9 3 0 0 0 21 19V5" /> <path d="M3 12A9 3 0 0 0 21 12" /></g>
  <text x="820" y="260" font-size="21" font-weight="700" text-anchor="middle" fill="#002E5D">Database</text>
  <text x="820" y="284" font-size="16" text-anchor="middle" fill="#8A939C">yours</text>
  <g transform="translate(723.0,311.0) scale(0.917)" fill="none" stroke="#5A6672" stroke-width="2.40" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /> <path d="M3 3v5h5" /> <path d="M12 7v5l4 2" /></g>
  <text x="754" y="322" font-size="16" fill="#2C3E50">remembers after</text>
  <text x="754" y="343" font-size="16" fill="#2C3E50">a refresh</text>
  <g transform="translate(723.0,367.0) scale(0.917)" fill="none" stroke="#5A6672" stroke-width="2.40" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2" /> <path d="M7 11V7a5 5 0 0 1 10 0v4" /></g>
  <text x="754" y="378" font-size="16" fill="#2C3E50">row-level security on</text>
  <text x="754" y="399" font-size="16" fill="#2C3E50">every request</text>
  <path d="M232 178 H440" fill="none" stroke="#8A939C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/>
  <text x="400" y="166" font-size="16" text-anchor="middle" fill="#5A6672">requests</text>
  <path d="M552 178 H760" fill="none" stroke="#8A939C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/>
</svg>
