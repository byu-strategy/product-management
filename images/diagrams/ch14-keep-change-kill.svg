<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>Keep, change, or kill: usage against upkeep</title>
  <desc>A grid of QuizMe features. The horizontal axis is the share of active users who used a feature, from few to most. The vertical axis is its upkeep cost, from low to high. The whole right half, features most active users touch, is keep and invest, because improvements pay off there; quiz from notes sits there, used by 90 percent, with model cost per quiz. Top left, few users and high upkeep, is the candidate to kill if it is not the core task; flashcard export sits there, used by 5 percent and broken twice in two sprints. Bottom left, few users and low upkeep, is change it, then test whether it brings people back; study streaks sits there at 30 percent. Off the grid, dark mode is not logged, so it cannot be judged until an event is added.</desc>
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#002E5D" flood-opacity="0.12"/>
    </filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A6672"/>
    </marker>
    <linearGradient id="qk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DCE7F3"/><stop offset="100%" stop-color="#EEF3F9"/>
    </linearGradient>
    <linearGradient id="qx" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E7EAEE"/><stop offset="100%" stop-color="#F1F3F5"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1000" height="560" rx="8" fill="#FAFBFC"/>

  <g transform="translate(0,-90)">

  <!-- quadrants -->
  <rect x="150" y="130" width="300" height="210" fill="url(#qx)"/>
  <rect x="450" y="130" width="300" height="420" fill="url(#qk)"/>
  <rect x="150" y="340" width="300" height="210" fill="#FFFFFF"/>
  <rect x="150" y="130" width="600" height="420" fill="none" stroke="#D9DEE4" stroke-width="1.5" filter="url(#sh)"/>
  <line x1="450" y1="130" x2="450" y2="550" stroke="#D9DEE4" stroke-width="1.5"/>
  <line x1="150" y1="340" x2="450" y2="340" stroke="#D9DEE4" stroke-width="1.5"/>

  <!-- quadrant titles -->
  <text x="168" y="164" font-size="20" font-weight="700" fill="#B03A3A">Candidate to kill</text>
  <text x="168" y="188" font-size="15" fill="#5A6672">if it is not the core task</text>

  <text x="468" y="164" font-size="20" font-weight="700" fill="#0057B8">Keep and invest</text>
  <text x="468" y="188" font-size="15" fill="#5A6672">most active users touch it,</text>
  <text x="468" y="207" font-size="15" fill="#5A6672">so improvements pay off here</text>

  <text x="168" y="374" font-size="20" font-weight="700" fill="#002E5D">Change it, then test</text>
  <text x="168" y="398" font-size="15" fill="#5A6672">test whether it brings people back</text>


  <!-- features -->
  <circle cx="180" cy="270" r="9" fill="#B03A3A" filter="url(#sh)"/>
  <text x="200" y="268" font-size="17" font-weight="600" fill="#2C3E50">Flashcard export</text>
  <text x="200" y="289" font-size="15" fill="#5A6672">5%, broke twice in two sprints</text>

  <circle cx="690" cy="260" r="11" fill="#0057B8" filter="url(#sh)"/>
  <text x="672" y="258" text-anchor="end" font-size="17" font-weight="600" fill="#2C3E50">Quiz from notes</text>
  <text x="672" y="279" text-anchor="end" font-size="15" fill="#5A6672">90%, model cost per quiz</text>

  <circle cx="330" cy="480" r="9" fill="#002E5D" filter="url(#sh)"/>
  <text x="312" y="478" text-anchor="end" font-size="17" font-weight="600" fill="#2C3E50">Study streaks</text>
  <text x="312" y="499" text-anchor="end" font-size="15" fill="#5A6672">30%, low upkeep</text>

  <!-- axes -->
  <line x1="150" y1="575" x2="740" y2="575" stroke="#5A6672" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="150" y="600" font-size="16" fill="#5A6672">few</text>
  <text x="750" y="600" text-anchor="end" font-size="16" fill="#5A6672">most</text>
  <text x="450" y="624" text-anchor="middle" font-size="17" font-weight="600" fill="#2C3E50">Share of active users who used it</text>

  <line x1="125" y1="550" x2="125" y2="140" stroke="#5A6672" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="80" y="340" text-anchor="middle" font-size="17" font-weight="600" fill="#2C3E50" transform="rotate(-90 80 340)">Upkeep cost</text>
  <text x="104" y="550" text-anchor="middle" font-size="16" fill="#5A6672" transform="rotate(-90 104 550)">low</text>
  <text x="104" y="145" text-anchor="end" font-size="16" fill="#5A6672" transform="rotate(-90 104 145)">high</text>

  <!-- off the grid -->
  <rect x="778" y="130" width="190" height="210" rx="10" fill="#FFFFFF" stroke="#B4BBC2" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="796" y="164" font-size="20" font-weight="700" fill="#002E5D">Can't tell</text>
  <text x="796" y="188" font-size="15" fill="#5A6672">not logged yet</text>
  <circle cx="806" cy="256" r="9" fill="#FFFFFF" stroke="#5A6672" stroke-width="2"/>
  <text x="824" y="262" font-size="17" font-weight="600" fill="#2C3E50">Dark mode</text>
  <text x="796" y="306" font-size="15" fill="#5A6672">Add an event,</text>
  <text x="796" y="325" font-size="15" fill="#5A6672">then decide.</text>

  </g>
</svg>
