<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>A pull request is the gate</title>
  <desc>A git graph. The main line runs along the bottom and ends at the live site; it keeps running while a change is built. A branch named feature-rating leaves main, collects two commits, and passes through a pull request gate before it can merge back. The gate holds four checks: the diff, automated checks, a preview URL, and a review. After the gate the branch merges into main, and Vercel deploys main to the live site.</desc>
  <defs>
    <linearGradient id="gCard" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#F3F6F9"/></linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F0F5FB"/><stop offset="100%" stop-color="#DCE7F4"/></linearGradient>
    <linearGradient id="gGray" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F4F6F8"/><stop offset="100%" stop-color="#E3E7EB"/></linearGradient>
    <linearGradient id="gNavy" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0E3F6A"/><stop offset="100%" stop-color="#001A36"/></linearGradient>
    <linearGradient id="gRoyal" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2A7AD6"/><stop offset="100%" stop-color="#0049A0"/></linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F1F8F3"/><stop offset="100%" stop-color="#E0EFE5"/></linearGradient>
    <linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FBF3F3"/><stop offset="100%" stop-color="#F3E1E1"/></linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="135%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#002E5D" flood-opacity="0.13"/></filter>
    <filter id="shS" x="-10%" y="-10%" width="120%" height="135%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#002E5D" flood-opacity="0.12"/></filter>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#8A939C"/></marker>
    <marker id="ahD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#5A6672"/></marker>
    <marker id="ahA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#0057B8"/></marker>
    <marker id="ahN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#002E5D"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="430" rx="8" fill="#FAFBFC"/>
  <line x1="40" y1="330" x2="790" y2="330" stroke="#002E5D" stroke-width="5" stroke-linecap="round"/>
  <path d="M200 330 C200 190 220 150 270 150 H730 C770 150 790 190 790 330" fill="none" stroke="#6495ED" stroke-width="5" stroke-linecap="round"/>
  <circle cx="80" cy="330" r="10" fill="#FFFFFF" stroke="#002E5D" stroke-width="4"/>
  <circle cx="200" cy="330" r="10" fill="#FFFFFF" stroke="#002E5D" stroke-width="4"/>
  <circle cx="320" cy="150" r="10" fill="#FFFFFF" stroke="#6495ED" stroke-width="4"/>
  <circle cx="400" cy="150" r="10" fill="#FFFFFF" stroke="#6495ED" stroke-width="4"/>
  <circle cx="790" cy="330" r="13" fill="#002E5D" stroke="#FFFFFF" stroke-width="3" filter="url(#shS)"/>
  <g transform="translate(782.0,322.0) scale(0.667)" fill="none" stroke="#FFFFFF" stroke-width="3.30" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="18" r="3" /> <circle cx="6" cy="6" r="3" /> <path d="M6 21V9a9 9 0 0 0 9 9" /></g>
  <rect x="222" y="88" width="150" height="30" rx="15" fill="#FFFFFF" stroke="#6495ED" stroke-width="1.5"/>
  <text x="297" y="109" font-size="15" font-weight="600" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#0057B8">feature-rating</text>
  <text x="360" y="188" font-size="16" text-anchor="middle" fill="#5A6672">build and break safely</text>
  <rect x="40" y="375" width="72" height="30" rx="15" fill="url(#gNavy)" stroke="#002E5D" stroke-width="1"/>
  <text x="76" y="396" font-size="15" font-weight="600" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#FFFFFF">main</text>
  <text x="470" y="396" font-size="16" text-anchor="middle" fill="#5A6672">main, and the live site, stay untouched</text>
  <text x="790" y="396" font-size="16" font-weight="600" text-anchor="middle" fill="#002E5D">merge</text>
  <rect x="500" y="50" width="200" height="214" rx="14" fill="url(#gCard)" stroke="#0057B8" stroke-width="2.5" filter="url(#sh)"/>
  <path d="M501.25 102 V64 Q501.25 51.25 514 51.25 H686 Q698.75 51.25 698.75 64 V102 Z" fill="url(#gRoyal)"/>
  <g transform="translate(519.0,66.0) scale(0.917)" fill="none" stroke="#FFFFFF" stroke-width="2.62" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="18" r="3" /> <circle cx="6" cy="6" r="3" /> <path d="M13 6h3a2 2 0 0 1 2 2v7" /> <line x1="6" x2="6" y1="9" y2="21" /></g>
  <text x="552" y="84" font-size="18" font-weight="700" fill="#FFFFFF">Pull request</text>
  <g transform="translate(520.0,120.0) scale(0.833)" fill="none" stroke="#0057B8" stroke-width="2.64" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" /> <path d="M9 10h6" /> <path d="M12 13V7" /> <path d="M9 17h6" /></g>
  <text x="552" y="136" font-size="16" fill="#2C3E50">the diff</text>
  <g transform="translate(520.0,156.0) scale(0.833)" fill="none" stroke="#0057B8" stroke-width="2.64" stroke-linecap="round" stroke-linejoin="round"><path d="m3 17 2 2 4-4" /> <path d="m3 7 2 2 4-4" /> <path d="M13 6h8" /> <path d="M13 12h8" /> <path d="M13 18h8" /></g>
  <text x="552" y="172" font-size="16" fill="#2C3E50">automated checks</text>
  <g transform="translate(520.0,192.0) scale(0.833)" fill="none" stroke="#0057B8" stroke-width="2.64" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" /> <circle cx="12" cy="12" r="3" /></g>
  <text x="552" y="208" font-size="16" fill="#2C3E50">preview URL</text>
  <g transform="translate(520.0,228.0) scale(0.833)" fill="none" stroke="#0057B8" stroke-width="2.64" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /> <circle cx="9" cy="7" r="4" /> <polyline points="16 11 18 13 22 9" /></g>
  <text x="552" y="244" font-size="16" fill="#2C3E50">review</text>
  <path d="M808 330 H852" fill="none" stroke="#8A939C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/>
  <text x="831" y="314" font-size="15" text-anchor="middle" fill="#5A6672">deploys</text>
  <circle cx="900" cy="330" r="38" fill="url(#gBlue)" stroke="#B9D0EA" stroke-width="1.5" filter="url(#sh)"/>
  <g transform="translate(883.0,313.0) scale(1.417)" fill="none" stroke="#002E5D" stroke-width="1.84" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /> <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" /> <path d="M2 12h20" /></g>
  <text x="900" y="396" font-size="16" font-weight="600" text-anchor="middle" fill="#002E5D">live site</text>
</svg>
