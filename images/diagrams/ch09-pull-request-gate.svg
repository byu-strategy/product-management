<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 658" role="img" aria-labelledby="prg-t prg-d" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="prg-t">One pull request, from branch to live site</title>
<desc id="prg-d">A timeline in seven numbered steps, left to right, with one horizontal lane per participant: you and Claude Code, GitHub Actions, Vercel, the reviewer, and the repository. Steps 1 to 3, you and Claude Code: create a branch, make commits, push the branch to GitHub and open a pull request. Step 4: GitHub Actions runs the automated checks, which pass or fail, and Vercel builds a preview URL. Step 5: the reviewer, a teammate or you, reads the diff and approves. Steps 4 and 5 fall inside a shaded window, the time the pull request is open. Step 6: you merge. Step 7: Vercel deploys main to the live site. In the repository lane, a branch named feature-rating leaves main at step 1, collects two commits, passes through a box labeled pull request, and merges back into main at step 6. A bracket under main from step 1 to step 6 reads: main and the live site unchanged.</desc>
