<linearGradient id="prg-navy" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0E3F6A"/><stop offset="100%" stop-color="#001A36"/></linearGradient>
<linearGradient id="prg-gate" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#EEF4FB"/><stop offset="100%" stop-color="#DCE8F6"/></linearGradient>
