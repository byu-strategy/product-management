<svg viewBox="0 0 1000 676" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>What an API is</title>
<desc>Three columns. On the left, your server: your app, calling Claude. In the middle, the Claude API at api.anthropic.com, drawn as a card listing its endpoints, each a method and an address: GET /v1/models, POST /v1/files, GET /v1/files, POST /v1/messages, POST /v1/skills, GET /v1/skills, and more. Under the card: published in the docs. On the right, past a dashed line, the part behind the API, hidden from callers: Anthropic&#x27;s code, servers, and models, which can change without changing the endpoints. Your server sends one request, labeled request, to the highlighted endpoint, POST /v1/messages. The request is labeled part by part: the endpoint; an API key header, x-api-key: sk-ant-api03-..., which identifies whose account is calling; the API version header, anthropic-version: 2023-06-01; and the input, a JSON body with model claude-sonnet-5-5, max_tokens 200, and messages holding one user message, Hello, Claude. The response, labeled response, comes back from the same endpoint with status 200 OK and the output, a JSON body with role assistant and content holding one text block, Hello! How can I help?</desc>
