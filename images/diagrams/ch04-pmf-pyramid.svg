<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="t d" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title id="t">The Lean Product Process: the product-market fit pyramid</title>
  <desc id="d">A pyramid split into two halves with a gap between them. The bottom half is the market, which you discover: layer 1, target customer, at the base, and layer 2, underserved needs, above it. The top half is the product, which you choose: layer 3, value proposition, layer 4, feature set, and layer 5, UX, at the tip. In the gap between the halves, two double-headed arrows flank the label product-market fit. A dashed arrow, step 6, test with customers, runs from the tip of the pyramid around the right side back down to the base. Adapted from Dan Olsen, The Lean Product Playbook.</desc>
  <defs>
    <linearGradient id="gM1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0A3F7A"/><stop offset="100%" stop-color="#002E5D"/></linearGradient>
    <linearGradient id="gM2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2F6CB3"/><stop offset="100%" stop-color="#1D5598"/></linearGradient>
    <linearGradient id="gP1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#B2CAE6"/><stop offset="100%" stop-color="#9DBBDF"/></linearGradient>
    <linearGradient id="gP2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#C9DBEF"/><stop offset="100%" stop-color="#B2CAE6"/></linearGradient>
    <linearGradient id="gP3" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#DCE7F4"/><stop offset="100%" stop-color="#C9DBEF"/></linearGradient>
    <filter id="sh" filterUnits="userSpaceOnUse" x="0" y="0" width="1000" height="650">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0A2E4D" flood-opacity="0.14"/>
    </filter>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0057B8"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A6672"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="650" rx="8" fill="#FAFBFC"/>

  <polygon points="540.0,50 540.0,50 610.7,160 469.3,160" fill="#FAFBFC" filter="url(#sh)"/>
  <polygon points="540.0,50 540.0,50 610.7,160 469.3,160" fill="url(#gP3)" stroke-linejoin="round"/>
  <text x="540" y="132" text-anchor="middle" font-size="20" font-weight="600" fill="#002E5D">5. UX</text>
  <polygon points="465.4,166 614.6,166 675.0,260 405.0,260" fill="#FAFBFC" filter="url(#sh)"/>
  <polygon points="465.4,166 614.6,166 675.0,260 405.0,260" fill="url(#gP2)" stroke-linejoin="round"/>
  <text x="540" y="220" text-anchor="middle" font-size="20" font-weight="600" fill="#002E5D">4. Feature set</text>
  <polygon points="401.1,266 678.9,266 739.3,360 340.7,360" fill="#FAFBFC" filter="url(#sh)"/>
  <polygon points="401.1,266 678.9,266 739.3,360 340.7,360" fill="url(#gP1)" stroke-linejoin="round"/>
  <text x="540" y="320" text-anchor="middle" font-size="20" font-weight="600" fill="#002E5D">3. Value proposition</text>
  <polygon points="289.2,440 790.8,440 842.2,520 237.8,520" fill="#FAFBFC" filter="url(#sh)"/>
  <polygon points="289.2,440 790.8,440 842.2,520 237.8,520" fill="url(#gM2)" stroke-linejoin="round"/>
  <text x="540" y="487" text-anchor="middle" font-size="20" font-weight="600" fill="#FFFFFF">2. Underserved needs</text>
  <polygon points="233.9,526 846.1,526 900.1,610 179.9,610" fill="#FAFBFC" filter="url(#sh)"/>
  <polygon points="233.9,526 846.1,526 900.1,610 179.9,610" fill="url(#gM1)" stroke-linejoin="round"/>
  <text x="540" y="575" text-anchor="middle" font-size="20" font-weight="600" fill="#FFFFFF">1. Target customer</text>

  <!-- product-market fit -->
  <line x1="390" y1="374" x2="390" y2="426" stroke="#5A6672" stroke-width="2.5" marker-start="url(#ag)" marker-end="url(#ag)"/>
  <line x1="690" y1="374" x2="690" y2="426" stroke="#5A6672" stroke-width="2.5" marker-start="url(#ag)" marker-end="url(#ag)"/>
  <text x="540" y="407" text-anchor="middle" font-size="22" font-weight="700" fill="#002E5D">Product-market fit</text>

  <!-- halves -->
  <path d="M36,50 H28 V360 H36" fill="none" stroke="#B9C2CC" stroke-width="2"/>
  <path d="M36,440 H28 V610 H36" fill="none" stroke="#B9C2CC" stroke-width="2"/>
  <text x="48" y="214" font-size="22" font-weight="700" fill="#002E5D">Product</text>
  <text x="48" y="240" font-size="17" fill="#5A6672">you choose</text>
  <text x="48" y="528" font-size="22" font-weight="700" fill="#002E5D">Market</text>
  <text x="48" y="554" font-size="17" fill="#5A6672">you discover</text>

  <!-- 6. test with customers -->
  <path d="M556,44 C660,6 890,24 932,280 C952,410 942,520 922,596" fill="none" stroke="#0057B8" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#ah)"/>
  <text x="712" y="150" font-size="20" font-weight="600" fill="#0057B8">6. Test with</text>
  <text x="712" y="176" font-size="20" font-weight="600" fill="#0057B8">customers</text>
</svg>
