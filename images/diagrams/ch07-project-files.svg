<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1046" role="img" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>The files of a Next.js and Supabase project, and where each one runs</title>
  <desc>A list of the files in a Next.js and Supabase to-do app, grouped by what they do, with four columns showing where each one runs: the browser, which the user can read; the server, on Vercel; the database, on Supabase; and tools only, not the running app. A dashed line separates the browser column from the rest. Screens: app/layout.tsx, app/page.tsx, and app/tasks/page.tsx run on the server. Server endpoints: app/api/tasks/route.ts and proxy.ts run on the server. Components: components/TaskList.tsx, marked use client, and components/TaskItem.tsx run in the browser. Helper code: lib/supabase/client.ts runs in the browser and lib/supabase/server.ts on the server. Static files: public/logo.svg goes to the browser. Database schema: supabase/migrations/ runs in the database. Tests: tests/tasks.test.ts, tools only. Configuration: next.config.ts, tsconfig.json, and .gitignore, tools only. Dependencies: package.json and package-lock.json, tools only; node_modules/, not in git, runs in the browser and on the server. Build output: .next/, not in git, browser and server. Secrets: .env.local, not in git, server. For the agent: CLAUDE.md, AGENTS.md, and .claude/, tools only. For people: README.md, tools only.</desc>
