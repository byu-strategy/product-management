<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="ci-t ci-d" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="ci-t">What continuous integration does, and why it becomes the bottleneck</title>
<desc id="ci-d">Two parts. Top: what one CI check does. Your change is sent to GitHub, and an arrow leads into a panel labeled GitHub sets it up on a blank computer, holding four numbered steps in order: copy your code, download add-ons, put the app together, run the checks. From the last step, one arrow leads to a green check labeled works, and another to a red X labeled broken, sent back to fix. Bottom: two timelines drawn to the same scale of 0 to 51 minutes, labeled illustrative. Dashed lines connect the first CI check in the AI's timeline to the top panel, showing that each CI check is those four steps. AI writes: 3 minutes writing, a 10-minute CI check that fails, 2 minutes fixing, a 10-minute CI check that passes, then two more rounds of 3 minutes writing and a 10-minute CI check that passes. Total: 3 changes, with 40 of 51 minutes spent waiting on CI checks. Person writes: 41 minutes writing, then one 10-minute CI check that passes. Total: 1 change, with 10 of 51 minutes in CI.</desc>
