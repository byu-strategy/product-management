  <text x="344" y="496" font-size="17" font-weight="600" fill="#002E5D" text-anchor="middle">mat</text>
  <rect x="392" y="470" width="72" height="40" rx="20" fill="#FFFFFF" stroke="#B9D0EA" stroke-width="1.5" filter="url(#shs)"/>
  <text x="428" y="496" font-size="17" font-weight="600" fill="#002E5D" text-anchor="middle">mat</text>
