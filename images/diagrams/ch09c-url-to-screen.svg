<svg viewBox="0 0 1000 470" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>From URL to screen</title>
<desc>Left to right: a URL goes out as requests, and three kinds of files come back: HTML, the structure; CSS, the look; and JavaScript, the behavior. The browser builds the DOM, the page as a tree of elements, and draws it on the screen. A loop runs underneath: an event on the screen, such as a click, runs JavaScript, which changes the DOM or sends a new request. React works inside this loop.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0057B8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5A6672"/></marker><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.12"/></filter></defs>
