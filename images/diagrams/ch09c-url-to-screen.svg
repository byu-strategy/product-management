<svg viewBox="0 0 1000 490" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>From URL to screen</title>
<desc>Left to right: a URL goes out as requests, and three kinds of files come back: CSS, the look; HTML, the structure; and JavaScript, the behavior. The HTML builds the DOM, the page as a tree of elements, and the JavaScript changes it. The browser draws the DOM on the screen, and the CSS styles each element as it is drawn; the CSS is not part of the DOM. A loop runs underneath: an event on the screen, such as a click, runs JavaScript, which changes the DOM or sends a new request. React works inside this loop.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0057B8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5A6672"/></marker><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.12"/></filter></defs>
<rect width="1000" height="490" rx="8" fill="#FAFBFC"/>
<rect x="24" y="177" width="166" height="48" rx="24" fill="#FFFFFF" stroke="#002E5D" stroke-width="1.5"/>
<g transform="translate(38,189) scale(1)" fill="none" stroke="#002E5D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" />
  <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" />
  <path d="M2 12h20" /></g>
<text x="70" y="207" font-size="17" font-weight="700" fill="#002E5D" text-anchor="start">a URL</text>
<line x1="192" y1="201" x2="244" y2="201" stroke="#5A6672" stroke-width="2" marker-end="url(#ag)"/>
<text x="216" y="187" font-size="15" font-weight="400" fill="#5A6672" text-anchor="middle" paint-order="stroke" stroke="#FAFBFC" stroke-width="6">requests</text>
<text x="337" y="74" font-size="15" font-weight="600" fill="#5A6672" text-anchor="middle">files that come back</text>
<!-- CSS -->
<rect x="250" y="90" width="174" height="62" rx="10" fill="#FFFFFF" stroke="#D9DEE4" stroke-width="1.5" filter="url(#sh)"/>
<g transform="translate(264,109) scale(1)" fill="none" stroke="#002E5D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 12.5 8 15l2 2.5" />
  <path d="m14 12.5 2 2.5-2 2.5" />
  <path d="M14 2v4a2 2 0 0 0 2 2h4" />
  <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z" /></g>
<text x="298" y="118" font-size="17" font-weight="700" fill="#002E5D" text-anchor="start" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" xml:space="preserve">CSS</text>
<text x="298" y="139" font-size="15" font-weight="400" fill="#5A6672" text-anchor="start">look</text>
<!-- HTML -->
<rect x="250" y="170" width="174" height="62" rx="10" fill="#FFFFFF" stroke="#D9DEE4" stroke-width="1.5" filter="url(#sh)"/>
<g transform="translate(264,189) scale(1)" fill="none" stroke="#002E5D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 12.5 8 15l2 2.5" />
  <path d="m14 12.5 2 2.5-2 2.5" />
  <path d="M14 2v4a2 2 0 0 0 2 2h4" />
  <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z" /></g>
<text x="298" y="198" font-size="17" font-weight="700" fill="#002E5D" text-anchor="start" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" xml:space="preserve">HTML</text>
<text x="298" y="219" font-size="15" font-weight="400" fill="#5A6672" text-anchor="start">structure</text>
<!-- JavaScript -->
<rect x="250" y="250" width="174" height="62" rx="10" fill="#FFFFFF" stroke="#0057B8" stroke-width="2" filter="url(#sh)"/>
<g transform="translate(264,269) scale(1)" fill="none" stroke="#0057B8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 12.5 8 15l2 2.5" />
  <path d="m14 12.5 2 2.5-2 2.5" />
  <path d="M14 2v4a2 2 0 0 0 2 2h4" />
  <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z" /></g>
<text x="298" y="278" font-size="17" font-weight="700" fill="#0057B8" text-anchor="start" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" xml:space="preserve">JavaScript</text>
<text x="298" y="299" font-size="15" font-weight="400" fill="#5A6672" text-anchor="start">behavior</text>
<!-- The DOM -->
<rect x="515" y="170" width="210" height="222" rx="12" fill="#FFFFFF" stroke="#002E5D" stroke-width="1.5" filter="url(#sh)"/>
<text x="620" y="200" font-size="18" font-weight="700" fill="#002E5D" text-anchor="middle">The DOM</text>
<text x="620" y="221" font-size="15" font-weight="400" fill="#5A6672" text-anchor="middle">the page as a tree</text>
<line x1="620" y1="266" x2="575" y2="296" stroke="#8A939C" stroke-width="1.5"/>
<line x1="620" y1="266" x2="665" y2="296" stroke="#8A939C" stroke-width="1.5"/>
<line x1="575" y1="316" x2="545" y2="346" stroke="#8A939C" stroke-width="1.5"/>
<line x1="575" y1="316" x2="613" y2="346" stroke="#8A939C" stroke-width="1.5"/>
<rect x="593" y="244" width="54" height="24" rx="6" fill="#E6EEF7"/>
<text x="620" y="261" font-size="14.5" font-weight="400" fill="#002E5D" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" xml:space="preserve">page</text>
<rect x="548" y="294" width="54" height="24" rx="6" fill="#E6EEF7"/>
<text x="575" y="311" font-size="14.5" font-weight="400" fill="#002E5D" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" xml:space="preserve">list</text>
<rect x="629" y="294" width="72" height="24" rx="6" fill="#E6EEF7"/>
<text x="665" y="311" font-size="14.5" font-weight="400" fill="#002E5D" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" xml:space="preserve">button</text>
<rect x="518" y="344" width="54" height="24" rx="6" fill="#E6EEF7"/>
<text x="545" y="361" font-size="14.5" font-weight="400" fill="#002E5D" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" xml:space="preserve">task</text>
<rect x="586" y="344" width="54" height="24" rx="6" fill="#E6EEF7"/>
<text x="613" y="361" font-size="14.5" font-weight="400" fill="#002E5D" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" xml:space="preserve">task</text>
<!-- HTML builds, JavaScript changes -->
<line x1="426" y1="201" x2="509" y2="201" stroke="#5A6672" stroke-width="1.6" marker-end="url(#ag)"/>
<text x="467" y="191" font-size="15" font-weight="400" fill="#5A6672" text-anchor="middle">builds</text>
<line x1="426" y1="281" x2="509" y2="281" stroke="#5A6672" stroke-width="1.6" marker-end="url(#ag)"/>
<text x="467" y="271" font-size="15" font-weight="400" fill="#5A6672" text-anchor="middle">changes</text>
<!-- The screen -->
<rect x="780" y="178" width="196" height="160" rx="10" fill="#FFFFFF" stroke="#002E5D" stroke-width="1.5" filter="url(#sh)"/>
<rect x="780" y="178" width="196" height="22" rx="10" fill="#E6EEF7"/><rect x="780" y="190" width="196" height="10" fill="#E6EEF7"/>
<rect x="798" y="215" width="16" height="16" rx="3" fill="none" stroke="#5A6672" stroke-width="1.5"/>
<text x="824" y="228" font-size="15" font-weight="400" fill="#2C3E50" text-anchor="start">Buy groceries</text>
<rect x="798" y="249" width="16" height="16" rx="3" fill="none" stroke="#5A6672" stroke-width="1.5"/>
<text x="824" y="262" font-size="15" font-weight="400" fill="#2C3E50" text-anchor="start">Call dentist</text>
<rect x="798" y="290" width="74" height="30" rx="6" fill="#0057B8"/>
<text x="835" y="310" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Add</text>
<text x="860" y="166" font-size="18" font-weight="700" fill="#002E5D" text-anchor="middle">The screen</text>
<!-- DOM draws the screen -->
<line x1="727" y1="258" x2="774" y2="258" stroke="#5A6672" stroke-width="2" marker-end="url(#ag)"/>
<text x="751" y="248" font-size="15" font-weight="400" fill="#5A6672" text-anchor="middle">draws</text>
<!-- CSS styles each element when the screen is drawn -->
<path d="M426,121 L950,121 L950,172" fill="none" stroke="#5A6672" stroke-width="1.6" marker-end="url(#ag)"/>
<text x="620" y="111" font-size="15" font-weight="400" fill="#5A6672" text-anchor="middle">styles each element</text>
<!-- event loop -->
<path d="M835,324 L835,430 L337,430 L337,318" fill="none" stroke="#0057B8" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="600" y="418" font-size="16" font-weight="600" fill="#0057B8" text-anchor="middle" paint-order="stroke" stroke="#FAFBFC" stroke-width="6">a click (an event) runs JavaScript</text>
<text x="600" y="456" font-size="15" font-weight="400" fill="#5A6672" text-anchor="middle">which changes the DOM, or sends a new request. React works in this loop.</text>
</svg>
