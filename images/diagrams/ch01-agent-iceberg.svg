<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-labelledby="t d" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">A web chatbot shows only the model; a coding agent adds access below it</title>
<desc id="d">An iceberg in a waterline. Above the water is a small pale tip labeled LLM, text in, text out. A bracket beside the tip reads web chatbot, shows you this part. Below the water the iceberg is much larger and gets darker with depth, in three layers. System access: reads and writes files, runs commands on your computer. Code execution: writes code and runs it: tries, fails, fixes, retries. Tools and artifacts: .docx, .pptx, .xlsx, full apps, outside services, deploys. A bracket spanning the whole iceberg, tip included, reads coding agent, same model, plus access, and lists Antigravity, Claude Code, Codex, Copilot, and Cursor.</desc>
