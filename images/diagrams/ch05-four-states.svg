<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="t d" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">My shifts in four states</title>
<desc id="d">Four phone screens showing ShiftSwap's My shifts screen in the four states off the happy path. Empty: a calendar icon, the text 'Your shifts will show up here. Add them from a photo of the posted schedule, or type them in,' and two buttons, Scan schedule and Add a shift. Loading: gray placeholder rows shaped like shift cards, so the layout does not jump. Error: a message, 'We couldn't load your shifts. Check your connection and try again,' with a Try again button, and the shifts already on the phone shown faded under the label 'May be out of date.' Partial: shift cards that loaded normally, and one pending trade marked 'Approval status unavailable' with its own Refresh button.</desc>
