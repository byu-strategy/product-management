  <path d="M20 21a8 8 0 0 0-16 0" /></g>
<g transform="translate(912,126) scale(1.333)" fill="none" stroke="#8A939C" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5" />
  <path d="M20 21a8 8 0 0 0-16 0" /></g>
<text x="655.0" y="186" font-size="17" font-weight="600" text-anchor="middle" fill="#0057B8">flag on</text>
<text x="823.0" y="186" font-size="17" font-weight="600" text-anchor="middle" fill="#8A939C">flag off</text>
<rect x="631.0" y="250" width="300" height="80" rx="10" fill="url(#gCard)" stroke="#D9DEE4" stroke-width="1.5" filter="url(#sh)"/>
<circle cx="675.0" cy="290" r="24" fill="url(#gBlue)" stroke="#B9D0EA" stroke-width="1.5"/>
<g transform="translate(661,276) scale(1.167)" fill="none" stroke="#0057B8" stroke-width="1.89" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="12" x="2" y="6" rx="6" ry="6" />
