<circle cx="265.0" cy="290" r="24" fill="url(#gBlue)" stroke="#B9D0EA" stroke-width="1.5"/>
<g transform="translate(251,276) scale(1.167)" fill="none" stroke="#002E5D" stroke-width="1.89" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2v6a2 2 0 0 0 .245.96l5.51 10.08A2 2 0 0 1 18 22H6a2 2 0 0 1-1.755-2.96l5.51-10.08A2 2 0 0 0 10 8V2" />
  <path d="M6.453 15h11.094" />
  <path d="M8.5 2h7" /></g>
<text x="305.0" y="286" font-size="19" font-weight="700" fill="#002E5D">Staging app</text>
<text x="305.0" y="310" font-size="16" fill="#5A6672">staging URL</text>
<rect x="221.0" y="380" width="300" height="80" rx="10" fill="url(#gGray)" stroke="#D9DEE4" stroke-width="1.5" filter="url(#sh)"/>
<g transform="translate(251,406) scale(1.167)" fill="none" stroke="#5A6672" stroke-width="1.89" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3" />
  <path d="M3 5V19A9 3 0 0 0 21 19V5" />
  <path d="M3 12A9 3 0 0 0 21 12" /></g>
<text x="305.0" y="416" font-size="19" font-weight="700" fill="#002E5D">Staging database</text>
<text x="305.0" y="440" font-size="16" fill="#5A6672">test data</text>
<rect x="586" y="18" width="390" height="464" rx="10" fill="url(#gPanel)"/>
<text x="614" y="56" font-size="20" font-weight="700" letter-spacing="0.5" fill="#002E5D">FEATURE FLAG</text>
<text x="614" y="82" font-size="17" fill="#5A6672">a switch inside production</text>
