<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 749" role="img" aria-labelledby="t d" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title id="t">Persona: The Busy Mom, Lisa Bennett</title>
  <desc id="d">A one-page persona. A person icon sits beside the segment name, The Busy Mom, and the name Lisa Bennett. Demographics: age 32, female, married, bachelor's degree, teacher, income 55,000 dollars. A pull quote: My children's health is my top priority, but raising two kids is a full-time job, so I need an easy way to stay on top of their prescriptions and medical appointments. A short story: she is an elementary school teacher who lives with her husband Dave and their children Addison, 12, and Caleb, 9; Dave often works late, so Lisa is the primary caregiver; Addison has asthma and must always have her inhaler, and Lisa worries she might forget to refill the prescription. Three columns. Goals: be reminded of children's medical appointments, keep track of children's health information, refill prescriptions easily. Technology use: average, owns an iPhone, uses a desktop PC, uses Facebook to keep up with family and friends. Interests: spending time with family, being involved in her children's extracurricular activities, tennis.</desc>
