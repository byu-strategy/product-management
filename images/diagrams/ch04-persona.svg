  <text x="682" y="642" font-size="17" font-weight="400" fill="#2C3E50" text-anchor="start">activities</text>
  <circle cx="667" cy="668" r="3.5" fill="#0057B8"/>
  <text x="682" y="674" font-size="17" font-weight="400" fill="#2C3E50" text-anchor="start">Tennis</text>
