  <text x="360" y="210" font-size="16" font-weight="600" fill="#2C3E50" text-anchor="start">Married</text>
  <text x="560" y="162" font-size="16" font-weight="400" fill="#5A6672" text-anchor="start">Education</text>
  <text x="690" y="162" font-size="16" font-weight="600" fill="#2C3E50" text-anchor="start">Bachelor’s degree</text>
  <text x="560" y="186" font-size="16" font-weight="400" fill="#5A6672" text-anchor="start">Job</text>
  <text x="690" y="186" font-size="16" font-weight="600" fill="#2C3E50" text-anchor="start">Teacher</text>
  <text x="560" y="210" font-size="16" font-weight="400" fill="#5A6672" text-anchor="start">Income</text>
  <text x="690" y="210" font-size="16" font-weight="600" fill="#2C3E50" text-anchor="start">$55,000</text>
  <rect x="70" y="262" width="5" height="84" rx="2.5" fill="#0057B8"/>
  <text x="94" y="284" font-size="21" font-weight="500" fill="#0057B8" text-anchor="start">“My children’s health is my top priority, but raising two kids is a full-time</text>
  <text x="94" y="313" font-size="21" font-weight="500" fill="#0057B8" text-anchor="start">job, so I need an easy way to stay on top of their prescriptions and</text>
  <text x="94" y="342" font-size="21" font-weight="500" fill="#0057B8" text-anchor="start">medical appointments.”</text>
  <text x="70" y="392" font-size="17" font-weight="400" fill="#2C3E50" text-anchor="start">Elementary school teacher. Lives with her husband, Dave, and their children,</text>
  <text x="70" y="418" font-size="17" font-weight="400" fill="#2C3E50" text-anchor="start">Addison (12) and Caleb (9). Dave often works late, so Lisa is the primary caregiver.</text>
  <text x="70" y="444" font-size="17" font-weight="400" fill="#2C3E50" text-anchor="start">Addison has asthma and must always have her inhaler with her. Lisa worries she</text>
  <text x="70" y="470" font-size="17" font-weight="400" fill="#2C3E50" text-anchor="start">might forget to refill the inhaler prescription and put Addison in danger.</text>
