  <text x="230" y="86" font-size="16" font-weight="700" fill="#0057B8" text-anchor="start">THE BUSY MOM</text>
  <text x="230" y="126" font-size="36" font-weight="700" fill="#002E5D" text-anchor="start">Lisa Bennett</text>
