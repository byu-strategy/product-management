<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" role="img" aria-labelledby="t d" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title id="t">QuizMe break-even: each paying user contributes one block toward fixed costs</title>
  <desc id="d">A chart in dollars per month, from 0 to 50, with a dashed line at 45 dollars marked fixed costs. Two columns are built from stacked blocks, one block per paying user. The left column, all typical users, stacks blocks of 3 dollars 28 each, which is 4 dollars minus 27 cents of model calls minus 45 cents of payment fees. Thirteen blocks stay below the line; the fourteenth, highlighted, crosses it, so break-even is 14 paying users. The right column, 1 in 10 users a heavy user, stacks blocks of 2 dollars 77 each, which is 4 dollars minus an average of 78 cents of model calls minus 45 cents of fees. The seventeenth block, highlighted, crosses the line, so break-even is 17 paying users.</desc>
