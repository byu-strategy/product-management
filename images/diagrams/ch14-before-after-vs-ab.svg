  <rect x="776" y="372" width="164" height="36" rx="8" fill="#EDF0F3"/>
  <text x="858.0" y="396" text-anchor="middle" font-size="16" fill="#5A6672">Class assignment</text>
  <rect x="548" y="416" width="164" height="36" rx="8" fill="#EDF0F3"/>
  <text x="630.0" y="440" text-anchor="middle" font-size="16" fill="#5A6672">Club chat post</text>
  <rect x="776" y="416" width="164" height="36" rx="8" fill="#EDF0F3"/>
  <text x="858.0" y="440" text-anchor="middle" font-size="16" fill="#5A6672">Club chat post</text>
  <rect x="548" y="460" width="164" height="36" rx="8" fill="#EDF0F3"/>
  <text x="630.0" y="484" text-anchor="middle" font-size="16" fill="#5A6672">Everything else</text>
  <rect x="776" y="460" width="164" height="36" rx="8" fill="#EDF0F3"/>
  <text x="858.0" y="484" text-anchor="middle" font-size="16" fill="#5A6672">Everything else</text>
  <circle cx="54" cy="570" r="13" fill="#B03A3A"/>
  <path d="M48,564 L60,576 M60,564 L48,576" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <text x="78" y="576" font-size="19" font-weight="700" fill="#B03A3A">Four explanations, one number</text>
  <text x="78" y="604" font-size="17" fill="#2C3E50">The data cannot say which one moved it.</text>
  <circle cx="542" cy="570" r="13" fill="#2C7A4C"/>
  <path d="M535,570 L540,575 L549,564" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="566" y="576" font-size="19" font-weight="700" fill="#2C7A4C">Only the flow differs</text>
