  <line x1="376" y1="166" x2="376" y2="190" stroke="#C5CCD3" stroke-width="1.5" stroke-dasharray="3 4"/>
  <circle cx="140" cy="150" r="6" fill="#FAFBFC" stroke="#8A939C" stroke-width="2"/>
  <circle cx="376" cy="150" r="6" fill="#FAFBFC" stroke="#8A939C" stroke-width="2"/>
  <rect x="250" y="142" width="16" height="16" rx="2" transform="rotate(45 258 150)" fill="#0057B8"/>
  <text x="258" y="128" text-anchor="middle" font-size="15" font-weight="600" fill="#0057B8">new flow ships</text>
  <circle cx="744" cy="140" r="30" fill="url(#coin)" filter="url(#sh)"/>
  <circle cx="744" cy="140" r="23" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5"/>
  <text x="744" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">coin</text>
  <path d="M718,158 C684,176 644,178 630,192" fill="none" stroke="#8A939C" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M770,158 C804,176 844,178 858,192" fill="none" stroke="#8A939C" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="530" y="200" width="200" height="316" rx="10" fill="url(#card)" stroke="#E1E5EA" stroke-width="1" filter="url(#sh)"/>
  <text x="630" y="236" text-anchor="middle" font-size="19" font-weight="700" fill="#002E5D">Group A</text>
