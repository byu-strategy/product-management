  <g transform="translate(618.0,258) scale(1.0)" fill="none" stroke="#8A939C" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></g>
  <g transform="translate(646.0,258) scale(1.0)" fill="none" stroke="#8A939C" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></g>
  <g transform="translate(674.0,258) scale(1.0)" fill="none" stroke="#8A939C" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></g>
  <g transform="translate(790.0,258) scale(1.0)" fill="none" stroke="#8A939C" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></g>
  <g transform="translate(818.0,258) scale(1.0)" fill="none" stroke="#8A939C" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></g>
  <g transform="translate(846.0,258) scale(1.0)" fill="none" stroke="#8A939C" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></g>
  <g transform="translate(874.0,258) scale(1.0)" fill="none" stroke="#8A939C" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></g>
  <g transform="translate(902.0,258) scale(1.0)" fill="none" stroke="#8A939C" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></g>
