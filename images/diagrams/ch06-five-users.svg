<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 630" role="img" aria-labelledby="t d" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">Why five users per round</title>
<desc id="d">A line chart of the share of usability problems found against the number of users tested, from 0 to 15. The curve rises steeply at first and flattens: five users find about 85 percent of the problems, and users 6 to 15 mostly repeat problems already seen. Below the chart, three rounds of five users each are joined by arrows labeled Fix, showing that fifteen sessions are better spent as three rounds with a fix between each, so each retest checks that the fix worked.</desc>
