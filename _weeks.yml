# The 14-week reading order shown in the left rail's "Weeks" view (_extensions/week-view).
# Loaded into every page through `metadata-files` in _quarto.yml.
#
# start: the class date (YYYY-MM-DD). A week is "This week" from its start until the next
#        week's start, in the reader's local time. `course-end` closes the last one.
# read:  chapter files, without .qmd, in reading order. Prev/next links follow this order in
#        Weeks mode. A chapter not listed here appears under "Appendix and references".
# items: deadlines under the readings. kind is due, assigned, plan, exam, or task; href is optional.
#
# Keep in step with the tables in 00-schedule.qmd.

week-view:
  course-end: "2026-12-10"
  course-info: [index, 00-schedule, 00-assessments, 00-release-notes]
